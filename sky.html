<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星空</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060d;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;-webkit-touch-callout:none;}
  canvas{display:block;position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none;}
  .letter{
    position:fixed;left:0;right:0;bottom:6.5vh;
    padding:0 26px;box-sizing:border-box;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    text-align:center;
    color:rgba(226,235,255,.82);
    line-height:1.9;
    text-shadow:0 0 14px rgba(120,160,255,.22);
    opacity:0;transform:translateY(26px);
    transition:opacity 1.6s ease,transform 1.6s ease;
    pointer-events:none;
  }
  .letter.show{opacity:1;transform:translateY(0);}
  .letter::before{
    content:'';position:fixed;left:0;right:0;bottom:0;height:64vh;
    background:linear-gradient(to top,rgba(3,5,11,.95),rgba(3,5,11,.55) 45%,rgba(3,5,11,0));
    z-index:-1;
  }
  .letter .salute{font-size:13px;letter-spacing:.34em;margin:0 0 11px;}
  .letter .gbd{font-size:11.5px;letter-spacing:.05em;opacity:.92;text-align:left;text-indent:2em;}
  .letter .wish{font-size:12px;letter-spacing:.22em;margin-top:13px;}
  .letter .starline{font-size:12.5px;letter-spacing:.32em;margin-top:17px;opacity:.95;}
  .letter .sign{font-size:11.5px;letter-spacing:.14em;margin-top:13px;text-align:right;padding-right:4px;opacity:.78;}
  .bar{
    position:fixed;left:0;right:0;bottom:14px;z-index:7;
    display:flex;justify-content:center;gap:12px;
    opacity:0;transition:opacity 1.4s ease .6s;pointer-events:none;
  }
  .bar.show{opacity:1;pointer-events:auto;}
  .btn{
    padding:6px 20px;border-radius:999px;
    border:1px solid rgba(198,218,255,.32);
    background:rgba(10,16,32,.55);
    color:rgba(220,232,255,.85);
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:12px;letter-spacing:.3em;
    -webkit-tap-highlight-color:transparent;
  }
  .board{
    position:fixed;left:0;right:0;bottom:0;z-index:8;height:74vh;
    background:rgba(6,10,20,.95);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid rgba(150,180,255,.22);
    transform:translateY(105%);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;
    padding:14px 16px 16px;box-sizing:border-box;
    color:rgba(226,235,255,.9);
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
  }
  .board.open{transform:translateY(0);}
  .boardHead{display:flex;align-items:center;justify-content:space-between;
    font-size:13px;letter-spacing:.2em;opacity:.85;padding-bottom:10px;}
  .boardHead button{
    border:1px solid rgba(198,218,255,.3);background:transparent;
    color:rgba(220,232,255,.8);border-radius:999px;padding:3px 14px;
    font-family:inherit;font-size:12px;letter-spacing:.15em;
  }
  .boardList{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    border-top:1px solid rgba(150,180,255,.12);
    border-bottom:1px solid rgba(150,180,255,.12);
    padding:6px 2px;}
  .boardList .empty{font-size:12px;opacity:.45;text-align:center;padding:26px 0;letter-spacing:.1em;}
  .msg{padding:9px 0;border-bottom:1px dashed rgba(150,180,255,.1);}
  .msg .mh{font-size:11px;letter-spacing:.1em;opacity:.55;display:flex;gap:10px;}
  .msg .mb{font-size:13px;line-height:1.65;margin-top:4px;word-break:break-word;white-space:pre-wrap;}
  .boardForm{display:flex;flex-direction:column;gap:8px;padding-top:12px;}
  .boardForm input,.boardForm textarea{
    background:rgba(255,255,255,.05);border:1px solid rgba(150,180,255,.22);
    border-radius:8px;color:rgba(230,240,255,.95);
    font-family:inherit;font-size:13px;padding:9px 10px;outline:none;
    -webkit-user-select:text;user-select:text;touch-action:auto;
  }
  .boardForm textarea{height:58px;resize:none;}
  .sendRow{display:flex;align-items:center;gap:10px;}
  .sendBtn{padding:9px 24px;border-radius:999px;
    border:1px solid rgba(190,215,255,.42);
    background:rgba(40,60,110,.65);color:rgba(235,244,255,.95);
    font-family:inherit;font-size:13px;letter-spacing:.2em;
    -webkit-tap-highlight-color:transparent;}
  .sendBtn:disabled{opacity:.4;}
  .hint{font-size:11px;opacity:.5;letter-spacing:.06em;flex:1;text-align:right;}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="letter" id="letter">
  <div class="salute">展信舒颜</div>
  <div class="gbd">嘎哒嘎哒嘎嘎哒哒嘎哒嘎哒嘎哒嘎哒嘎嘎嘎嘎嘎嘎嘎哒哒哒哒嘎哒哒哒嘎哒嘎哒嘎哒嘎哒，咔咔，我的小啾啾，嘎哒嘎哒嘎哒，金币，我的小金币，嘎哒嘎哒，金币金币咔咔我的小啾啾，嘎哒嘎哒嘎嘎哒哒嘎哒！嘎哒？嘎哒嘎哒嘎哒！</div>
  <div class="wish">祝<br>心想事成</div>
  <div class="starline">想和你们一起看星星</div>
  <div class="sign">用户0126<br>2026/10.3</div>
</div>
<div class="bar" id="bar">
  <button class="btn" id="toggle">收信</button>
  <button class="btn" id="openBoard">留言</button>
</div>

<div class="board" id="board">
  <div class="boardHead">
    <div>留言 · <span id="cnt">0</span></div>
    <button id="closeBoard">收起</button>
  </div>
  <div class="boardList" id="boardList"><div class="empty">还没有人说话。</div></div>
  <div class="boardForm">
    <input id="mName" maxlength="20" placeholder="你的名字（可不填）">
    <textarea id="mBody" maxlength="200" placeholder="想说的话，200字以内"></textarea>
    <div class="sendRow">
      <button class="sendBtn" id="sendBtn">点亮</button>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('sky');
  var ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1;
  var stars=[],glows=[],shoots=[],sparks=[];
  var bgC=document.createElement('canvas');
  var T0=performance.now();
  var last=0, shootTimer=800;

  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function gauss(){
    var u=0,v=0;
    while(u===0)u=Math.random();
    while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }

  function build(){
    var ang=-0.40, cx=W*0.5, cy=H*0.52;
    var span=Math.max(W,H)*0.85;
    var n=Math.max(200,Math.min(700,Math.round(W*H/2600)));
    stars=[];glows=[];
    var i;
    for(i=0;i<n;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:0.3+Math.random()*1.25,
        p:Math.random()*6.283, s:0.4+Math.random()*1.5,
        born:Math.random()*3000,
        col:Math.random()<0.16?pick(['#cfe0ff','#fff1d6','#ffd7e6']):'#ffffff'
      });
    }
    for(i=0;i<22;i++){
      var t=(Math.random()*2-1)*span;
      var off=gauss()*Math.min(W,H)*0.09;
      glows.push({
        x:cx+Math.cos(ang)*t-Math.sin(ang)*off,
        y:cy+Math.sin(ang)*t+Math.cos(ang)*off,
        r:70+Math.random()*130
      });
    }
    var m=Math.round(n*0.85);
    for(i=0;i<m;i++){
      var tt=(Math.random()*2-1)*span*1.15;
      var o2=gauss()*Math.min(W,H)*0.13;
      var x=cx+Math.cos(ang)*tt-Math.sin(ang)*o2;
      var y=cy+Math.sin(ang)*tt+Math.cos(ang)*o2;
      if(x<-60||x>W+60||y<-60||y>H+60)continue;
      stars.push({
        x:x, y:y, r:0.2+Math.random()*0.8,
        p:Math.random()*6.283, s:0.3+Math.random()*1.0,
        born:Math.random()*3600, col:'#ffffff'
      });
    }
  }

  function paintBG(){
    bgC.width=Math.round(W*DPR);
    bgC.height=Math.round(H*DPR);
    var c=bgC.getContext('2d');
    c.setTransform(DPR,0,0,DPR,0,0);
    var bg=c.createLinearGradient(0,0,W*0.4,H);
    bg.addColorStop(0,'#05070f');
    bg.addColorStop(0.45,'#080e1d');
    bg.addColorStop(1,'#03050b');
    c.fillStyle=bg; c.fillRect(0,0,W,H);
    for(var i=0;i<glows.length;i++){
      var g=glows[i];
      var rg=c.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);
      rg.addColorStop(0,'rgba(150,180,255,0.06)');
      rg.addColorStop(0.5,'rgba(130,160,240,0.022)');
      rg.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=rg;
      c.beginPath(); c.arc(g.x,g.y,g.r,0,6.2832); c.fill();
    }
  }

  function resize(){
    var nw=window.innerWidth, nh=window.innerHeight;
    var needRebuild=(nw!==W)||(stars.length===0);
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=nw; H=nh;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(needRebuild){ build(); paintBG(); }
  }

  function spawnShoot(){
    var fromLeft=Math.random()<0.5;
    var sp=3.0+Math.random()*2.2;
    shoots.push({
      x:fromLeft?-60:W+60,
      y:Math.random()*H*0.6,
      vx:(fromLeft?1:-1)*sp,
      vy:sp*(0.30+Math.random()*0.35),
      life:0, max:0.9+Math.random()*0.6, trail:[]
    });
  }

  function loop(now){
    var dt=last?Math.min(0.05,(now-last)/1000):0.016;
    last=now;
    var t=now/1000, age=now-T0;
    var i,j;

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bgC,0,0,W,H);

    for(i=0;i<stars.length;i++){
      var st=stars[i];
      var k=(age-st.born)/2200;
      if(k<=0)continue;
      if(k>1)k=1;
      var tw=0.5+0.5*Math.sin(t*st.s+st.p);
      ctx.globalAlpha=(0.2+0.8*tw)*k;
      ctx.fillStyle=st.col;
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1;

    shootTimer-=dt*1000;
    if(shootTimer<=0){ spawnShoot(); shootTimer=1400+Math.random()*2600; }
    for(i=shoots.length-1;i>=0;i--){
      var s=shoots[i];
      s.x+=s.vx*dt*60; s.y+=s.vy*dt*60; s.life+=dt;
      s.trail.push({x:s.x,y:s.y});
      if(s.trail.length>26)s.trail.shift();
      var L=s.trail.length;
      var fade=Math.max(0,1-s.life/s.max);
      for(j=1;j<L;j++){
        var a=(j/L)*0.85*fade;
        if(a<=0.012)continue;
        ctx.strokeStyle='rgba(222,236,255,'+a.toFixed(3)+')';
        ctx.lineWidth=(j/L)*2.2;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(s.trail[j-1].x,s.trail[j-1].y);
        ctx.lineTo(s.trail[j].x,s.trail[j].y);
        ctx.stroke();
      }
      if(fade<=0||s.x<-140||s.x>W+140||s.y>H+140) shoots.splice(i,1);
    }

    for(i=sparks.length-1;i>=0;i--){
      var sp=sparks[i];
      sp.x+=sp.vx*dt*60; sp.y+=sp.vy*dt*60;
      sp.vy+=0.012; sp.vx*=0.988; sp.vy*=0.992;
      sp.life+=dt;
      var a2=1-sp.life/sp.max;
      if(a2<=0){ sparks.splice(i,1); continue; }
      ctx.globalAlpha=a2*0.9;
      ctx.fillStyle=sp.col||'#e2ecff';
      ctx.beginPath(); ctx.arc(sp.x,sp.y,sp.r*a2+0.2,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1;

    requestAnimationFrame(loop);
  }

  function addSpark(x,y,count,power){
    for(var i=0;i<count;i++){
      var a=Math.random()*6.2832;
      var sp=(0.35+Math.random()*1.7)*power;
      sparks.push({
        x:x, y:y,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-0.35,
        life:0, max:0.55+Math.random()*1.05,
        r:0.5+Math.random()*1.35,
        col: Math.random()<0.22?'#ffe6b0':'#dfe9ff'
      });
    }
  }

  var lastPt=null;
  cv.addEventListener('pointerdown',function(e){
    lastPt={x:e.clientX,y:e.clientY};
    addSpark(e.clientX,e.clientY,20,1.6);
  },{passive:true});

  cv.addEventListener('pointermove',function(e){
    var x=e.clientX, y=e.clientY;
    if(!lastPt){ lastPt={x:x,y:y}; return; }
    var dx=x-lastPt.x, dy=y-lastPt.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<2.5)return;
    var n=Math.max(1,Math.min(5,Math.round(d/5)));
    addSpark(x,y,n,1);
    lastPt={x:x,y:y};
  },{passive:true});

  cv.addEventListener('pointerup',function(){ lastPt=null; },{passive:true});
  cv.addEventListener('pointercancel',function(){ lastPt=null; },{passive:true});

  var letterEl=document.getElementById('letter');
  var barEl=document.getElementById('bar');
  var toggleEl=document.getElementById('toggle');
  var boardEl=document.getElementById('board');
  var listEl=document.getElementById('boardList');
  var cntEl=document.getElementById('cnt');
  var nameEl=document.getElementById('mName');
  var bodyEl=document.getElementById('mBody');
  var sendEl=document.getElementById('sendBtn');
  var hintEl=document.getElementById('hint');
  var letterOpen=false, boardOpen=false, busy=false;

  setTimeout(function(){
    letterEl.classList.add('show');
    barEl.classList.add('show');
    letterOpen=true;
  },3600);
  toggleEl.addEventListener('click',function(){
    letterOpen=!letterOpen;
    if(letterOpen){ letterEl.classList.add('show'); toggleEl.textContent='收信'; }
    else{ letterEl.classList.remove('show'); toggleEl.textContent='看信'; }
  });

  /* ---------- 留言板 ---------- */
  var SB_URL='https://qimbgzgklwtafbhvhjmh.supabase.co';
  var SB_KEY='sb_publishable_jLa9sDLq_fjeTrUNHff-aQ_LfZoTK5n';

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'"');
  }
  function fmtTime(ts){
    var d=new Date(ts);
    if(isNaN(d.getTime()))return '';
    function p(n){return n<10?'0'+n:''+n;}
    return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function render(rows){
    if(!rows||!rows.length){
      listEl.innerHTML='<div class="empty">还没有人说话。第一个说吧。</div>';
      cntEl.textContent='0';
      return;
    }
    cntEl.textContent=rows.length;
    var html='';
    for(var i=0;i<rows.length;i++){
      var m=rows[i];
      html+='<div class="msg"><div class="mh"><span>'+esc(m.name||'看星星的人')+
            '</span><span>'+fmtTime(m.created_at)+'</span></div><div class="mb">'+
            esc(m.body||'')+'</div></div>';
    }
    listEl.innerHTML=html;
  }
  function loadMsgs(){
    if(SB_KEY.indexOf('__')===0){
      listEl.innerHTML='<div class="empty">留言板还没接通。</div>';
      return;
    }
    fetch(SB_URL+'/rest/v1/sky_messages?select=id,name,body,created_at&order=id.desc&limit=300',{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    }).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    }).then(render).catch(function(){
      listEl.innerHTML='<div class="empty">连不上，检查下网络再进。</div>';
    });
  }
  function openBoardFn(){
    boardOpen=true;
    boardEl.classList.add('open');
    hintEl.textContent='加载中…';
    loadMsgs();
    setTimeout(function(){ if(hintEl.textContent==='加载中…')hintEl.textContent=''; },1600);
  }
  function closeBoardFn(){
    boardOpen=false;
    boardEl.classList.remove('open');
    hintEl.textContent='';
  }
  document.getElementById('openBoard').addEventListener('click',function(){
    if(boardOpen)closeBoardFn(); else openBoardFn();
  });
  document.getElementById('closeBoard').addEventListener('click',closeBoardFn);

  sendEl.addEventListener('click',function(){
    if(busy)return;
    var nm=(nameEl.value||'').trim()||'看星星的人';
    var tx=(bodyEl.value||'').trim();
    if(!tx){ hintEl.textContent='写点什么再点亮'; return; }
    if(SB_KEY.indexOf('__')===0){ hintEl.textContent='留言板还没接通'; return; }
    busy=true; sendEl.disabled=true; hintEl.textContent='发送中…';
    fetch(SB_URL+'/rest/v1/sky_messages',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
               'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({name:nm,body:tx})
    }).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      bodyEl.value='';
      hintEl.textContent='点亮了';
      for(var i=0;i<60;i++){
        var a=Math.random()*6.2832;
        var sp=0.6+Math.random()*3.0;
        sparks.push({x:W/2,y:H*0.45,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
          life:0,max:0.8+Math.random()*1.1,r:0.6+Math.random()*1.5,col:'#ffe6b0'});
      }
      loadMsgs();
      setTimeout(function(){ hintEl.textContent=''; },2200);
    }).catch(function(){
      hintEl.textContent='发不出去，等会儿再试';
    }).then(function(){
      busy=false; sendEl.disabled=false;
    });
  });

  window.addEventListener('resize',resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
