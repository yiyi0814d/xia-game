<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>已就寝 · 家校通</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Courier New","Microsoft YaHei",monospace; -webkit-tap-highlight-color:transparent; }
body { background:#0d0d0d; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:8px; }
.phone { width:100%; max-width:420px; height:94vh; max-height:900px; background:#000; border:2px solid #1d1d1d; border-radius:30px; display:flex; flex-direction:column; overflow:hidden; position:relative; box-shadow:0 0 50px rgba(0,255,0,.06); }

.status-bar { height:28px; background:#000; display:flex; justify-content:space-between; align-items:center; padding:0 15px; font-size:11px; color:#0f0; border-bottom:1px solid #1a1a1a; flex-shrink:0; }
.rec { color:#f44; animation:blink 1.2s infinite; }
@keyframes blink { 0%,60%{opacity:1} 70%,100%{opacity:.15} }

.monitor { position:relative; background:#000; border-bottom:1px solid #1a1a1a; flex-shrink:0; }
.monitor-header { display:flex; justify-content:space-between; padding:6px 10px; font-size:11px; color:#0f0; background:#0a0a0a; border-bottom:1px solid #141414; }
.monitor-header .warn { color:#f44; }
#cv { display:block; width:100%; height:auto; background:#0b1410; touch-action:manipulation; }
.monitor-screen { position:relative; }
.monitor-screen::before { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,255,0,.05) 3px,rgba(0,0,0,0) 4px); z-index:5; }
.monitor-screen.tap-hint::after { content:"点击画面 · 计数"; position:absolute; left:0; right:0; bottom:6px; text-align:center; font-size:10px; color:#0f0; background:rgba(0,0,0,.75); padding:3px 0; z-index:6; animation:blink 1.6s infinite; }
.monitor-screen.glitch #cv { animation:jit .1s infinite; }
@keyframes jit { 0%{transform:translate(0,0)} 25%{transform:translate(-2px,1px)} 50%{transform:translate(2px,-1px)} 75%{transform:translate(-1px,-1px)} 100%{transform:translate(0,0)} }
.monitor-screen.off #cv { filter:brightness(.15); }
.monitor-info { display:flex; justify-content:space-between; padding:4px 10px; font-size:9px; color:#0f0; background:#050505; border-top:1px solid #111; }

.chat { flex:1; overflow-y:auto; padding:9px; background:#0a0a0a; min-height:70px; }
.message { max-width:84%; margin-bottom:8px; padding:6px 9px; font-size:12.5px; line-height:1.55; border-radius:5px; word-break:break-word; animation:fade .25s ease; }
@keyframes fade { from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }
.message.system { background:#111; color:#0f0; border:1px solid #222; margin:0 auto 8px; text-align:center; font-size:11.5px; max-width:93%; }
.message.teacher { background:#132013; color:#cfeccf; border-left:2px solid #0f0; }
.message.me { background:#101d2b; color:#c9e2ff; margin-left:auto; border-right:2px solid #4af; }
.message.chenmo { background:#2a1212; color:#ffd2d2; border-left:2px solid #f44; }
.message.sysred { background:#1a0505; color:#f66; border:1px solid #401010; margin:0 auto 8px; text-align:center; font-size:11.5px; max-width:93%; }
.message.parents { background:#121820; color:#9fc4dd; border-left:2px solid #357; font-size:11.5px; }

.choices { padding:8px 10px 10px; background:#000; border-top:1px solid #151515; display:flex; flex-direction:column; gap:6px; flex-shrink:0; max-height:32%; overflow-y:auto; }
.choice-btn { padding:8px 10px; background:#0a1a0a; color:#0f0; border:1px solid #0f0; border-radius:4px; font-size:12.5px; text-align:left; cursor:pointer; font-family:inherit; }
.choice-btn:active { background:#0f0; color:#000; }
.choice-btn.danger { background:#220808; color:#f66; border-color:#f44; }
.choice-btn.danger:active { background:#f44; color:#fff; }

.mask { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:30; padding:26px; text-align:center; }
.mask h1 { font-size:19px; color:#0f0; letter-spacing:6px; margin-bottom:8px; }
.mask .sub { font-size:10px; color:#3a5; margin-bottom:8px; letter-spacing:2px; line-height:1.8; }
.enter { margin-top:22px; padding:10px 24px; background:transparent; color:#0f0; border:1px solid #0f0; font-family:inherit; font-size:12.5px; letter-spacing:3px; cursor:pointer; }

.ending { position:absolute; inset:0; background:#000; color:#f44; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:26px; text-align:center; z-index:20; overflow-y:auto; }
.ending h2 { margin-bottom:14px; color:#f44; letter-spacing:5px; font-size:18px; }
.ending .tagline { font-size:10px; color:#622; margin-bottom:16px; letter-spacing:2px; }
.ending p { margin-bottom:9px; line-height:1.85; font-size:12.5px; color:#d8c8c8; }
.ending p.hl { color:#f66; }
.reset-btn { margin-top:20px; padding:9px 16px; background:transparent; color:#f44; border:1px solid #f44; cursor:pointer; font-family:inherit; font-size:11.5px; }
.hidden { display:none !important; }
.eq { display:inline-block; width:6px; height:9px; background:#f44; margin-left:3px; animation:blink .8s infinite; vertical-align:-1px; }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span id="clock">21:14</span>
    <span>家校通 · 家长端</span>
    <span class="rec">● REC</span>
  </div>

  <div class="monitor">
    <div class="monitor-header">
      <span id="camTitle">高一(7)班 · 晚自习</span>
      <span class="warn" id="alarm">未就寝提醒</span>
    </div>
    <div class="monitor-screen" id="mScreen">
      <canvas id="cv"></canvas>
    </div>
    <div class="monitor-info">
      <span>AI在室 <span id="count" class="red">46</span>/46</span>
      <span id="mclock">21:14</span>
      <span id="who">陈默 · 墙角站立</span>
    </div>
  </div>

  <div class="chat" id="chat"></div>
  <div class="choices" id="choices"></div>

  <div class="mask" id="startMask">
    <h1>已 就 寝</h1>
    <div class="sub">家校通 · 高一(7)班家长端<br>建议戴耳机 · 关灯 · 一个人</div>
    <button class="enter" id="enterBtn">进 入 监 控</button>
  </div>

  <div class="ending hidden" id="ending">
    <h2 id="endTitle"></h2>
    <div class="tagline" id="endTag"></div>
    <div id="endBody"></div>
    <button class="reset-btn" onclick="location.reload()">回到 21:14</button>
  </div>

</div>

<script>
(function () {
  "use strict";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = 480, H = 250;
  cv.width = W; cv.height = H;

  var chatEl = document.getElementById("chat");
  var choicesEl = document.getElementById("choices");
  var countEl = document.getElementById("count");
  var mclockEl = document.getElementById("mclock");
  var clockEl = document.getElementById("clock");
  var alarmEl = document.getElementById("alarm");
  var mScreen = document.getElementById("mScreen");
  var endingEl = document.getElementById("ending");
  var camTitle = document.getElementById("camTitle");
  var whoEl = document.getElementById("who");

  var S = {
    time: 2114,
    seats: [],
    lit: 0,
    counting: false,
    done: false,
    mode: "normal",      // normal | turned | zoomCorner | yesterday | stranger
    ended: false,
    watchStart: Date.now(),
    locked: false        // 锁定选项，防止乱点
  };

  // ================= 声音 =================
  var AC = null;
  function initAudio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  }
  function tone(freq, dur, type, gain, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = gain || 0.05;
    o.connect(g); g.connect(AC.destination);
    var t = AC.currentTime + (delay || 0);
    o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, hp) {
    if (!AC) return;
    var len = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (vol || 0.25);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 1400;
    var g = AC.createGain(); g.gain.value = 0.06;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start();
  }
  function heartbeat(times) {
    for (var i = 0; i < times; i++) {
      tone(58, 0.16, "sine", 0.09, i * 0.55);
      tone(46, 0.20, "sine", 0.07, i * 0.55 + 0.18);
    }
  }
  function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p || 70); } catch (e) {} } }

  // ================= 座位 =================
  function buildSeats() {
    S.seats = [];
    for (var r = 0; r < 8; r++) {
      for (var c = 0; c < 6; c++) {
        if (r === 7 && c >= 4) continue;
        S.seats.push({ x: 62 + c * 66, y: 84 + r * 18, n: 0, turned: false });
      }
    }
  }

  function px(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }

  function person(x, y, body, opt) {
    opt = opt || {};
    // 头
    px(x + 2, y, 4, 3, "#f2c292");
    // 身体
    px(x, y + 3, 8, 5, body);
    if (opt.front) {
      // 面朝镜头：两点眼睛
      px(x + 2, y + 1, 1, 1, "#1a0a0a");
      px(x + 5, y + 1, 1, 1, "#1a0a0a");
    }
    if (opt.label) {
      ctx.fillStyle = opt.labelColor || "rgba(220,255,220,.9)";
      ctx.font = "9px monospace";
      ctx.textAlign = "center";
      ctx.fillText(String(opt.label), x + 4, y - 2);
      ctx.textAlign = "left";
    }
  }

  function draw() {
    var mode = S.mode;

    px(0, 0, W, H, mode === "yesterday" ? "#08100c" : "#0b1410");

    // 网格
    ctx.strokeStyle = "rgba(0,255,0,.045)";
    ctx.lineWidth = 1;
    for (var gx = 0; gx < W; gx += 8) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (var gy = 0; gy < H; gy += 8) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

    if (mode === "zoomCorner") {
      // 墙角特写
      px(0, 0, W, H, "#0d1712");
      ctx.strokeStyle = "rgba(0,255,0,.12)";
      for (var zx = 0; zx < W; zx += 16) { ctx.beginPath(); ctx.moveTo(zx, 0); ctx.lineTo(zx, H); ctx.stroke(); }
      for (var zy = 0; zy < H; zy += 16) { ctx.beginPath(); ctx.moveTo(0, zy); ctx.lineTo(W, zy); ctx.stroke(); }
      // 墙角线
      ctx.strokeStyle = "rgba(0,255,0,.6)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(150, 20); ctx.lineTo(150, 230); ctx.lineTo(430, 230); ctx.stroke();
      ctx.lineWidth = 1;
      // 大号陈默（背对，脸贴墙）
      var bx = 168, by = 120;
      px(bx + 6, by, 12, 9, "#e8bb92");      // 头
      px(bx + 4, by + 9, 16, 26, "#d94f4f"); // 身体
      px(bx + 5, by + 35, 6, 22, "#7a2b2b");
      px(bx + 13, by + 35, 6, 22, "#7a2b2b");
      px(bx - 6, by + 12, 5, 18, "#d94f4f"); // 左臂
      px(bx + 25, by + 12, 5, 18, "#d94f4f"); // 右臂
      ctx.fillStyle = "rgba(255,120,120,.85)";
      ctx.font = "11px monospace";
      ctx.fillText("放大 4x · 陈默", 190, 60);
      ctx.fillStyle = "rgba(200,255,200,.5)";
      ctx.font = "10px monospace";
      ctx.fillText("姿态：静止", 190, 78);
      ctx.fillText("呼吸起伏：无", 190, 94);
      // 地板
      px(0, 238, W, 12, "#051005");
      return;
    }

    // 黑板
    px(18, 6, 444, 26, "#12241a");
    ctx.strokeStyle = "rgba(0,255,120,.35)";
    ctx.strokeRect(18.5, 6.5, 443, 25);
    ctx.fillStyle = "rgba(160,255,180,.55)";
    ctx.font = "11px monospace";
    ctx.fillText("晚自习 · 请保持安静", 28, 24);

    // 讲台
    px(14, 44, 54, 14, "#1a3a1a");
    ctx.strokeStyle = "rgba(0,255,0,.45)";
    ctx.strokeRect(14.5, 44.5, 53, 13);
    ctx.fillStyle = "rgba(0,255,0,.5)";
    ctx.font = "9px monospace";
    ctx.fillText("讲台", 16, 42);

    // 墙角
    ctx.strokeStyle = "rgba(0,255,0,.5)";
    ctx.beginPath();
    ctx.moveTo(432, 46); ctx.lineTo(432, 196); ctx.lineTo(470, 196);
    ctx.stroke();
    px(432, 46, 38, 150, "rgba(0,255,0,.045)");
    ctx.fillStyle = "rgba(0,255,0,.5)";
    ctx.font = "9px monospace";
    ctx.fillText("墙角", 438, 42);

    // 学生
    for (var i = 0; i < S.seats.length; i++) {
      var s = S.seats[i];
      person(s.x, s.y, "#2f6fe0", {
        front: (mode === "turned" || mode === "stranger") || s.turned,
        label: s.n || "",
        labelColor: (mode === "turned") ? "rgba(255,90,90,.95)" : "rgba(220,255,220,.9)"
      });
    }

    // 陈默（站立，背对，脸贴墙）
    var cmX = 448, cmY = 182;
    px(cmX + 2, cmY, 5, 3, "#f2c292");
    px(cmX, cmY + 3, 9, 6, "#d94f4f");
    px(cmX + 1, cmY + 9, 3, 4, "#a03333");
    px(cmX + 5, cmY + 9, 3, 4, "#a03333");
    ctx.fillStyle = "rgba(255,120,120,.85)";
    ctx.font = "9px monospace";
    ctx.fillText("陈默（站着）", 398, 175);

    // 第 47 个
    if (mode === "stranger") {
      var sx = 232, sy = 196;
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.fillRect(sx - 8, sy - 8, 28, 38);
      px(sx + 3, sy, 7, 5, "#dcdcdc");
      px(sx - 1, sy + 5, 15, 11, "#9a9a9a");
      px(sx + 1, sy + 16, 5, 8, "#5a5a5a");
      px(sx + 8, sy + 16, 5, 8, "#5a5a5a");
      px(sx + 4, sy + 1, 2, 2, "#000");
      px(sx + 9, sy + 1, 2, 2, "#000");
      ctx.fillStyle = "rgba(255,80,80,.9)";
      ctx.fillRect(sx - 8, sy + 26, 30, 1);
      ctx.font = "9px monospace";
      ctx.fillText("未登记", sx - 4, sy + 38);
    }

    // 地板
    px(0, 232, W, H - 232, "#051005");
    px(0, 232, W, 1, "rgba(0,255,0,.25)");

    // 时间戳
    ctx.font = "10px monospace";
    ctx.fillStyle = "rgba(0,255,0,.55)";
    ctx.fillText((mode === "yesterday" ? "10-30 " : "") + fmt(S.time), 20, H - 6);
    ctx.fillStyle = "rgba(0,255,0,.35)";
    ctx.textAlign = "right";
    ctx.fillText("CAM-07", W - 16, H - 6);
    ctx.textAlign = "left";
  }

  function fmt(t) {
    return String(Math.floor(t / 100)).padStart(2, "0") + ":" + String(t % 100).padStart(2, "0");
  }
  function setClock() {
    mclockEl.textContent = fmt(S.time);
    clockEl.textContent = fmt(S.time);
  }

  // ================= 界面 =================
  function addMsg(text, type, delay) {
    if (delay) { setTimeout(function () { addMsg(text, type); }, delay); return; }
    var d = document.createElement("div");
    d.className = "message " + type;
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (type === "system" || type === "sysred") { tone(760, 0.05, "square", 0.03); }
    if (type === "chenmo") { tone(340, 0.09, "triangle", 0.035); buzz(40); }
  }

  function setChoices(list) {
    choicesEl.innerHTML = "";
    S.locked = false;
    list.forEach(function (item) {
      var b = document.createElement("button");
      b.className = "choice-btn" + (item.danger ? " danger" : "");
      b.textContent = item.text;
      b.onclick = function () {
        if (S.locked) return;
        S.locked = true;
        tone(520, 0.05, "square", 0.04);
        buzz(20);
        item.action();
      };
      choicesEl.appendChild(b);
    });
  }
  function clearChoices() { choicesEl.innerHTML = ""; }

  function glitch(ms) {
    mScreen.classList.add("glitch");
    noise(0.45, 0.35);
    setTimeout(function () { mScreen.classList.remove("glitch"); }, ms || 600);
  }

  // ================= 剧情 =================
  var talkedShot = false;   // 是否已看过“放大墙角”
  var checkedRoll = false;  // 是否已回看昨天

  function begin() {
    addMsg("系统：您收到一条家校通提醒", "system");
    addMsg("王老师：陈默妈妈您好，陈默晚自习期间持续趴桌，状态不太好。", "teacher", 500);
    addMsg("王老师：查寝系统显示他未就寝，但宿舍老师说他已经回寝了。", "teacher", 1400);
    addMsg("家长群-李思远妈妈：我家思远也在教室，老师说他在宿舍。", "parents", 2400);
    addMsg("家长群-周洋爸爸：我也看到我儿子了。灯是关的，他坐在那儿。", "parents", 3200);
    addMsg("王老师：各位家长，监控画面可能存在延迟或缓存，请不要紧张。", "teacher", 4200);
    setTimeout(sceneB, 5400);
  }

  function sceneB() {
    S.time = 2126; setClock();
    S.mode = "normal"; draw();
    addMsg("系统：您已进入 CAM-07 实时画面", "system");
    setChoices([
      { text: "放大墙角", action: function () {
          if (talkedShot) {
            addMsg("我：已经放过了。他还是那个姿势。", "me");
            setTimeout(sceneB, 700);
            return;
          }
          talkedShot = true;
          S.mode = "zoomCorner"; draw();
          glitch(400);
          addMsg("我：放大。", "me");
          addMsg("系统：放大成功 · 4x", "system", 700);
          addMsg("他的脸贴着墙。角度不自然。", "sysred", 1600);
          addMsg("你把画面又放大了一级。系统提示：已达最大倍率。", "sysred", 2600);
          setTimeout(function () {
            S.mode = "normal"; draw();
            addMsg("我：……", "me");
            setTimeout(sceneB, 700);
          }, 4200);
        }
      },
      { text: "回看昨天的录像", action: function () {
          if (checkedRoll) {
            addMsg("我：昨天和今天一模一样。我不想再看第三遍。", "me");
            setTimeout(sceneB, 700);
            return;
          }
          checkedRoll = true;
          S.mode = "yesterday"; S.time = 2114; setClock();
          camTitle.textContent = "高一(7)班 · 10月30日 21:14";
          draw();
          noise(0.6, 0.3);
          addMsg("系统：正在调取 10月30日 21:14 录像", "system");
          addMsg("四十六个人坐得整整齐齐。他站在墙角。", "sysred", 1200);
          addMsg("你又拖回去看了两遍。", "sysred", 2200);
          addMsg("左手扶墙，右手垂着。连角度都一样。", "sysred", 3200);
          addMsg("昨天他也是这个姿势。前天也是。", "sysred", 4200);
          setTimeout(function () {
            S.mode = "normal"; S.time = 2126; setClock();
            camTitle.textContent = "高一(7)班 · 晚自习";
            draw();
            setTimeout(sceneB, 600);
          }, 5200);
        }
      },
      { text: "打给陈默", danger: true, action: function () {
          addMsg("我：陈默。", "me");
          S.time = 2131; setClock();
          setTimeout(function () {
            addMsg("陈默：妈，我洗漱完上床了。", "chenmo");
            addMsg("我：那你抬头，看教室前面的摄像头。", "me", 1500);
            setTimeout(function () {
              addMsg("系统：画面中检测到光源变化", "system");
              S.mode = "normal"; draw();
              // 陈默举起手机（画一块亮光）
              var g2 = ctx.createLinearGradient(440, 170, 470, 200);
              g2.addColorStop(0, "rgba(180,220,255,.9)");
              g2.addColorStop(1, "rgba(60,120,180,.1)");
              ctx.fillStyle = g2;
              ctx.fillRect(438, 168, 14, 16);
              addMsg("他举起了手机。屏幕的光打在他脸上。", "sysred", 900);
              addMsg("他的脸，是朝着墙的。", "sysred", 2200);
              addMsg("陈默：妈，我睡了。", "chenmo", 3200);
              setTimeout(sceneD, 4200);
            }, 2200);
          }, 1100);
        }
      }
    ]);
  }

  function sceneD() {
    S.time = 2153; setClock();
    addMsg("王老师：陈默妈妈，我就在教室门口。", "teacher");
    addMsg("王老师：灯关着，一个人都没有。", "teacher", 900);
    setChoices([
      { text: "请老师把灯打开", action: function () {
          addMsg("我：王老师，麻烦您把灯打开，我正在看监控。", "me");
          mScreen.classList.add("off");
          addMsg("系统：CAM-07 信号中断", "sysred", 800);
          glitch(1200);
          addMsg("系统：信号中断 4 秒", "sysred", 2000);
          setTimeout(function () {
            mScreen.classList.remove("off");
            addMsg("王老师：开了。空的。桌椅都在，没有人。", "teacher");
            S.mode = "turned"; draw();
            noise(0.8, 0.45, 900);
            heartbeat(2);
            addMsg("系统：画面恢复", "system", 1200);
            addMsg("四十六个人，全都抬起了头。", "sysred", 2200);
            addMsg("全都朝着镜头。", "sysred", 3000);
            setTimeout(sceneE, 4200);
          }, 2800);
        }
      },
      { text: "我现在开车过去", danger: true, action: function () {
          addMsg("我：我现在开车过去。", "me");
          setTimeout(function () { endingC(); }, 1200);
        }
      }
    ]);
  }

  function sceneE() {
    addMsg("系统：AI在室学生 46/应到46。", "system");
    addMsg("系统：全员在座。", "system", 800);
    setChoices([
      { text: "我数一数", action: function () { startCount(); } },
      { text: "关掉家校通，睡觉", danger: false, action: function () {
          addMsg("我：明天还要上班。", "me");
          setTimeout(function () { endingA(); }, 1200);
        }
      }
    ]);
  }

  // ---------- 数人头 ----------
  function startCount() {
    addMsg("我：不可能。我一个一个数。", "me");
    clearChoices();
    S.counting = true;
    S.lit = 0;
    S.mode = "normal";
    for (var i = 0; i < S.seats.length; i++) { S.seats[i].n = 0; S.seats[i].turned = false; }
    draw();
    mScreen.classList.add("tap-hint");
    addMsg("（点画面，一个一个数）", "system");
    cv.addEventListener("touchstart", onTap, { passive: true });
    cv.addEventListener("click", onTap);
    // 中途可以退出
    setChoices([
      { text: "我不数了", danger: true, action: function () { endingD(); } }
    ]);
  }

  function onTap() {
    if (!S.counting || S.done) return;
    var idx = S.lit;
    if (idx >= 46) return;
    S.seats[idx].n = idx + 1;
    S.lit++;

    // 数到 23，那一个转过来
    if (S.lit === 23) {
      S.seats[22].turned = true;
      noise(0.35, 0.4, 700);
      buzz([60, 40, 120]);
      addMsg("系统：第 23 位 · 姿态变化", "sysred");
      addMsg("这一个，转过头了。", "sysred", 600);
    }

    tone(430 + idx * 11, 0.045, "square", 0.03);
    if (S.lit % 10 === 0) {
      buzz(20);
      heartbeat(1);
      addMsg("系统：已核对 " + S.lit + "/46", "system");
    }
    draw();

    if (S.lit >= 46) {
      S.done = true;
      S.counting = false;
      mScreen.classList.remove("tap-hint");
      cv.removeEventListener("touchstart", onTap);
      cv.removeEventListener("click", onTap);
      clearChoices();
      setTimeout(countDone, 600);
    }
  }

  function countDone() {
    addMsg("系统：清点完成。全员在座。", "system");
    // 三秒静默：什么都不发生，只有画面在动
    var t = 0;
    var iv = setInterval(function () {
      t++;
      if (t % 2 === 0) { noise(0.12, 0.12, 2500); }
    }, 400);
    setTimeout(function () { clearInterval(iv); }, 3200);

    setTimeout(function () {
      // 全员转向镜头
      S.mode = "turned"; draw();
      noise(0.9, 0.5, 800);
      heartbeat(3);
      buzz([200, 100, 200]);
      addMsg("所有头。同时转了过来。", "sysred");
      setTimeout(function () {
        glitch(700);
        addMsg("系统：检测到新增人员 1 · 未登记", "sysred");
        S.mode = "stranger"; draw();
        setTimeout(function () {
          addMsg("陈默：妈，你回头看。", "chenmo");
          buzz(320);
          setTimeout(function () { endingB(); }, 2000);
        }, 2300);
      }, 1800);
    }, 3400);
  }

  // ================= 结局 =================
  function showEnding(title, tag, bodyArr) {
    if (S.ended) return;
    S.ended = true;
    S.counting = false;
    mScreen.classList.remove("tap-hint");
    clearChoices();
    document.getElementById("endTitle").textContent = title;
    document.getElementById("endTag").textContent = tag;
    var box = document.getElementById("endBody");
    box.innerHTML = "";
    bodyArr.forEach(function (line) {
      var p = document.createElement("p");
      if (line.indexOf("!") === 0) { p.className = "hl"; p.textContent = line.slice(1); }
      else p.textContent = line;
      box.appendChild(p);
    });
    endingEl.classList.remove("hidden");
    tone(64, 1.2, "sawtooth", 0.05);
  }

  function endingA() {
    showEnding("已 就 寝", "你看过的东西，也在看你", [
      "你把手机扣在床头，闭了眼。",
      "第二天早上六点四十，陈默回家吃早饭，书包挂在椅背上，问你煎蛋放没放盐。",
      "一切正常。",
      "晚上九点十四，家校通又推了一条：未就寝提醒。",
      "你点开。",
      "!46/46。他还站在那个墙角，姿势一模一样。",
      "你翻回去看昨晚的录像。也是 21:14。",
      "你终于明白——",
      "!这间教室里的时间，从来没走过。",
      "!而你也从来没有走出去。"
    ]);
  }

  function endingB() {
    var sec = Math.max(1, Math.round((Date.now() - S.watchStart) / 1000));
    var mm = Math.floor(sec / 60), ss = sec % 60;
    showEnding("第 47 个", "您已观看 " + mm + " 分 " + ss + " 秒", [
      "监控显示：AI在室学生 46/46。",
      "四十六个人端端正正坐着，你一个一个数过。",
      "墙角那一个，不算在编号里。",
      "!那第 47 个，是谁？",
      "是正在数人的你。",
      "家长端账号：x女士",
      "观看时长：" + mm + " 分 " + ss + " 秒",
      "!您也被记录在监控里。"
    ]);
  }

  function endingC() {
    S.time = 2330; setClock();
    showEnding("第 48 个", "照片不会骗人。人会。", [
      "你十一点半到学校，门卫看了家长证，放你进去。",
      "三楼走廊只有应急灯。高一(7)班的门开着。",
      "里面是空的。桌椅摆得整整齐齐，黑板擦得干干净净。",
      "你举着手机，拍了一张。",
      "回到家你翻相册——",
      "!照片里，四十六个学生端端正正坐在位子上。",
      "!墙角站着陈默。",
      "!门口还站着一个举着手机的女人。",
      "你把照片放大到最大。",
      "!她的脸，是你。"
    ]);
  }

  function endingD() {
    showEnding("未完成", "剩余未核对：1 人", [
      "你把手机翻过来扣在桌上，闭了眼。",
      "三分钟后，家校通又响了一次。",
      "系统：清点中断。剩余未核对 —— 1 人。",
      "你没敢再点开。",
      "第二天，同一条推送又来了。",
      "第三天，第四天，每一天。",
      "!一直到今天，还是那一条。",
      "剩余未核对：1 人。"
    ]);
  }

  // ================= 启动 =================
  buildSeats();
  draw();
  setClock();

  document.getElementById("enterBtn").addEventListener("click", function () {
    initAudio();
    tone(880, 0.06, "square", 0.05);
    noise(0.25, 0.2, 3000);
    document.getElementById("startMask").classList.add("hidden");
    begin();
  });

  // 画面本身一直在轻微呼吸
  setInterval(function () {
    if (S.ended) return;
    ctx.fillStyle = "rgba(0,0,0,.02)";
    ctx.fillRect(0, 0, W, H);
  }, 380);

})();
</script>

</body>
</html>
