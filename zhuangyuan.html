<style>

  .rbtn{position:fixed;right:14px;z-index:22;width:64px;height:64px;border-radius:50%;color:#fff;

  #errBar{position:fixed;left:0;right:0;top:0;z-index:99;display:none;background:#b23a2f;color:#fff;

  #helpBtn{position:fixed;left:12px;top:118px;z-index:8;width:36px;height:36px;border-radius:12px;
    background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:bold;color:#5b4a3a;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  #btn-music{position:fixed;left:12px;top:76px;z-index:8;width:36px;height:36px;border-radius:12px;
    background:rgba(255,255,255,.85);border:1.5px solid #d8e5c8;color:#5b6a4e;
    display:flex;align-items:center;justify-content:center;font-size:14px}
  #actionBtn{position:fixed;right:88px;bottom:28px;z-index:22;height:52px;padding:0 18px;border-radius:26px;
    background:rgba(232,192,122,.96);color:#5b4a3f;font-size:14px;font-weight:bold;
    display:none;align-items:center;justify-content:center;z-index:7;

  #actionBtn.on{display:flex}
  #hud{position:fixed;left:0;top:0;right:0;padding:7px 10px;z-index:6;

  #hudDay{background:rgba(255,255,255,.92);border:1.5px solid #cfe0bb;border-radius:11px;padding:5px 9px;font-weight:800;color:#4f5f43;font-size:13px}

  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:20;

  #roomSheet{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(251,247,238,.99);

  #story{position:fixed;inset:0;z-index:30;background:rgba(30,40,26,.62);display:none;

  #stCard{background:#fbf7ee;border-radius:18px;padding:18px;width:min(520px,86vw);max-width:520px;
    margin:0 auto;border:2px solid #d8c9ac;box-shadow:0 16px 40px rgba(40,50,30,.35);

#title{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#eef3e4,#e2e9d3 55%,#cfd8bd);}
#title.off{display:none}
.tt-card{width:min(500px,88vw);background:rgba(255,252,246,.97);border:1.5px solid rgba(120,100,70,.32);
  border-radius:22px;padding:26px 22px 22px;box-shadow:0 18px 44px rgba(80,70,50,.20);text-align:center}
.tt-name{font-size:28px;font-weight:800;letter-spacing:8px;color:#3d4832}

.tt-row{padding:10px 6px;border-bottom:1px dashed rgba(140,120,90,.25);font-size:13px;line-height:1.65;color:#4a4f3e}

</style>

<body>

<script>
/* ============ 基础 ============ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
const W = 2400, H = 1600, VIEW_W = 660;
let scale = 1, camX = 0, camY = 0;
const NL = String.fromCharCode(10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = n => Math.floor(Math.random() * n);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  cvs.width = Math.round(w * DPR); cvs.height = Math.round(h * DPR);
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  scale = w / VIEW_W;
}
window.addEventListener('resize', resize);
resize();

const C = {
  grass:'#8fbf6a', grassD:'#7fb059', grassL:'#9bcb76', grassDK:'#74a350',
  hedge:'#5e8f42', hedgeD:'#4d7835', hedgeL:'#6fa050',
  stone:'#d9cfba', stoneD:'#c6baa2', stoneL:'#e5ddcb',
  wall:'#ded5c4', wallSh:'#c9bea9', wallL:'#ece5d6',
  slate:'#5b6579', slateD:'#4a5364', wood:'#a97e52', woodD:'#8c6640',
  water:'#8fc7d8', waterD:'#6fb0c4', waterL:'#b9e0ea',
  iron:'#495054', ironL:'#5f686d', rose:'#d9758a', rose2:'#e79aa9',
  gold:'#e3bf7a', city:'#b9ac9a', cityD:'#a1957f', ink:'#4a3f36'
};

function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function box(x, y, w, h, r, fill) { rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function boxS(x, y, w, h, r, fill, stroke, lw) {
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ellip(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

/* ============ 音乐 ============ */
let AC = null, mTimer = null, mOn = true, mScene = null;
function ensureAC() {
  if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (A) AC = new A(); }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol) {
  if (!AC || !mOn) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol || 0.05, t0 + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
const SC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
const MUSIC = {
  manor:{step:880,f:i=>{tone(SC[[0,2,4,3,1,4,2,0][i%8]],1.1,'sine',0.05);if(i%4===0)tone(SC[0]/2,1.8,'triangle',0.03);}},
  field:{step:980,f:i=>{tone(SC[[0,2,1,3][i%4]],0.95,'sine',0.045);}},
  church:{step:1500,f:i=>{[[130.81,196,261.63],[110,164.81,220],[146.83,220,293.66],[130.81,196,261.63]][i%4].forEach(f=>tone(f,2.4,'sine',0.032));}},
  tavern:{step:480,f:i=>{tone(SC[[0,4,2,4,3,4,1,4][i%8]]*2,0.26,'square',0.025);}},
  city:{step:640,f:i=>{if(i%2===0)tone(70+rnd(40),0.5,'sawtooth',0.016);else tone(170,0.22,'triangle',0.018);}},
  stable:{step:1000,f:i=>{tone(SC[[0,1,2,1][i%4]]*0.75,0.7,'triangle',0.04);}},
  green:{step:1150,f:i=>{tone(SC[[4,2,3,5][i%4]],1.0,'sine',0.04);}},
  court:{step:1300,f:i=>{const f=[146.83,174.61,196.00][i%3];tone(f,1.3,'sawtooth',0.02);if(i%4===0)tone(f/2,1.8,'sine',0.03);}}
};
function startMusic(scene) {
  scene = scene || 'manor';
  if (mScene === scene && mTimer) return;
  stopMusic(); mScene = scene;
  if (!mOn) return;
  ensureAC();
  const cfg = MUSIC[scene] || MUSIC.manor;
  let i = 0;
  const tick = () => { if (!mOn || mScene !== scene) return; cfg.f(i++); mTimer = setTimeout(tick, cfg.step); };
  tick();
}
function stopMusic() { if (mTimer) { clearTimeout(mTimer); mTimer = null; } }

/* 鞭子声 / 惨叫 */
function whiplash() {
  if (!AC || !mOn) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(620, t0);
  o.frequency.exponentialRampToValueAtTime(90, t0 + 0.1);
  g.gain.setValueAtTime(0.09, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.13);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + 0.14);
}
function scream(delay) {
  if (!AC || !mOn) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(720, t0);
  o.frequency.exponentialRampToValueAtTime(1150, t0 + 0.06);
  o.frequency.exponentialRampToValueAtTime(240, t0 + 0.3);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.065, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + 0.36);
}

/* ============ 世界 ============ */
const WALL_X = 1150;
const GATE = { x: 1150, y: 820, w: 64 };
const FOUNTAIN = { x: 620, y: 720, r: 92 };

const BUILDINGS = [
  { id:'house',  name:'庄园主宅', type:'house',  x:620,  y:340,  w:320, h:190, door:{x:620, y:456}, mus:'manor' },
  { id:'stable', name:'马厩',     type:'stable', x:240,  y:760,  w:190, h:130, door:{x:240, y:845}, mus:'stable' },
  { id:'field',  name:'麦田',     type:'field',  x:300,  y:1260, w:280, h:180, door:{x:300, y:1362}, mus:'field' },

const SHOUTS = ['啊！', '哎呦！', '别打啦！', '我干活！', '饶命！', '疼！'];

function doWhip() {
  if (S.sickDays > 0) return toast('你连鞭子都举不起来');
  if (S.indoor) return;
  if (player.whip > 0) return;
  player.whip = 0.28;
  S.fatigue = (S.fatigue || 0) + 0.6; checkFatigue();
  whiplash();
  const range = 105 + player.whipLv * 26;
  let hit = 0, sc = 0;
  slaves.slice().forEach(function(s0) {
    if (s0.dead) return;
    if (dist(s0, player) < range) { hit++; whipOwnSlave(s0, sc); sc++; }
  });
  S.walkers.forEach(function(w) {
    if (dist(w, player) < range) { hit++; whipWalker(w, sc); sc++; }
  });
  if (hit) {
    S.combo++;
    S.comboT = 1.0;
    if (S.combo >= 2) {
      comboEl.textContent = 'COMBO x' + S.combo;
      comboEl.classList.add('on');
      tone(700 + S.combo * 90, 0.12, 'square', 0.04);
    }
  } else {
    S.combo = 0;
    toast('这一鞭子落在空地上，只扬起一点土');
  }
}

/* 抽自己的农奴 */
function whipOwnSlave(s0, i) {
  s0.fear = 5; s0.jump = 0.34;
  s0.strikes = (s0.strikes || 0) + 1;
  const r = Math.random();
  if (r < 0.3) s0.shout = { text: '饶命！', t: 0.9 };
  else if (r < 0.55) s0.shout = { text: '我错了！', t: 0.9 };
  else if (r < 0.72) s0.shout = { text: '我干活！', t: 0.9 };
  else if (r < 0.9) s0.shout = { text: '啊！', t: 0.9 };
  else s0.shout = { text: '……', t: 0.9 };
  scream(i * 0.05);
  if (S.law.whip === 0) { s0.unrest = Math.max(0, s0.unrest - 4); return; }
  s0.exp += 6;
  s0.tx = s0.x + (s0.x - player.x) * 0.7;
  s0.ty = s0.y + (s0.y - player.y) * 0.7;
  if (s0.rank < 2 && s0.exp >= (s0.rank === 0 ? 40 : 90)) {
    s0.rank++; s0.exp = 0;
    toast(s0.name + ' 升成了' + rankName(s0.rank) + '（干活更快）');
  }
  if (s0.strikes >= 6) { killSlave(s0); return; }
  if (s0.strikes >= 3 && Math.random() < 0.35) {
    s0.mode = 'flee'; s0.fleeDays = 0;
    toast(s0.name + '受不了了，放下锄头往大门口跑');
    return;
  }
  s0.unrest = Math.max(3, s0.unrest - (30 + player.whipLv * 6));
  s0.mode = 'work';
}

/* 抽路人或别人的仆人 */
function whipWalker(w, i) {
  w.fear = 5; w.jump = 0.34;
  w.strikes = (w.strikes || 0) + 1;
  const words = ['你干什么！', '救命啊！', '你疯了！', '别碰我！', '这是庄园主该干的事？'];
  w.shout = { text: words[rnd(words.length)], t: 1.0 };
  scream(i * 0.05);
  w.angry = (w.angry || 0) + 1;
  w.tx = w.x + (w.x - player.x) * 2.5;
  w.ty = w.y + (w.y - player.y) * 2.5;
  w.wait = 0;
  if (w.angry >= 2 && Math.random() < 0.55) {
    S.myCases.push({ id: 'm' + (uid++), crime: '无故殴打' + (w.owner ? (w.owner + '的仆人') : '平民') + '（' + w.name + '）', fine: 70 });
    toast(w.name + '抱着头跑了。有人看见他往城里的方向去');
  } else {
    toast(w.name + '尖叫着躲开了');
  }
}

/* 抽死了 */
function killSlave(s0) {
  s0.dead = true;
  slaves = slaves.filter(function(x) { return x !== s0; });
  S.deadCount = (S.deadCount || 0) + 1;
  slaves.forEach(function(x) { x.unrest = Math.min(100, x.unrest + 25); });
  toast(s0.name + '倒在地上，再没起来。剩下的人都不出声了');

  if (Math.random() < 0.6) {

  }
}

/* 偷东西 */
function doSteal() {
  if (S.indoor) return;
  if (S.sickDays > 0) return toast('你连手都抬不起来');
  if (S.lordDead) {
    S.coins += 40;
    toast('你现在就是君主，不用偷了：国库进账 40');
    return;
  }
  if (Math.random() < 0.32) {
    S.coins = Math.max(0, S.coins - 35);
    S.stealCaught = (S.stealCaught || 0) + 1;
    slaves.forEach(function(s0) { s0.unrest = Math.min(100, s0.unrest + 4); });
    toast('偷东西被看见了：罚金 35' + (S.stealCaught >= 2 ? '（已被记 ' + S.stealCaught + ' 次）' : ''));
    if (S.stealCaught >= 3) { S.stealCaught = 0; setTimeout(function() { tryJail('偷窃成性', 150); }, 700); }
  } else {
    const g = 12 + rnd(16);
    S.coins += g;
    tone(820, 0.1, 'triangle', 0.04);
    toast('得手了：+' + g + ' 金币');
  }
}

function fleeAway(s0) {

/* ============ 奴隶 ============ */
function moveTo(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d < 3) { o.moving = false; return true; }
  o.x += dx / d * speed * dt;
  o.y += dy / d * speed * dt;
  o.moving = true;
  o.phase += dt * 2.4;
  return false;
}

function catchSlave(s, by) {
  s.mode = 'work';
  s.unrest = 10;
  s.fleeDays = 0;
  s.tx = 0;
  s.x = 420 + rnd(220);
  s.y = 1120 + rnd(80);
  const bounty = 15 + s.rank * 20;
  S.coins += bounty;
  S.caught++;
  toast(by + '抓回了 ' + s.name + '，没收私房钱 +' + bounty);
}

function updateSlave(s, dt) {
  if (s.fear > 0) s.fear -= dt;
  if (s.jump > 0) s.jump -= dt;
  if (s.shout) { s.shout.t -= dt; if (s.shout.t <= 0) s.shout = null; }

  // 孩子长大
  if (s.isChild) { s.growT += dt; if (s.growT > 26) { s.isChild = false; toast(s.name + ' 长大了'); } }
  // 怀孕
  if (s.pregnant > 0) {
    s.pregnant -= dt;
    if (s.pregnant <= 0) {
      const b = makeSlave(Math.random() < 0.5 ? 'm' : 'f', s.x + 12, s.y + 6, true);
      b.unrest = 4; slaves.push(b);
      toast(s.name + ' 生了孩子：' + b.name);
    }
  }
  // 生病与传染
  if (!s.sick && Math.random() < dt * 0.004) {
    s.sick = true; s.sickT = 0;
    toast(s.name + ' 病倒了');
  }
  if (s.sick) {
    s.sickT += dt;
    if (s.sickT > 26) {
      slaves.forEach(o => {
        if (o !== s && !o.sick && dist(o, s) < 110 && Math.random() < 0.6) {
          o.sick = true; o.sickT = 0;
          toast('传染了：' + o.name);
        }
      });
      s.sickT = 6;
    }
  }

  if (s.mode === 'flee') {
    s.fleeDays += dt; // 1秒 = 1天
    s.panic = Math.max(0, s.panic - dt);
    const hide = HIDES[s.hideIdx % HIDES.length];
    if (dist(s, hide) < 60) {
      // 躲在掩体附近徘徊，玩家靠近就跑
      if (dist(s, player) < 210) {
        s.x += (s.x - player.x) / (dist(s, player) + 1) * 200 * dt;
        s.y += (s.y - player.y) / (dist(s, player) + 1) * 200 * dt;
        s.moving = true; s.phase += dt * 4;
      } else if (Math.random() < dt * 0.6) {
        s.hideIdx++;
      }
    } else {
      moveTo(s, hide.x, hide.y, 70, dt);
    }
    guards.forEach(g => { if (dist(g, s) < 44) catchSlave(s, '守卫'); });
    if (s.fleeDays >= 101) {
      const idx = slaves.indexOf(s);
      if (idx >= 0) slaves.splice(idx, 1);
      S.escaped++;
      toast(s.name + ' 熬满 101 天，彻底脱离了奴隶身份');
    }
    return;
  }

  s.unrest = clamp(s.unrest + dt * 1.3, 0, 100);
  s.hunger = clamp(s.hunger + dt * 1.5, 0, 100);
  const bonus = (S.blessT > 0 ? 1.25 : 1) * (1 + s.rank * 0.5) * (s.sick ? 0.2 : 1);

  if (s.hunger > 80 && s.mode === 'work') { s.mode = 'hungry'; s.tx = 0; }
  if (s.mode === 'hungry') {
    const arrived = moveTo(s, GATE.x - 70, GATE.y + 40, 56, dt);
    if (arrived) s.moving = false;
    return;
  }
  if (s.mode === 'work' && s.unrest >= 74 && !s.isChild) {
    s.mode = 'restless'; s.tx = 0;
    toast(s.unrest > 88 ? s.name + ' 忍无可忍，往门口冲！' : s.name + ' 不安分了，往门口走');
  }
  if (s.mode === 'work') {
    s.workT += dt;
    if (s.workT > 2.6 / bonus) {
      s.workT = 0;
      S.wheat += raceYield(s);
      if (S.built.bakery && S.wheat > 0) { S.wheat -= 1; S.bread += 1; }
    }
    if (!s.tx) { s.tx = 175 + rnd(230); s.ty = 1200 + rnd(130); }
    if (moveTo(s, s.tx, s.ty, 48, dt)) { s.tx = 0; s.wait = 0.6 + Math.random() * 1.2; }
    if (s.wait > 0) { s.wait -= dt; s.moving = false; }
    return;
  }
  if (s.mode === 'restless') {
    const arrived = moveTo(s, GATE.x - 20, GATE.y, 58, dt);
    if (arrived) {
      s.moving = false;
      fleeAway(s);
      return;
      // 门关着就一直站门口，玩家能看到
    }
  }
}

function updateGuard(g, dt) {
  const flee = slaves.filter(s => s.mode === 'flee');
  if (flee.length) {
    if (!g.target || g.target.mode !== 'flee') g.target = flee[0];
    moveTo(g, g.target.x, g.target.y, 132, dt);
    if (dist(g, g.target) < 44) { catchSlave(g.target, '守卫'); g.target = null; }
  } else {
    if (!g.tx) { g.tx = 1120 + rnd(170); g.ty = 860 + rnd(240); }
    if (moveTo(g, g.tx, g.ty, 56, dt)) { g.tx = 0; g.wait = 1 + Math.random() * 2; }
    if (g.wait > 0) { g.wait -= dt; g.moving = false; }
  }
}

function raceYield(s) {
  const r = (S.law && S.law.race) || '';
  const w = s && s.race === 'w';
  if (r === 'whiteUp') return w ? 1.2 : 0.85;
  if (r === 'blackUp') return w ? 0.9 : 1.15;

  return 1;
}
function updateKids(dt) {
  if (!S.kids) return;
  S.kids.forEach(function(k) {
    if (!k.tx) { k.tx = 380 + Math.random() * 620; k.ty = 900 + Math.random() * 340; }
    const dx = k.tx - k.x, dy = k.ty - k.y;
    const d = Math.hypot(dx, dy);
    k.moving = d > 6;
    if (k.moving) {
      k.x += dx / d * 34 * dt;
      k.y += dy / d * 34 * dt * 0.7;
      k.phase = (k.phase + dt * 1.6) % 1;
    } else { k.tx = 0; }
  });
}
function drawWalkerAcc(w) {
  const a = w.acc;
  if (!a) return;
  const x = w.x, hy = w.y - 72;
  if (a === 'straw') {
    ctx.fillStyle = '#d8b675';
    ctx.beginPath(); ctx.ellipse(x, hy - 12, 25, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9a361';
    ctx.beginPath(); ctx.ellipse(x, hy - 19, 13, 9, 0, Math.PI, 0); ctx.fill();
  } else if (a === 'cap') {
    ctx.fillStyle = '#4a4336';
    ctx.beginPath(); ctx.ellipse(x, hy - 14, 21, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a3428';
    ctx.beginPath(); ctx.ellipse(x - 8, hy - 10, 12, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  } else if (a === 'ribbon') {
    ctx.fillStyle = '#d1566e';
    ctx.beginPath(); ctx.arc(x + 15, hy - 12, 5.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 13, hy - 12); ctx.lineTo(x + 4, hy - 18); ctx.lineTo(x + 4, hy - 6);
    ctx.closePath(); ctx.fill();
  } else if (a === 'veil') {
    ctx.fillStyle = '#f7f5ef';
    ctx.beginPath(); ctx.arc(x, hy - 2, 23, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
    ctx.fillRect(x - 23, hy - 4, 7, 30);
    ctx.fillRect(x + 16, hy - 4, 7, 30);
  } else if (a === 'apron') {
    ctx.fillStyle = 'rgba(120,88,58,.85)';
    ctx.fillRect(x - 12, w.y - 50, 24, 24);
  }
}

  if (keys.right) dx += 1;
  const len = Math.hypot(dx, dy);
  player.moving = len > 0;
  if (len > 0) {
    dx /= len; dy /= len;
    const sp = 168 * (player.riding ? 2.6 : 1);
    player.x += dx * sp * dt;
    player.y += dy * sp * dt;
    player.phase += dt * (player.riding ? 4.2 : 2.8);
  }
  player.x = clamp(player.x, 50, W - 50);
  player.y = clamp(player.y, 70, H - 50);
  if (player.whip > 0) player.whip -= dt;
  if (player.x > WALL_X - 30 && player.x < WALL_X + 30 && Math.abs(player.y - GATE.y) > GATE.w) {
    player.x = player.x < WALL_X ? WALL_X - 30 : WALL_X + 30;
  }
}

function bVisible(b) { return !b.need || S.built[b.need] || b.id !== 'bakery'; }
function isBuilt(b) {
  if (b.need) return !!S.built[b.need];

}
function findAction() {
  if (Math.hypot(player.x - GATE.x, player.y - GATE.y) < 90) return { kind:'gate' };
  for (const b of BUILDINGS) {
    if (Math.hypot(player.x - b.door.x, player.y - b.door.y) < 82) return { kind:'building', b:b };
  }
  return null;
}

function nearestRoomPerson() {
  const CW = cvs.width / DPR, CH = cvs.height / DPR;
  let best = null, bd = 0.14;
  lastRoomPeople.forEach(function(p0) {
    const d = Math.hypot(p0.x / CW - (S.roomX || 0.5), p0.y / CH - (S.roomY || 0.8));

  });

}

function pickLine(holder, pool) {
  if (!pool || !pool.length) return '……';

function refreshActionBtn() {
  if (S.indoor) {
    const p0 = nearestRoomPerson();
    if (p0) { actionBtn.classList.add('on'); actionBtn.textContent = '和 ' + (p0.tag || '人') + ' 说话'; }
    else actionBtn.classList.remove('on');
    return;
  }
  if (S.trip) { actionBtn.classList.add('on'); actionBtn.textContent = '✦ 停下'; return; }
  if (S.indoor) { actionBtn.classList.remove('on'); return; }
  const w0 = nearestWalker();
  if (w0) { actionBtn.classList.add('on'); actionBtn.textContent = '和 ' + w0.name + ' 说话'; return; }
  nearAction = findAction();

  else actionBtn.textContent = '进入 ' + nearAction.b.name;

function updateRoomPlayer(dt) {
  if (!S.indoor) return;
  let dx = 0, dy = 0;
  if (keys.up) dy -= 1; if (keys.down) dy += 1;
  if (keys.left) dx -= 1; if (keys.right) dx += 1;
  const len = Math.hypot(dx, dy);
  S.roomMoving = len > 0;
  if (len > 0) {
    dx /= len; dy /= len;
    S.roomX = clamp((S.roomX || 0.5) + dx * 0.33 * dt, 0.07, 0.93);
    S.roomY = clamp((S.roomY || 0.8) + dy * 0.33 * dt, 0.42, 0.9);
    S.roomPhase = (S.roomPhase || 0) + dt * 3.4;
  }
}
function doAction() {
  if (S.indoor) { const p0 = nearestRoomPerson(); if (p0) roomTalk(p0); return; }
  const ww = nearestWalker();
  if (ww) { walkerTalk(ww); return; }
  if (S.trip) { tripAction(); return; }
  if (!nearAction) return;
  if (nearAction.kind === 'gate') {
    S.gateOpen = !S.gateOpen;
    toast(S.gateOpen ? '大门开了，奴隶可能趁机跑' : '大门关上了');
    refreshActionBtn();
    return;
  }
  enterBuilding(nearAction.b);
}

function waitingEat() { return slaves.filter(s => s.mode === 'hungry').length; }

function renderRoom(b) {
  roomDesc.textContent = roomText(b.id);
  roomBtns.innerHTML = '';
  const A = roomActions(b);
  A.forEach(a => {
    const d = document.createElement('div');
    d.className = 'rbtn2';
    d.innerHTML = '<span>' + a.t + '</span><span class="p">' + (a.p || '') + '</span>';
    d.onclick = () => { a.f(); renderRoom(b); updateHud(); };
    roomBtns.appendChild(d);
  });
}

  }

  return A;
}

/* ============ 改名 ============ */
let renamingTarget = null;
const renameEl = document.getElementById('rename');
function openRename() {
  renameEl.classList.add('on');
  document.getElementById('rnEdit').classList.remove('on');
  renderRenameList();
}
function renderRenameList() {
  const el = document.getElementById('rnList');
  el.innerHTML = '';
  if (!slaves.length) {
    el.innerHTML = '<div class="rn-item"><span>现在一个奴隶也没有</span></div>';
    return;
  }
  slaves.forEach(s => {
    const d = document.createElement('div');
    d.className = 'rn-item';
    d.innerHTML = '<span>' + s.name + '</span><span class="p">' +
      (s.sex === 'm' ? '男' : '女') + ' · ' + rankName(s.rank) +
      (s.isChild ? ' · 孩子' : '') + (s.sick ? ' · 病' : '') +
      (s.mode === 'flee' ? ' · 逃' : '') + '</span>';
    d.onclick = () => {
      renamingTarget = s;
      document.getElementById('rnEdit').classList.add('on');
      const inp = document.getElementById('rnInput');
      inp.value = s.name; inp.focus();
    };
    el.appendChild(d);
  });
}
document.getElementById('rnOk').addEventListener('click', () => {
  const v = document.getElementById('rnInput').value.trim();
  if (!renamingTarget) return;
  if (!v) return toast('名字不能是空的');
  renamingTarget.name = v;
  renamingTarget = null;
  document.getElementById('rnEdit').classList.remove('on');
  renderRenameList();
  toast('改名成功：' + v);
});
document.getElementById('rnCancel').addEventListener('click', () => {
  renamingTarget = null;
  document.getElementById('rnEdit').classList.remove('on');
});
document.getElementById('rnClose').addEventListener('click', () => { renameEl.classList.remove('on'); });
/* 点人就能改名 */
function openRenameFor(s0) {
  renamingTarget = s0;
  openRename();
  document.getElementById('rnEdit').classList.add('on');
  const inp = document.getElementById('rnInput');
  inp.value = s0.name;
  setTimeout(function() { try { inp.focus(); } catch (e) {} }, 80);
}
document.getElementById('game').addEventListener('click', function(e) {
  if (S.indoor || S.trip || storyOpen) return;
  const r = cvs.getBoundingClientRect();
  const wx = (e.clientX - r.left) / (scale || 1) + camX;
  const wy = (e.clientY - r.top) / (scale || 1) + camY;
  let bestK = null, bdK = 62;
  (S.kids || []).forEach(function(k) {
    const d = Math.hypot(k.x - wx, k.y - wy);
    if (d < bdK) { bdK = d; bestK = k; }
  });
  if (bestK) { openKidMenu(bestK); return; }
  let best = null, bd = 70;
  slaves.forEach(function(s0) {
    const d = Math.hypot(s0.x - wx, s0.y - wy);
    if (d < bd) { bd = d; best = s0; }
  });
  if (best) { openRenameFor(best); return; }
  let bw = null, bdw = 74;
  (S.walkers || []).forEach(function(w) {
    const d = Math.hypot(w.x - wx, w.y - wy);
    if (d < bdw) { bdw = d; bw = w; }
  });
  if (bw) walkerTalk(bw);
});

/* ============ 剧情事件 / 结局 ============ */
const storyEl = document.getElementById('story');
const stTitle = document.getElementById('stTitle');
const stText = document.getElementById('stText');
const stOpts = document.getElementById('stOpts');
const stHint = document.getElementById('stHint');
let storyOpen = false;
let storyCd = 40;
const pick = arr => arr[rnd(arr.length)];
function anySlave(){ return slaves.length ? pick(slaves) : null; }

function guideFromText(txt) {
  if (!txt) return false;
  const M = [
    ['君主法庭', 'kingcourt'], ['皇宫', 'palace'], ['宫殿', 'palace'], ['君主宅邸', 'lord'],
    ['庄园法庭', 'court'], ['法庭', 'court'], ['酒馆', 'tavern'], ['餐馆', 'tavern'],
    ['教堂', 'church'], ['医院', 'hosp'], ['小铺', 'shop'], ['铺子', 'shop'],
    ['面包炉', 'bakery'], ['面包房', 'bakery'], ['食堂', 'hall'], ['监工塔', 'tower'],
    ['马厩', 'stable'], ['麦田', 'field'], ['田里', 'field'], ['地里', 'field'], ['主宅', 'house']
  ];
  for (let i = 0; i < M.length; i++) {
    if (txt.indexOf(M[i][0]) >= 0) { setGuide(M[i][1]); return true; }
  }
  return false;
}
function showStory(title, text, opts, hint, lock) {
  storyOpen = true;
  storyEl.classList.add('on');
  stTitle.textContent = title;
  stText.textContent = text;
  stHint.textContent = hint || '';
  stOpts.innerHTML = '';
  opts.forEach(o => {
    const d = document.createElement('div');
    d.className = 'st-opt';
    d.textContent = o.t;
    d.onclick = () => {
      try { if (o.f) o.f(); } catch (er) { showErr(new Error('[剧情:' + title + '] ' + er.message + ' | ' + (er.stack || '').split('\n')[1])); }
      if (!lock) { storyOpen = false; storyEl.classList.remove('on'); }
      try {
        if (!guideFromText(o.t)) {

const END_KEY = 'zhuangyuan_v5_endings';

function getEndings() {

function allEndingsDone() {
  const o = getEndings();
  return END_IDS.every(k => o[k]);
}

function updateCats(dt) {
  if (!S.myCats) return;
  S.myCats.forEach(function(c) {
    c.t = (c.t || 0) - dt;
    if (c.t <= 0) {
      c.t = 2 + Math.random() * 5;
      c.tx = 220 + Math.random() * 1400;
      c.ty = 620 + Math.random() * 760;
    }
    const dx = c.tx - c.x, dy = c.ty - c.y;
    const d = Math.hypot(dx, dy);
    if (d > 4) {
      c.x += dx / d * 42 * dt;
      c.y += dy / d * 42 * dt * 0.7;
      if (Math.abs(dx) > 1) c.face = dx > 0 ? 1 : -1;
    }
  });
}
function drawCat(c) {
  const x = c.x, y = c.y;
  ctx.save();
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
  // 身体
  ctx.fillStyle = c.col;
  ctx.beginPath(); ctx.ellipse(x, y - 9, 11, 7.5, 0, 0, Math.PI * 2); ctx.fill();
  // 头
  ctx.beginPath(); ctx.arc(x + 9 * c.face, y - 15, 7.5, 0, Math.PI * 2); ctx.fill();
  // 耳朵
  ctx.beginPath();
  ctx.moveTo(x + 4 * c.face, y - 20); ctx.lineTo(x + 6 * c.face, y - 26); ctx.lineTo(x + 9 * c.face, y - 21);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 12 * c.face, y - 21); ctx.lineTo(x + 15 * c.face, y - 26); ctx.lineTo(x + 16 * c.face, y - 19);
  ctx.closePath(); ctx.fill();
  // 眼睛
  ctx.fillStyle = '#20301c';
  ctx.beginPath(); ctx.arc(x + 7 * c.face, y - 16, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 12 * c.face, y - 16, 1.5, 0, Math.PI * 2); ctx.fill();
  // 尾巴
  ctx.strokeStyle = c.col; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 10 * c.face, y - 8);
  ctx.quadraticCurveTo(x - 20 * c.face, y - 14, x - 16 * c.face, y - 24);
  ctx.stroke();
  // 腿
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x - 4, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 4, y - 4); ctx.lineTo(x + 4, y); ctx.stroke();
  ctx.restore();
  if (c.name) {
    ctx.fillStyle = 'rgba(120,95,70,.85)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, x, y - 28);
    ctx.textAlign = 'left';
  }
}

  '瘟疫的传言': 5, '一封情书': 10, '推销的人': 9,

  '田里的好收成': 13, '老奴隶的咳声': 12, '城里的请柬': 11,
  '马车坏了': 13,
  '逃奴回来了': 4, '粮仓起火': 3, '国王的税吏': 4,
  '白影': 2, '脱缰的马': 5, '一对双胞胎': 2
};

function rollStory() {
  const list = eventList();
  if (!list.length) return;
  const ws = list.map(e => EVENT_W[e.t] || 10);
  const tot = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot, idx = 0;
  for (let i = 0; i < ws.length; i++) {
    r -= ws[i];
    if (r <= 0) { idx = i; break; }
  }
  const ev = list[idx] || list[0];
  const rare = (EVENT_W[ev.t] || 10) <= 5;
  showStory((rare ? '【罕见】' : '') + ev.t, ev.text, ev.opts,
    rare ? '这种事不常发生。重开一局，未必还能碰见。' : '选一个。你的庄园会记住');
}

function checkEnding() {
  if (S.heirReady && S.coins >= 5000 && S.day >= 15) {
    finishEnding('heir', '结局六 · 继承人',
      '孩子第一次独立记完一本账。错了两处，都是小错。' + NL + NL +

      '这片地换过四个名字，现在是第五个——还是同一个姓。');
    return;
  }
  if (storyOpen) return;
  const kids = slaves.filter(x => x.isChild).length;
  if (S.coins < -60) {
    finishEnding('bankrupt', '结局一 · 破产',
      '账本上的数字终于变成了负数，而且是很大的负数。\n\n卫兵来收地的那天，天气很好。\n你站在门口，看着最后一个人被带走，她回头看了你一眼，没有恨，也没有别的。\n\n这座庄园，换了主人。');
    return;

  if (S.lordDead && S.coins >= 10000) {
    finishEnding('lord', '结局三 · 新的君主',
      '你坐在那张原来不属于你的椅子上，脚下是整座城。\n\n有人送来新拟的法令，等你的手印。\n窗外，麦田黄了，还是那片麦田。\n\n你终于不用再数着金币过日子——换成别人替你数了。');
    return;
  }

    finishEnding('happy', '结局二 · 人生美满',
      '庄园里第一次传来孩子的笑声。\n\n饭点的时候，食堂坐满了人。有人喊你一起吃饭，你摆手说不用——但最后还是坐下了。\n\n金币够用，门开着也不怕人跑。\n\n这才是守得住的产业。');
    return;

  if (slaves.length === 0 && S.coins >= 800 && S.day >= 6 && !S.emperor) {
    finishEnding('retire', '结局四 · 一个人的庄园',
      '奴隶一个个走了，有的是你放的，有的是自己走的。\n\n庄园空了，但账上有钱，屋里有灯。\n你学会了在早上给自己煮一碗粥，坐在门口看草长。\n\n没人喊你主人，也没人等你吩咐。\n这样也挺好。');
    return;
  }
}

function beginTrip(id, who) {
  if (!spend(300)) return;
  S.trip = { id:id, x:0.5, y:0.74, mov:0, phase:0, day:0, max:6,
    who: who ? who.name : '', sex: who ? who.sex : (Math.random() < 0.5 ? 'm' : 'f') };
  S.indoor = null;
  roomEl.classList.remove('on');
  toast('到了。' + (S.trip.who ? S.trip.who + '跟在你后面' : '就你一个人'));
}

function updateTrip(dt) {
  const t = S.trip;
  let dx = 0, dy = 0;
  if (keys.up) dy -= 1; if (keys.down) dy += 1;
  if (keys.left) dx -= 1; if (keys.right) dx += 1;
  const len = Math.hypot(dx, dy);
  t.mov = len > 0 ? 1 : 0;
  if (len > 0) {
    dx /= len; dy /= len;
    t.x += dx * 0.22 * dt; t.y += dy * 0.22 * dt;
    t.phase += dt * 3;
  }
  t.x = clamp(t.x, 0.05, 0.95);
  t.y = clamp(t.y, 0.45, 0.92);
}

function drawBeach(CW, CH) {
  ctx.fillStyle = '#3f7f96'; ctx.fillRect(0, CH * 0.4, CW, CH * 0.2);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const y = CH * (0.44 + i * 0.045);
    ctx.beginPath();
    for (let x = 0; x <= CW; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.03 + clock / 700 + i) * 3);
    ctx.stroke();
  }
  ctx.fillStyle = '#efdcb8'; ctx.fillRect(0, CH * 0.6, CW, CH * 0.4);
  ctx.fillStyle = '#e5cf9f'; ctx.fillRect(0, CH * 0.6, CW, 8);
  circle(CW * 0.78, CH * 0.34, 34, 'rgba(255,214,150,0.9)');
  circle(CW * 0.78, CH * 0.34, 46, 'rgba(255,214,150,0.22)');
  // 椰树
  [[0.1, 0.72], [0.9, 0.7]].forEach(function(p) {
    const x = p[0] * CW, y = p[1] * CH;
    ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10, y - 60, x + 4, y - 110); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI + i * 0.6;
      ctx.fillStyle = '#3f7a4a';
      ctx.beginPath(); ctx.ellipse(x + 4 + Math.cos(a) * 34, y - 110 + Math.sin(a) * 20, 30, 9, a, 0, Math.PI * 2); ctx.fill();
    }
  });
  // 小船
  box(CW * 0.5 - 40, CH * 0.56, 80, 18, 8, '#7a5236');
  ctx.fillStyle = '#c9b48c'; ctx.fillRect(CW * 0.5 - 2, CH * 0.5, 3, CH * 0.06);
}

function drawSnow(CW, CH) {
  ctx.fillStyle = '#eef3f8'; ctx.fillRect(0, CH * 0.52, CW, CH * 0.48);
  ctx.fillStyle = '#dde7f0'; ctx.fillRect(0, CH * 0.52, CW, 10);
  // 山
  ctx.fillStyle = '#b9c9d8';
  ctx.beginPath(); ctx.moveTo(0, CH * 0.52); ctx.lineTo(CW * 0.78, CH * 0.2); ctx.lineTo(CW * 0.95, CH * 0.52); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f7fbff';
  ctx.beginPath(); ctx.moveTo(CW * 0.72, CH * 0.235); ctx.lineTo(CW * 0.78, CH * 0.2); ctx.lineTo(CW * 0.84, CH * 0.25); ctx.closePath(); ctx.fill();
  // 松树
  [[0.13, 0.62], [0.2, 0.7], [0.66, 0.62]].forEach(function(p) {
    const x = p[0] * CW, y = p[1] * CH;
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i === 0 ? '#35594a' : '#2d4d40';
      ctx.beginPath();
      ctx.moveTo(x, y - 54 + i * 16); ctx.lineTo(x - 22 + i * 3, y - 20 + i * 16); ctx.lineTo(x + 22 - i * 3, y - 20 + i * 16);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#6b4a33'; ctx.fillRect(x - 4, y, 8, 14);
  });
  // 小屋
  box(CW * 0.24, CH * 0.72, 96, 56, 6, '#a5794f');
  ctx.fillStyle = '#7b4a34';
  ctx.beginPath(); ctx.moveTo(CW * 0.24 - 8, CH * 0.72); ctx.lineTo(CW * 0.24 + 48, CH * 0.64); ctx.lineTo(CW * 0.24 + 104, CH * 0.72); ctx.closePath(); ctx.fill();
  box(CW * 0.24 + 38, CH * 0.76, 20, 32, 3, '#5b3a26');
  ctx.fillStyle = 'rgba(220,220,220,0.55)';
  for (let i = 0; i < 5; i++) circle(CW * 0.24 + 60 + Math.sin(clock / 900 + i) * 10, CH * 0.62 - i * 14, 8 + i * 2, 'rgba(230,230,230,0.35)');
  // 雪
  for (let i = 0; i < 70; i++) {
    const sx = (i * 137.5) % CW;
    const sy = (i * 91.7 + clock * 0.03) % CH;
    circle(sx, sy, 1.6 + (i % 3), 'rgba(255,255,255,0.75)');
  }
}

function drawOld(CW, CH) {
  circle(CW * 0.2, CH * 0.16, 30, 'rgba(255,250,220,0.95)');
  circle(CW * 0.2, CH * 0.16, 44, 'rgba(255,250,220,0.18)');
  for (let i = 0; i < 60; i++) circle((i * 173) % CW, (i * 97) % (CH * 0.5), 1.2, 'rgba(255,255,255,0.6)');
  // 石路
  ctx.fillStyle = '#5a5f6b';
  ctx.beginPath(); ctx.moveTo(CW * 0.4, CH * 0.5); ctx.lineTo(CW * 0.6, CH * 0.5);
  ctx.lineTo(CW, CH); ctx.lineTo(0, CH); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
  for (let i = 1; i < 8; i++) {
    const y = CH * (0.5 + i * 0.07);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }
  // 两侧房屋
  [[0.02, 0.3, 0.22, 0.34], [0.72, 0.28, 0.26, 0.36], [0.32, 0.22, 0.2, 0.3], [0.6, 0.24, 0.16, 0.28]].forEach(function(b) {
    box(b[0] * CW, b[1] * CH, b[2] * CW, b[3] * CH, 4, '#2c3242');
    ctx.fillStyle = '#20242f';
    ctx.fillRect(b[0] * CW + 6, b[1] * CH + 8, b[2] * CW - 12, 10);
    ctx.fillStyle = 'rgba(255,196,110,0.8)';
    for (let i = 0; i < 2; i++) ctx.fillRect(b[0] * CW + 14 + i * 34, b[1] * CH + 30, 16, 18);
  });
  // 灯笼
  [[0.16, 0.56], [0.86, 0.56], [0.42, 0.5], [0.62, 0.5]].forEach(function(p) {
    const x = p[0] * CW, y = p[1] * CH;
    ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - 60); ctx.lineTo(x, y - 18); ctx.stroke();
    circle(x, y, 12, 'rgba(255,120,90,0.95)');
    circle(x, y, 22, 'rgba(255,120,90,0.2)');
  });
  // 桥
  ctx.strokeStyle = '#8d8272'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.arc(CW * 0.55, CH * 0.62, 60, Math.PI, 0); ctx.stroke();
}

function drawTrip() {
  const CW = cvs.width / DPR, CH = cvs.height / DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const t = S.trip, T = TRIPS[t.id];
  if (!T) { S.trip = null; return; }
  const g = ctx.createLinearGradient(0, 0, 0, CH * 0.75);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  if (t.id === 'beach') drawBeach(CW, CH);
  else if (t.id === 'snow') drawSnow(CW, CH);
  else drawOld(CW, CH);
  T.tips.forEach(function(sp) {
    const px = sp.x * CW, py = sp.y * CH;
    const d = Math.hypot(t.x - sp.x, t.y - sp.y);
    ctx.globalAlpha = d < 0.13 ? 1 : 0.45;
    circle(px, py - 16 + Math.sin(clock / 300) * 3, 9, '#ffe7a8');
    circle(px, py - 16 + Math.sin(clock / 300) * 3, 18, 'rgba(255,231,168,0.25)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(sp.t, px, py - 36);
  });
  const meC = { shirt:'#6d8a5f', shirt2:'#5d7a52', pants:'#3f4a3a', shoe:'#2a2a24', hair:'#2f2620', skin:'#f2d2b4' };
  drawPerson({ x: t.x * CW, y: t.y * CH, phase: t.phase, moving: t.mov, sex:'m', c: meC },
    { text:'你', color:'rgba(40,40,40,0.7)' }, 1.5);
  if (t.who) {
    drawPerson({ x: t.x * CW + 36, y: t.y * CH + 6, phase: t.phase * 0.8, moving: t.mov, sex: t.sex, c: { shirt:'#c9a98a', shirt2:'#b8997a', pants:'#8a7a66', shoe:'#3a3028', hair:'#241a14', skin:'#3d2b20' } },
      { text: t.who, color:'rgba(40,40,40,0.7)' }, 1.4);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, CW, 44);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(T.name + ' · 第 ' + (Math.min(t.day + 1, t.max)) + ' / ' + t.max + ' 天', CW / 2, 28);
}

function tripAction() {
  const t = S.trip, T = TRIPS[t.id];
  if (!T) return;
  let best = null, bd = 9;
  T.tips.forEach(function(sp) {
    const d = Math.hypot(t.x - sp.x, t.y - sp.y);
    if (d < bd) { bd = d; best = sp; }
  });
  if (!best || bd > 0.14) { toast('再往前走一点'); return; }
  const key = t.id + '|' + best.t;
  const sp = SPOTS[key];
  if (!sp) { toast('这里没什么好做的'); return; }
  const opts = sp.opts.map(function(o) {
    return { t: o.t, f: function() { if (o.f) o.f(); tripAdvance(t); } };
  });
  showStory(T.name + ' · ' + best.t, sp.text, opts, '停下的一天也算一天', false);
}

function estateDay() {
  S.day++;
  let inc = 12 + slaves.length * 6;
  if (S.built.bakery) inc += 20;
  if (S.built.hall) inc += 8;
  if (S.canal) inc += 15;
  inc = Math.floor(inc * 0.9); // 什一税：教堂抽一成
  if (slaves.length && Math.random() < 0.3) {
    const s0 = slaves[rnd(slaves.length)];
    s0.unrest = Math.max(0, s0.unrest - 8);
    toast(s0.name + '今天在自己份地上干活，人松快了些（这一天收成少了）');
    inc = Math.floor(inc * 0.8);
  }
  if (S.mine) { inc += 25; if (Math.random() < 0.15) { S.coins -= 50; slaves.forEach(function(x) { x.unrest = Math.min(100, x.unrest + 4); }); toast('矿洞里出了事故，-50 金'); } }
  if (S.law.tax) inc = Math.floor(inc * S.law.tax);
  S.coins += inc;
  slaves.forEach(function(x) {
    x.hunger = Math.min(100, x.hunger + 3);
    x.unrest = Math.min(100, x.unrest + 1);
  });
  if (Math.random() < 0.25 && slaves.length) {
    slaves[Math.floor(Math.random() * slaves.length)].unrest = 100;
  }
  S.tripGain = (S.tripGain || 0) + inc;
  return inc;
}

function tripAdvance(t) {
  const inc = estateDay();
  t.day++;
  if (t.day >= t.max) finishTrip();
  else toast('第 ' + t.day + ' 天。庄园今天自己挣了 ' + inc + ' 金');
}

function finishTrip() {
  const who = S.trip.who;
  const gain = S.tripGain || 0;
  S.tripGain = 0;
  S.coins += 150; S.power += 10;
  S.killRisk = Math.max(0, S.killRisk - 5);
  showStory('蜜月结束',
    '六天过完了。' + (who ? who + '把带回来的东西一件件摆出来。' : '你一个人走完了这一趟。') + NL + NL +
    '带回来的：+150 金 · 国力 +10 · 被刺风险降了' + NL + '这六天庄园没停，自己挣了 ' + gain + ' 金',
    [{ t:'回庄园', f:function() { S.trip = null; toast('到家了。庄园还在原地等你'); } }],
    '这一趟不算在庄园的日子里', false);
}

const SAVE_KEY = 'zhuangyuan_v5_save';
let __lastSave = 0;
function saveGame() {
  try {
    const d = {
      v: 1, t: Date.now(), S: S,
      slaves: slaves, guards: guards, npcs: npcs,
      player: { x: player.x, y: player.y, riding: player.riding, whipLv: player.whipLv, face: player.face }
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
    return true;
  } catch (e) { return false; }
}
function applySaveObj(d) {
  if (!d || !d.S) return false;
  Object.keys(d.S).forEach(function(k) { S[k] = d.S[k]; });
  if (Array.isArray(d.slaves)) slaves = d.slaves;
  if (Array.isArray(d.guards)) guards = d.guards;
  if (Array.isArray(d.npcs)) npcs = d.npcs;
  if (d.player) {
    player.x = d.player.x || player.x;
    player.y = d.player.y || player.y;
    player.riding = !!d.player.riding;
    if (typeof d.player.whipLv === 'number') player.whipLv = d.player.whipLv;
    if (d.player.face) player.face = d.player.face;
  }
  S.booted = true;
  if (!S.myCats) S.myCats = [];
  return true;
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    return applySaveObj(JSON.parse(raw));
  } catch (e) { return false; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
function exportSave() {
  const raw = localStorage.getItem(SAVE_KEY) || JSON.stringify({ v: 1, S: S, slaves: slaves, npcs: npcs, guards: guards, player: { x: player.x, y: player.y, riding: player.riding, whipLv: player.whipLv } });
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(raw);
  } catch (e) {}
  showStory('存档', '这串数字就是你的整个庄园。' + NL + NL + '已经复制到剪贴板了，粘到备忘录里存着。换手机、清缓存之后，粘回来就能接着玩。' + NL + NL + '长度 ' + raw.length + ' 字', [{ t:'知道了', f:function() {} }], '', false);
  return raw;
}
function importSave() {
  let txt = '';
  try { txt = window.prompt('把存档那串字粘进来') || ''; } catch (e) { txt = ''; }
  if (!txt) return;
  try {
    if (applySaveObj(JSON.parse(txt))) { saveGame(); toast('存档读回来了'); }
    else toast('这串字不对');
  } catch (e) { toast('这串字读不出来'); }
}

function drawGuide() {
  if (!S.guide || S.indoor) return;
  const b = BUILDINGS.find(function(x) { return x.id === S.guide.id; });

  const d = Math.hypot(b.door.x - player.x, b.door.y - player.y);
  if (d < 95) { S.guide = null; return; }
  if (!bVisible(b)) { S.guide = null; return; }
  const CWd = cvs.width / DPR, CHd = cvs.height / DPR;
  let sx = (b.door.x - camX) * scale;

  const m = 52 + 20;
  sx = clamp(sx, m, Math.max(m, CWd - m));
  sy = clamp(sy, m, Math.max(m, CHd - m - 40));
  const tx = (b.door.x - camX) * scale, ty = (b.door.y - camY) * scale;
  const ang = Math.atan2(ty - sy, tx - sx);

  ctx.fillStyle = 'rgba(255,251,244,.94)';
  ctx.strokeStyle = 'rgba(120,80,50,.45)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#c9622f';
  ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-7, -9); ctx.lineTo(-7, 9); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#5b463a';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(b.name + ' · ' + Math.round(d / 10) + ' 步', sx, sy + bob + 40);

}

function stonePath(x, y, w, h) {
  ctx.fillStyle = C.stoneD; rr(x - 6, y - 6, w + 12, h + 12, 10); ctx.fill();
  ctx.fillStyle = C.stone; rr(x, y, w, h, 8); ctx.fill();
  const sw = 46, sh = 30;
  let row = 0;
  for (let yy = y + 4; yy < y + h - 4; yy += sh) {
    const off = (row % 2) * (sw / 2);
    for (let xx = x + 4 - off; xx < x + w - 4; xx += sw) {
      const cw = Math.min(sw - 6, x + w - 6 - xx);
      if (cw < 14) continue;
      const ch = Math.min(sh - 6, y + h - 6 - yy);
      boxS(xx, yy, cw, ch, 6, row % 2 ? C.stoneL : C.stone, 'rgba(160,148,124,0.45)', 1.2);
    }
    row++;
  }
}
function drawLands() {
  const SLOT = [[90, 980], [250, 980], [90, 1150], [250, 1150], [90, 1320], [250, 1320]];
  const n = Math.min((S.land || 1) - 1, SLOT.length);
  for (let i = 0; i < n; i++) {
    const x = SLOT[i][0], y = SLOT[i][1], w = 150, h = 110;
    ctx.fillStyle = '#c9a97b';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(120,90,60,.45)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x, y, w, h);
    for (let r = 1; r < 6; r++) {
      ctx.beginPath();
      ctx.moveTo(x + 6, y + r * (h / 6));
      ctx.lineTo(x + w - 6, y + r * (h / 6));
      ctx.stroke();
    }
    ctx.fillStyle = '#7ba24f';
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 8; c++) {
        ctx.beginPath();
        ctx.arc(x + 12 + c * 18, y + 8 + r * (h / 6), 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

/* ============ 绘制：人物 ============ */
function drawPerson(p, tag, sc, working) {
  const s = sc || 1;
  const x = p.x, y = p.y;
  const sw = p.moving ? Math.sin(p.phase * Math.PI * 2) : 0;
  const bob = p.moving ? Math.abs(Math.sin(p.phase * Math.PI * 2)) * 2.2 : 0;
  const c = p.c || { shirt:'#8a8a8a', shirt2:'#7a7a7a', pants:'#5a5a5a', shoe:'#3a3a3a', hair:'#2a2a2a', skin:'#e8c9a8' };

  ctx.save();
  const jumpY = p.jump > 0 ? -Math.sin((1 - p.jump / 0.34) * Math.PI) * 14 : 0;
  ctx.translate(x, y + jumpY); ctx.scale(s, s); ctx.translate(-x, -(y + jumpY));

  ellip(x, y + 2, 19, 6.5, 'rgba(90,110,70,0.20)');

  const hipY = y - 20;
  ctx.fillStyle = c.pants;
  rr(x - 10 + sw * 3, hipY, 9, 20, 4.5); ctx.fill();
  rr(x + 1 - sw * 3, hipY, 9, 20, 4.5); ctx.fill();
  ctx.fillStyle = c.shoe;
  rr(x - 11 + sw * 3, y - 5, 11, 6, 3); ctx.fill();
  rr(x + 0 - sw * 3, y - 5, 11, 6, 3); ctx.fill();

  const bodyY = hipY - 26 - bob;
  ctx.fillStyle = c.shirt;
  rr(x - 15, bodyY, 30, 30, 13); ctx.fill();
  ctx.fillStyle = c.shirt2;
  rr(x - 15, bodyY + 18, 30, 12, 11); ctx.fill();
  rr(x - 21, bodyY + 6, 8, 20, 4); ctx.fill();
  rr(x + 13, bodyY + 6, 8, 20, 4); ctx.fill();
  circle(x - 17, bodyY + 25, 4.2, c.skin);
  circle(x + 17, bodyY + 25, 4.2, c.skin);

  ctx.fillStyle = c.skin;
  rr(x - 5, bodyY - 7, 10, 10, 4); ctx.fill();

  const hy = bodyY - 26;
  // 腰带
  ctx.fillStyle = 'rgba(60,45,32,0.55)';
  rr(x - 14, bodyY + 15, 28, 4, 2); ctx.fill();
  // 领口
  ctx.fillStyle = c.shirt2;
  ctx.beginPath(); ctx.moveTo(x - 6, bodyY + 1); ctx.lineTo(x, bodyY + 8); ctx.lineTo(x + 6, bodyY + 1); ctx.closePath(); ctx.fill();
  circle(x, hy, 21, c.skin);
  // 眼睛
  ctx.fillStyle = 'rgba(40,32,26,0.85)';
  circle(x - 7.5, hy + 1.5, 2.1, 'rgba(40,32,26,0.85)');
  circle(x + 7.5, hy + 1.5, 2.1, 'rgba(40,32,26,0.85)');
  ctx.fillStyle = c.hair;
  ctx.beginPath();
  ctx.arc(x, hy - 1, 21.6, Math.PI * 1.03, Math.PI * 1.97);
  if (p.sex === 'f') {
    ctx.lineTo(x + 24, hy + 16); ctx.lineTo(x + 15, hy + 4);
    ctx.lineTo(x - 15, hy + 4); ctx.lineTo(x - 24, hy + 16);
  } else {
    ctx.lineTo(x + 18, hy + 6); ctx.lineTo(x + 13, hy - 6);
    ctx.lineTo(x - 13, hy - 6); ctx.lineTo(x - 18, hy + 6);
  }
  ctx.closePath(); ctx.fill();

  circle(x - 7.5, hy + 3, 3.7, '#fdf6ec');
  circle(x + 7.5, hy + 3, 3.7, '#fdf6ec');
  circle(x - 7.5, hy + 3.2, 2.4, '#241a14');
  circle(x + 7.5, hy + 3.2, 2.4, '#241a14');
  circle(x - 6.7, hy + 1.9, 1.0, '#ffffff');
  circle(x + 8.3, hy + 1.9, 1.0, '#ffffff');
  ellip(x - 12, hy + 9, 5.2, 3.2, 'rgba(235,140,140,0.28)');
  ellip(x + 12, hy + 9, 5.2, 3.2, 'rgba(235,140,140,0.28)');
  ctx.strokeStyle = '#b8805f'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, hy + 7, 3.4, 0.35, Math.PI - 0.35); ctx.stroke();

  if (working) {
    const t = Math.sin(clock / 190);
    ctx.save();
    ctx.translate(x + 15, bodyY + 26);
    ctx.rotate(-0.7 + t * 0.75);
    ctx.strokeStyle = '#8c6640'; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -34); ctx.stroke();
    ctx.fillStyle = '#a8aeb4';
    rr(-8, -41, 16, 8, 3); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  if (tag) {
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,250,240,0.85)';
    ctx.strokeText(tag.text, x, (y - 92) + (1 - s) * 38);
    ctx.fillStyle = tag.color;
    ctx.fillText(tag.text, x, (y - 92) + (1 - s) * 38);
  }

  // 惨叫冒字
  if (p.shout && p.shout.t > 0) {
    const k = 1 - p.shout.t / 0.9;
    ctx.globalAlpha = Math.min(1, p.shout.t * 2.2);
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(58,40,30,0.85)';
    ctx.strokeText(p.shout.text, x, y - 104 - k * 26);
    ctx.fillStyle = '#fff7ea';
    ctx.fillText(p.shout.text, x, y - 104 - k * 26);
    ctx.globalAlpha = 1;
  }
}

function drawCarriage(p) {

  rr(hx - 22, hy + 10, 5, 12, 2.6); ctx.fill();
  rr(hx - 4, hy + 10, 5, 12, 2.6); ctx.fill();
  boxS(x - 4, y - 42, 50, 32, 8, '#a2533f', 'rgba(120,60,46,0.5)', 1.6);

  circle(x + 40, y - 6 - sw * 2, 10, '#5f4630');

}

/* ============ 绘制：室内 ============ */
let lastRoomPeople = [];
function drawRoom(id) {
  const CW = cvs.width / DPR, CH = cvs.height / DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 好感不够：只能站在宫门外
  if (id === 'palace' && !S.emperor && S.favor < 3) {
    ctx.fillStyle = '#e6ddc8'; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#d9cfb6'; ctx.fillRect(0, 0, CW, 46);
    ctx.fillStyle = '#cfc4a9'; ctx.fillRect(0, CH * 0.8, CW, CH * 0.2);
    ctx.strokeStyle = 'rgba(150,138,116,.22)'; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) { const yy = 50 + i * 34; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(CW, yy); ctx.stroke(); }
    for (let i = 1; i < 6; i++) { const xx = i * CW / 6; ctx.beginPath(); ctx.moveTo(xx, 46); ctx.lineTo(xx, CH * 0.8); ctx.stroke(); }
    const dw = CW * 0.30, dh = CH * 0.40, dx = CW / 2 - dw / 2, dy = CH * 0.36;
    ctx.fillStyle = '#6f5233';
    ctx.beginPath();
    ctx.moveTo(dx, dy + dh);
    ctx.lineTo(dx, dy + 44);
    ctx.arc(CW / 2, dy + 44, dw / 2, Math.PI, 0);
    ctx.lineTo(dx + dw, dy + dh);
    ctx.closePath(); ctx.fill();
    box(dx + 12, dy + 56, dw - 24, dh - 56, 4, '#9a6f45');
    ctx.strokeStyle = 'rgba(60,40,24,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CW / 2, dy + 56); ctx.lineTo(CW / 2, dy + dh); ctx.stroke();
    for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) circle(dx + dw * 0.28 + i * dw * 0.44, dy + 96 + j * 44, 5, '#c9a24a');
    for (let i = 0; i < 3; i++) box(CW / 2 - (dw / 2 + i * 20), CH * (0.8 + i * 0.03), dw + i * 40, CH * 0.026, 3, '#cdc2a9');
    box(CW / 2 - 76, dy - 54, 152, 38, 6, '#c9a274');
    ctx.fillStyle = '#4d3f30'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('君主皇宫', CW / 2, dy - 27);
    [0.16, 0.84].forEach(function(px) {
      circle(CW * px, CH * 0.5, 11, '#f0c26a');
      circle(CW * px, CH * 0.5, 24, 'rgba(240,194,106,.22)');
    });
    drawPerson({ x: CW * 0.22, y: CH * 0.8, phase: 0, moving: false, sex: 'm',
      c: { shirt:'#4a5a6b', shirt2:'#3c4a58', pants:'#2f3a44', shoe:'#1f262c', hair:'#2a2a2a', skin:'#e8c9a8' } },
      { text: '卫兵', color: 'rgba(90,74,63,0.85)' }, 1.3);
    drawPerson({ x: CW * 0.78, y: CH * 0.8, phase: 0, moving: false, sex: 'm',
      c: { shirt:'#4a5a6b', shirt2:'#3c4a58', pants:'#2f3a44', shoe:'#1f262c', hair:'#2a2a2a', skin:'#e8c9a8' } },
      { text: '卫兵', color: 'rgba(90,74,63,0.85)' }, 1.3);
    ctx.fillStyle = 'rgba(60,50,40,0.85)';
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('门关着 —— 好感 ' + S.favor + ' / 3', CW / 2, CH * 0.955);
    return;
  }

  const wallCol = { house:'#f2e3cd', shop:'#f0e0c6', stable:'#d8c2a0', church:'#e8e2d6',
    green:'#dfe9dc', field:'#e4dcc0', tavern:'#d9c3a4', court:'#ddd6c6',
    bakery:'#efe0c6', hall:'#f0e4cc', hosp:'#eef2f2', tower:'#e6e0d2', lord:'#eee5d2' }[id] || '#efe4d2';

  ctx.fillStyle = wallCol; ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(0, CH * 0.42, CW, CH * 0.58);
  const fy = CH * 0.62;
  ctx.fillStyle = '#cf9f6b'; ctx.fillRect(0, fy, CW, CH - fy);
  for (let i = 0; i < 14; i++) {
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, fy + i * ((CH - fy) / 14), CW, (CH - fy) / 14 - 2);
  }

  if (id === 'church') {
    ctx.fillStyle = '#cfe0e2'; rr(CW * 0.32, 60, CW * 0.36, CH * 0.26, 40); ctx.fill();
    ['#c9a2d8','#a2c6d8','#e8cf8a','#c9a2d8'].forEach((c, i) => {
      ctx.fillStyle = c; rr(CW * 0.35 + i * CW * 0.08, 80, CW * 0.06, CH * 0.16, 20); ctx.fill();
    });
    box(CW * 0.32, CH * 0.5, CW * 0.36, CH * 0.12, 8, '#e6dccb');
    circle(CW * 0.5, CH * 0.44, 10, S.cerOn ? '#ffe9a8' : '#d9d2c0');
    for (let i = 0; i < 3; i++) {
      box(CW * 0.08, CH * 0.66 + i * 30, CW * 0.24, 14, 6, '#a97e52');
      box(CW * 0.68, CH * 0.66 + i * 30, CW * 0.24, 14, 6, '#a97e52');
    }
  } else if (id === 'court') {
    box(CW * 0.26, CH * 0.46, CW * 0.48, CH * 0.16, 8, '#b9ac96');
    box(CW * 0.34, CH * 0.4, CW * 0.32, CH * 0.07, 6, '#cfc4b0');
    box(CW * 0.47, CH * 0.36, CW * 0.06, 10, 4, '#8c6640');
    box(CW * 0.06, CH * 0.6, CW * 0.2, 12, 6, '#a97e52');
    box(CW * 0.74, CH * 0.6, CW * 0.2, 12, 6, '#a97e52');
  } else if (id === 'shop') {
    box(0, CH * 0.5, CW, CH * 0.12, 0, '#c9a274');
    for (let i = 0; i < 5; i++) circle(CW * 0.12 + i * CW * 0.18, CH * 0.48, 12, ['#e0c078','#d9a8a8','#9bcb76','#c9b6d8','#e3bf7a'][i]);
    ctx.fillStyle = '#8a6a52'; rr(CW * 0.06, 70, CW * 0.24, CH * 0.16, 10); ctx.fill();
    for (let i = 0; i < 3; i++) box(CW * 0.7, 90 + i * 34, CW * 0.24, 22, 6, '#b9ac96');
  } else if (id === 'tavern' || id === 'hall') {
    for (let i = 0; i < 3; i++) {

/* ============ 小地图 ============ */
function drawMinimap() {
  const CW = cvs.width / DPR;
  const mw = Math.min(104, CW * 0.26);
  const mx = CW - mw - 10, my = 40;
  boxS(mx, my, mw, mw * 0.72, 10, 'rgba(238,244,228,0.92)', 'rgba(110,130,95,0.5)', 1.4);
  ctx.save();
  rr(mx + 2, my + 2, mw - 4, mw * 0.72 - 4, 8); ctx.clip();
  const k = (mw - 4) / W, kh = (mw * 0.72 - 4) / H;
  BUILDINGS.forEach(b => {
    if (!isBuilt(b)) return;
    ctx.fillStyle = b.zone === 'city' ? '#8a9bad' : '#7fa06a';
    ctx.fillRect(mx + 2 + (b.x - b.w / 2) * k, my + 2 + (b.y - b.h / 2) * kh, Math.max(3, b.w * k), Math.max(3, b.h * kh));
  });
  slaves.forEach(s => {
    if (s.mode === 'flee') circle(mx + 2 + s.x * k, my + 2 + s.y * kh, 2.6, '#e0603f');
  });
  (S.walkers || []).forEach(function(w) {
    circle(mx + 2 + w.x * k, my + 2 + w.y * kh, 2.2, w.lover ? '#d1568a' : '#d98b3f');
  });
  circle(mx + 2 + player.x * k, my + 2 + player.y * kh, 3.2, '#3f6ea8');
  ctx.restore();
}

/* ============ 主循环 ============ */
let last = performance.now();
let clock = 0;

function loop(now) {
  try { loopBody(now); } catch (e) {
    showErr(e);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
}
function loopBody(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; clock = now;

  if (S.toastT > 0) { S.toastT -= dt; if (S.toastT <= 0) toastEl.classList.remove('on'); }

  tickClock(dt);
  if (!S.indoor && !storyOpen) {
    updatePlayer(dt);
    updateWorld(dt);
    slaves.forEach(s => updateSlave(s, dt));
    guards.forEach(g => updateGuard(g, dt));
    npcs.forEach(n => updateNpc(n, dt));
    S.walkers.forEach(w => updateNpc(w, dt));
    refreshActionBtn();
    // 医院：自动治病
    if (S.built.hospital) {
      const sick = slaves.filter(s => s.sick);
      if (sick.length && S.coins > 20) {
        S.hospT = (S.hospT || 0) + dt;
        if (S.hospT > 4) {
          S.hospT = 0;
          const s0 = sick[0];
          s0.sick = false; s0.sickT = 0;
          S.coins -= 20;
          toast('医生治好了 ' + s0.name + '（-20 金）');
        }
      }
    }
  }

  if (S.jail && !storyOpen) { S.jailT = (S.jailT || 0) + dt; if (S.jailT > 1.5) { S.jailT = 0; jailScreen(); } }
  if (S.trip) { updateTrip(dt); drawTrip(); updateHud(); requestAnimationFrame(loop); return; }
  if (S.indoor) {
    if (!storyOpen) { updateRoomPlayer(dt); refreshActionBtn(); }
    drawRoom(S.indoor);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  const CW = cvs.width / DPR, CH = cvs.height / DPR;
  const vw = CW / scale, vh = CH / scale;
  camX = clamp(player.x - vw / 2, 0, Math.max(0, W - vw));
  camY = clamp(player.y - vh / 2, 0, Math.max(0, H - vh));

  const k = scale * DPR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(k, 0, 0, k, -camX * k, -camY * k);

  drawGround();
  drawLands();
  drawPaths();
  drawHides();
  drawRoses();
  drawFountain(clock);
  BUILDINGS.filter(b => b.type === 'field').forEach(drawBuilding);

  const items = [];
  BUILDINGS.forEach(b => { if (b.type === 'field') return; items.push({ y:b.y + b.h / 2, kind:'b', ref:b }); });
  TREES.forEach(([tx, ty]) => items.push({ y:ty + 8, kind:'t', ref:[tx, ty] }));
  items.push({ y:player.y, kind:'p' });
  slaves.forEach(s => items.push({ y:s.y, kind:'s', ref:s }));
  guards.forEach(g => items.push({ y:g.y, kind:'g', ref:g }));
  npcs.forEach(n => items.push({ y:n.y, kind:'n', ref:n }));
  S.walkers.forEach(w => items.push({ y:w.y, kind:'w', ref:w }));
  (S.myCats || []).forEach(c => items.push({ y:c.y, kind:'cat', ref:c }));
  (S.kids || []).forEach(k => items.push({ y:k.y, kind:'kid', ref:k }));
  if (S.thief) items.push({ y:S.thief.y, kind:'thief', ref:S.thief });
  items.sort((a, b) => a.y - b.y);

  items.forEach(it => {
    if (!it) return;
    if (it.kind !== 'p' && !it.ref) return;
    if (it.kind === 'b') drawBuilding(it.ref);
    else if (it.kind === 't') drawTree(it.ref[0], it.ref[1]);
    else if (it.kind === 'p') { if (player.riding) drawCarriage(player); else drawPerson(player); }
    else if (it.kind === 's') {
      const s = it.ref;
      let st = '', col = 'rgba(78,62,46,.92)';
      if (s.mode === 'flee') { st = '逃' + Math.floor(s.fleeDays) + '天'; col = '#d9603f'; }
      else if (s.mode === 'restless') { st = '不安'; col = '#b8871f'; }
      else if (s.mode === 'hungry') { st = '饿'; col = '#a5762f'; }
      else if (s.sick) { st = '病'; col = '#c4557a'; }
      else if (s.rank > 0) { st = rankName(s.rank); col = '#4f7a3e'; }
      const tag = { text: (s.name || '?') + (st ? ' · ' + st : ''), color: col };
      drawPerson(s, tag, s.isChild ? 0.66 : 1, s.mode === 'work');
    } else if (it.kind === 'w') {
      const w = it.ref;
      drawPerson(w, { text: w.name + (w.lover ? ' ♥' : ''), color: w.lover ? '#c0506a' : 'rgba(66,52,38,.95)' });
      drawWalkerAcc(w);
    } else if (it.kind === 'n') {
      drawPerson(it.ref, { text:'女仆', color:'#7d6a86' });
    } else if (it.kind === 'kid') {
      const k = it.ref;
      drawPerson(k, { text: k.name + ((k.age || 0) >= 1 ? ' · ' + k.age + '岁' : ''), color: 'rgba(90,70,50,.92)' }, Math.min(1, 0.6 + (k.age || 0) * 0.09), (k.age || 0) >= 2);
    } else if (it.kind === 'cat') {
      drawCat(it.ref);
    } else if (it.kind === 'thief') {
      const t = it.ref;
      ctx.save(); ctx.globalAlpha = 0.9;
      drawPerson({ x:t.x, y:t.y, phase:clock / 200, moving:true, sex:'m', c:{ shirt:'#2f2f38', shirt2:'#26262e', pants:'#1f1f26', shoe:'#141419', hair:'#101014', skin:'#3d2b20' } },
        { text:'小偷', color:'#d9603f' });
      ctx.restore();
    } else {
      drawPerson(it.ref, { text:'守卫', color:'#3f5a6b' });
    }
  });

  drawWall();

  if (player.whip > 0) {
    const t = 1 - player.whip / 0.28;
    ctx.strokeStyle = 'rgba(180,90,70,' + (0.8 * (1 - t)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y - 50, 34 + t * (60 + player.whipLv * 20), -0.9, 0.9);
    ctx.stroke();
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawGuide();
  drawMinimap();
  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
updateHud();

  ['bankrupt', '结局一 · 破产', '钱欠到 -60 金以下。', '把钱花光、人饿死、税不来交，一路亏到底。'],
  ['happy', '结局二 · 人生美满', '有 2 个孩子 + 3000 金 + 一个逃奴都没有。', '生孩子（主宅「要个孩子」），把不安压下去，攒够钱。'],
  ['lord', '结局三 · 新的君主', '刺杀成功当上君主（君主已死）+ 10000 金。', '皇宫献礼三次 → 下药 → 刺杀 → 攒到一万。'],
  ['tyrant', '结局五 · 暴君之夜', '当上君主后被人刺杀。', '称帝之后滥用鞭子、把不安压满，就会有人来。'],
  ['retire', '结局四 · 一个人的庄园', '庄园里 0 个农奴 + 800 金 + 撑过第 6 天。', '把人都放走或卖了，自己留着钱过日子。'],
  ['heir', '结局六 · 继承人', '孩子能接手 + 5000 金 + 过 15 天。', '主宅「培养继承人」，钱和天数都够。']
];
function renderTasks() {
  const got = (function() { try { return JSON.parse(localStorage.getItem(END_KEY) || '{}'); } catch (e) { return {}; } })();
  document.getElementById('ttList').innerHTML = END_INFO.map(function(e, i) {
    const ok = !!got[e[0]];
    return '<div class="tt-row"><b>' + e[1] + (ok ? ' <span class="got">已解锁</span>' : ' <span class="nope">没解锁</span>') + '</b>' +
      '条件：' + e[2] + '<br>怎么走：' + e[3] + '</div>';
  }).join('') + '<div class="tt-row" style="border:0;color:#8a8f7d">六个全解锁后，开局会变成「创世主」，可以随便造。</div>';
}
function startTitle() {
  const raw = (function() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } })();
  const info = document.getElementById('ttInfo');
  if (raw) {
    try {
      const d = JSON.parse(raw);
      const sd = (d && d.S) || {};
      info.innerHTML = '上一次：第 ' + (sd.day || 1) + ' 天 · 金 ' + Math.floor(sd.coins || 0) +
        ' · 农奴 ' + ((d.slaves || []).length) + ' 人<br>存档时间 ' + new Date(d.t || Date.now()).toLocaleString();
    } catch (e) { info.innerHTML = '有一个存档，但读不出来'; }
  } else {
    info.innerHTML = '还没有存档。点「从头开始」，你就是这块地的新主人。';
  }
  document.getElementById('title').classList.remove('off');
  document.getElementById('ttCont').onclick = function() {
    if (loadGame()) {
      dressPlayer(); updateHud();
      document.getElementById('title').classList.add('off');
      toast('接着上次：第 ' + S.day + ' 天');
    } else { toast('没有能接的存档'); }
  };
  document.getElementById('ttNew').onclick = function() {
    let okGo = true;
    if (raw) { try { okGo = window.confirm('从头开始会覆盖现在这座庄园，确定吗？'); } catch (e) { okGo = true; } }
    if (!okGo) return;
    clearSave();
    document.getElementById('title').classList.add('off');
    bootNew();
  };
  document.getElementById('ttTask').onclick = function() {
    renderTasks();
    document.getElementById('ttPanel').classList.add('on');
  };
  document.getElementById('ttClose').onclick = function() {
    document.getElementById('ttPanel').classList.remove('on');
  };
}
function bootNew() {
  S.booted = false;
  slaves.length = 0;
  S.kids = []; S.myCats = []; S.cats = 0; S.land = 1; S.lovers = [];
  S.npcLover = {}; S.haremNames = []; S.harem = 0; S.haremM = 0; S.haremF = 0;
  S.day = 1; S.coins = 900; S.wheat = 40; S.bread = 8;
  S.built = { bakery: true, hall: true, hospital: true, tower: true, manor2: false };
  S.escapees = []; S.myCases = []; S.cases = [];
  S.walkers.forEach(function(w) { w.aff = 0; w.lover = false; });
  slaves.push(makeSlave('m', 470, 1090), makeSlave('f', 545, 1120), makeSlave('m', 620, 1080));
  if (allEndingsDone()) {
    S.creator = true; S.coins = 1000;
    S.built = { bakery: true, hall: true, hospital: true, tower: true, manor2: true };
    showEgg();
    saveGame();
    return;
  }
  showStory('开局 · 一块荒了的地',
    '你继承了这座庄园。' + NL + NL + '地、三户农奴、九百个银币，还有几笔没结的旧账。' + NL +
    '墙里是你的地，墙外是城。' + NL + NL + '鞭子在手上，法典在账房里。',
    [{ t:'去看看我的地', f:function() { toast('走近人按「抽」。你自己的人会求饶，路人会跑'); } }],
    '按方向键走动 · 靠近门口会冒出「进入」 · 左上角「？」看说明');
  saveGame();
}
function wipeAll() {
  showStory('清空记录',
    '这一步删掉就回来了。' + NL + NL + '要清哪个？',
    [
      { t:'只删存档（重新开一局）', f:function() { clearSave(); location.reload(); } },
      { t:'连结局收集一起删', f:function() {
          clearSave();
          try { localStorage.removeItem(END_KEY); } catch (e) {}
          location.reload();
        } },
      { t:'算了，留着', f:function() {} }
    ], '删掉之后刷新页面', false);
}
setTimeout(() => {
  startTitle();
  return;
  if (allEndingsDone()) {
    S.creator = true;
    S.coins = 1000;
    S.built = { bakery: true, hall: true, hospital: true, tower: true, manor2: true };
    slaves.push(makeSlave('m', 440, 1120), makeSlave('f', 540, 1120));
    S.emperor = false;
    showEgg();
    return;
  }
  const got = END_IDS.filter(k => getEndings()[k]).length;
  askGender(function() {
  if (!S.booted) {
    S.booted = true;
    S.coins = 900; S.wheat = 40; S.bread = 8;
    S.built = { bakery: true, hall: true, hospital: true, tower: true, manor2: false };
    if (!slaves.length) {
      slaves.push(makeSlave('m', 470, 1090), makeSlave('f', 545, 1120), makeSlave('m', 620, 1080));
    }
  }
  showStory('开局 · 一块荒了的地',
    '你继承了这座庄园。\n\n地、三户农奴、六百个银币，还有几笔没结的旧账。\n墙里是你的地，墙外是城。\n\n鞭子在手上，法典在账房里。' +
    (got ? '\n\n（已收集结局 ' + got + ' / 5）' : ''),
    [{ t:'去看看我的地', f:()=>{ toast('走近人按「抽」。你自己的人会求饶，路人会跑，跑掉的会去告你'); } }],
    '按方向键走动 · 靠近门口会冒出「进入」 · 左上角「？」看说明');
  });
}, 500);

</script>
