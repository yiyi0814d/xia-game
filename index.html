<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>电子夏萧因</title>
<style>
:root{
  --purple:#b98cff; --purple-d:#6d4b9e; --ink:#241b30;
  --mood:#d98cff; --energy:#7fd4c1; --health:#ffb86b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#f6f4f0;
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:#fff;user-select:none;}
#stage{position:fixed;inset:0;overflow:hidden;}

/* ---------- 背景 & 立绘 ---------- */
#bg{position:absolute;inset:0;background:#f6f4f0 center/cover no-repeat;
  transition:opacity .45s ease;opacity:1;}
#bg.fade{opacity:0;}
#char{position:absolute;left:50%;bottom:7%;height:62%;max-width:96%;
  transform:translateX(-50%);object-fit:contain;z-index:2;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));
  transition:opacity .35s ease,transform .35s ease;}
#char.hide{opacity:0;transform:translateX(-50%) translateY(14px);}
#char.talk{transform:translateX(-50%) translateY(-6px);}
.noimg{background:linear-gradient(160deg,#3a2f52,#221a33);}

/* ---------- 点他提示 ---------- */
#tapHint{position:absolute;left:50%;bottom:65%;transform:translateX(-50%);z-index:7;
  background:rgba(185,140,255,.9);color:#1b1226;font-size:12px;border-radius:14px;
  padding:4px 11px;pointer-events:none;animation:bob 1.7s infinite;
  box-shadow:0 4px 12px rgba(0,0,0,.3);}
#tapHint.gone{display:none;}
/* 全站共用的一张淡纹理（暖米底 + 极淡碎花），只用一份，不占两遍体积 */
:root{ --tex:url("img/0e28a9fce2.jpg"); }
/* 生日倒计时（右上角，跟着 HUD 走） */
#bday{background:var(--glass);border:1px solid var(--line);border-radius:14px;
  padding:7px 12px;font-size:12px;color:#cfc6de;cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.35);white-space:nowrap;}
#bday b{color:#f0c2d8;font-weight:600;margin:0 2px;}
#bday.on{background:rgba(244,200,222,.16);border-color:rgba(244,200,222,.8);
  color:#ffd9e8;box-shadow:0 0 16px rgba(244,200,222,.4);}
#bday.gone{display:none;}
@keyframes bob{0%,100%{opacity:.6;transform:translateX(-50%) translateY(0);}
  50%{opacity:1;transform:translateX(-50%) translateY(-7px);}}

/* ---------- 旁白 ---------- */
#narration{position:absolute;top:10px;left:12px;right:82px;max-height:27%;
  overflow-y:auto;z-index:6;display:flex;flex-direction:column;gap:6px;
  pointer-events:none;}
.narr{background:rgba(255,255,255,.86);color:var(--ink);border-radius:12px;
  padding:8px 12px;font-size:14px;line-height:1.55;max-width:100%;
  box-shadow:0 5px 16px rgba(0,0,0,.28);animation:fin .32s ease;}
@keyframes fin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

/* ---------- 台词 ---------- */
#say{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(8px);z-index:7;max-width:88%;
  background:rgba(255,255,255,.86);color:var(--ink);border-radius:14px;
  padding:8px 14px;font-size:15px;line-height:1.5;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .22s,transform .22s;
  pointer-events:none;} 
#say.on{opacity:1;transform:translateX(-50%) translateY(0);}
#say b{color:var(--purple-d);font-weight:700;}

/* ---------- 顶部数值 HUD ---------- */
#hud{position:absolute;top:10px;right:10px;z-index:9;display:flex;flex-direction:column;
  align-items:flex-end;gap:6px;}
#hudBtn{background:rgba(30,22,45,.72);border:1px solid rgba(185,140,255,.45);
  color:#f1e7ff;border-radius:20px;padding:6px 12px;font-size:12px;}
#chip{background:rgba(30,22,45,.72);border:1px solid rgba(185,140,255,.35);
  color:#ffe9a8;border-radius:20px;padding:5px 11px;font-size:12px;}
#hudPanel{overflow:hidden;max-height:0;transition:max-height .3s ease;
  background:rgba(24,17,36,.86);border-radius:14px;padding:0 12px;
  border:1px solid rgba(185,140,255,.3);width:196px;}
#hudPanel.open{max-height:200px;padding:12px;}
.row{margin-bottom:9px;}
.row:last-child{margin-bottom:0;}
.row .lab{display:flex;justify-content:space-between;font-size:12px;
  color:#d9cff0;margin-bottom:4px;}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:8px;transition:width .3s;}
.bar.mood i{background:linear-gradient(90deg,#a86bff,#e9b7ff);}
.bar.energy i{background:linear-gradient(90deg,#3fbfa6,#a8f0e2);}
.bar.health i{background:linear-gradient(90deg,#e08b3a,#ffd39a);}

/* ---------- 按钮区 ---------- */
#actions{position:absolute;left:0;right:0;bottom:0;z-index:8;
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  padding:10px 10px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(12,8,20,.85),rgba(12,8,20,0));}
.btn{background:rgba(48,36,70,.9);border:1px solid rgba(185,140,255,.5);
  color:#f4ecff;border-radius:22px;padding:10px 16px;font-size:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s,background .2s;}
.btn:active{transform:scale(.94);background:rgba(120,86,180,.95);}
.btn.ghost{background:rgba(30,22,45,.8);border-color:rgba(185,140,255,.3);}
.btn.wide{padding:10px 26px;}

/* ---------- toast（系统提示） ---------- */
#toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;
  gap:6px;align-items:center;pointer-events:none;width:90%;}
.tst{background:rgba(185,140,255,.94);color:#1b1226;font-size:13px;
  border-radius:10px;padding:7px 14px;box-shadow:0 6px 18px rgba(0,0,0,.4);
  animation:tin .25s ease;max-width:100%;text-align:center;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ---------- 全屏面板（其他页） ---------- */
#oStory{display:none;max-height:34vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:rgba(252,250,246,.98);border:1px solid rgba(120,100,140,.18);
  border-radius:14px;padding:10px 12px;margin:0 0 12px;
  font-size:14px;line-height:1.75;box-shadow:0 6px 18px rgba(60,45,80,.10);}
#oStory.on{display:block;}
#oStory .gs-n{color:#8b8194;}
#oStory .gs-s{color:#2f2a38;}
#oStory .gs-p{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px;}
#oStory .gs-p .btn{width:200px;padding:13px 0;border-radius:13px;font-size:14px;}
#gStory{display:none;max-height:32vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:rgba(252,250,246,.97);border:1px solid rgba(120,100,140,.18);
  border-radius:14px;padding:10px 12px;margin:6px 0 8px;
  font-size:14px;line-height:1.75;box-shadow:0 6px 18px rgba(60,45,80,.10);}
#gStory.on{display:block;}
#gStory .gs-n{color:#8b8194;}
#gStory .gs-s{color:#2f2a38;}
#gStory .gs-p{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px;}
#gStory .gs-p .btn{width:200px;padding:13px 0;border-radius:13px;font-size:14px;}
#char2.hide{opacity:0 !important;}
#other{position:absolute;inset:0;z-index:14;background:rgba(14,10,22,.96);
  padding:16px;overflow-y:auto;display:none;flex-direction:column;}
#other.show{display:flex;}
#other.earnbg{background-color:#DCCFBE;background-image:url("img/8c077dcbb5.jpg");
  background-size:cover;background-position:center;}
#other.earnbg::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,250,240,.10),rgba(255,250,240,.24));}
#other.earnbg > *{position:relative;z-index:2;}
#other.panelbg{background-color:#F3EDE3;background-image:url("img/8275d824ba.jpg");
  background-size:cover;background-position:center;}
#other.panelbg::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,248,.60),rgba(255,253,248,.74));}
#other.panelbg > *{position:relative;z-index:2;}
#other.bdaybg{background-color:#EFE7DA;background-image:url("img/8dc220462d.jpg");
  background-size:cover;background-position:center;}
#other.bdaybg::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,248,.42),rgba(255,251,243,.62));}
#other.bdaybg > *{position:relative;z-index:2;}
#other h2{font-size:16px;margin:4px 0 12px;color:#e5d3ff;font-weight:600;}
.card{background:rgba(43,32,62,.85);border:1px solid rgba(185,140,255,.28);
  border-radius:14px;padding:12px;margin-bottom:12px;}
.card h3{margin:0 0 8px;font-size:14px;color:#d8c4ff;font-weight:600;}
.card p{margin:0 0 8px;font-size:12.5px;color:#bdb0d4;line-height:1.5;}
.list{display:flex;flex-direction:column;gap:7px;}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:13px;background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px;}
.item .p{color:#ffe9a8;font-size:12px;}
.mini{background:rgba(120,86,180,.9);border:none;color:#fff;border-radius:16px;
  padding:6px 12px;font-size:12.5px;}
.mini.grey{background:rgba(255,255,255,.14);}
.small{font-size:12px;color:#a99bc0;line-height:1.5;}

/* ---------- 弹窗 ---------- */
#modal{position:absolute;inset:0;z-index:20;background:rgba(8,5,14,.72);
  display:none;align-items:center;justify-content:center;padding:20px;}
#modal.show{display:flex;}
#modalCard{background:linear-gradient(165deg,#2c2140,#1d1530);width:100%;max-width:340px;
  border:1px solid rgba(185,140,255,.45);border-radius:18px;padding:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);animation:mup .22s ease;}
@keyframes mup{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
#modalCard h3{margin:0 0 10px;font-size:15px;color:#e9d8ff;}
#modalCard .mtext{font-size:13.5px;line-height:1.6;color:#cfc2e6;margin:0 0 14px;}
.mrow{display:flex;gap:8px;flex-wrap:wrap;}
.mbtn{flex:1;min-width:84px;background:rgba(120,86,180,.9);border:1px solid rgba(185,140,255,.5);
  color:#fff;border-radius:12px;padding:11px 8px;font-size:14px;}
.mbtn.grey{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);}
#nameIn{width:100%;padding:11px 12px;border-radius:12px;font-size:16px;
  border:1px solid rgba(185,140,255,.5);background:rgba(255,255,255,.08);
  color:#fff;outline:none;text-align:center;letter-spacing:2px;}
.cnt{font-size:11px;color:#9c8fb5;text-align:right;margin:6px 2px 12px;}

/* ---------- 开场 ---------- */
#intro{position:absolute;inset:0;z-index:30;background:#0b0710;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:24px;text-align:center;transition:opacity .5s;}
#intro.out{opacity:0;pointer-events:none;}
#intro p{font-size:14.5px;line-height:1.8;color:#cbbdd9;margin:0;max-width:300px;}
#intro .big{font-size:20px;color:#e7d8ff;letter-spacing:3px;}
/* ================= 改版：排版与配色 ================= */

}
html,body{background:var(--bg);color:var(--ink);}

#bg{background-color:#1a1622;}
#char{bottom:9%;height:60%;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6));}

  border-radius:12px;padding:5px 12px;box-shadow:0 8px 20px rgba(0,0,0,.4);}

  box-shadow:0 8px 22px rgba(0,0,0,.35);}

  background:var(--glass);border:1px solid var(--line);color:#f6f3fa;

#hudPanel{background:var(--glass);border:1px solid var(--line);border-radius:16px;width:200px;padding:0 13px;}
#hudPanel.open{padding:13px;max-height:220px;}
.row{margin-bottom:11px;}
.row .lab{font-size:11.5px;color:var(--dim);margin-bottom:5px;}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);}

#actions{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:460px;
  gap:9px;padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(10,8,14,.9),rgba(10,8,14,.45) 62%,rgba(10,8,14,0));}

  color:#f2eef8;border-radius:16px;padding:12px 6px;font-size:13.5px;letter-spacing:1px;
  box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .12s,background .2s,border-color .2s;}

  padding:20px 16px calc(30px + env(safe-area-inset-bottom));}

#intro{background:#0d0a12;}

<!-- ============ 改版2：对话框 / 立绘双层 / 系统提示 / 页签 ============ -->
<style>
#stage{position:relative;overflow:hidden;}
#char{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);
  height:56%;object-fit:contain;z-index:2;
  transition:filter .35s ease, opacity .3s ease;}
#char2{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:56%;object-fit:contain;z-index:6;
  opacity:0;pointer-events:none;
  transition:opacity .35s ease, filter .35s ease;}
#char2.show2{opacity:1;}
#scrim{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 78%, rgba(10,8,16,.30), rgba(8,6,12,.78));
  opacity:0;transition:opacity .35s ease;}

#stage.talking #bg{filter:brightness(.5) saturate(.85);}
#stage.talking #char{filter:brightness(.42) blur(1px);}
#stage.talking #scrim{opacity:1;}
#stage.talking #actions,
#stage.talking #tabs,
#stage.talking #tapHint{opacity:0;pointer-events:none;transform:translateY(14px);}
#stage.talking #tipbar{opacity:0;}

#say{position:absolute;left:14px;right:14px;bottom:70px;z-index:10;
  min-height:118px;padding:26px 20px 24px;
  background:linear-gradient(180deg,rgba(30,24,42,.94),rgba(19,15,28,.97));
  border:1px solid var(--line,rgba(255,255,255,.14));
  border-radius:20px;
  box-shadow:0 20px 46px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  opacity:0;transform:translateY(18px);pointer-events:none;
  transition:opacity .26s ease, transform .26s ease;}
#say.on{opacity:1;transform:translateY(0);pointer-events:auto;}
#dName{position:absolute;top:-14px;left:18px;
  background:#1c1630;border:1px solid var(--accent,#b9a5e6);color:#efe7fb;
  border-radius:999px;padding:3px 14px;font-size:13px;letter-spacing:1px;
  box-shadow:0 6px 16px rgba(0,0,0,.45);}
#sayText{display:block;color:#f4effc;font-size:16px;line-height:1.95;
  word-break:break-word;min-height:1.9em;}
#say.narr #sayText{color:#b6abc9;font-style:italic;font-size:15px;}
#dNext{position:absolute;right:16px;bottom:6px;font-size:12px;color:var(--accent,#b9a5e6);
  opacity:.8;animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(4px);opacity:1}}
.dfeel{float:right;margin-left:10px;color:var(--accent,#b9a5e6);font-style:normal;}

#tipbar{position:absolute;top:12px;left:50%;z-index:14;
  transform:translate(-50%,-16px);
  max-width:88%;padding:8px 16px;border-radius:999px;
  background:rgba(34,12,16,.94);border:1px solid rgba(255,86,86,.5);
  color:#ff6262;font-size:13.5px;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;pointer-events:none;
  box-shadow:0 0 18px rgba(255,60,60,.22);
  transition:opacity .3s ease, transform .3s ease;}
#tipbar.on{opacity:1;transform:translate(-50%,0);animation:tipPulse 1.2s ease-in-out infinite;}
#tipbar .hi{color:#fff;background:rgba(255,86,86,.32);padding:0 5px;border-radius:5px;
  font-weight:700;letter-spacing:1px;}
@keyframes tipPulse{0%,100%{box-shadow:0 0 12px rgba(255,60,60,.18)}50%{box-shadow:0 0 28px rgba(255,60,60,.62)}}

#actions{position:absolute;left:0;right:0;bottom:76px;z-index:8;
  display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:0 12px;
  transition:opacity .3s ease, transform .3s ease;}
#actions .btn{flex:0 0 auto;min-width:74px;padding:11px 16px;font-size:13.5px;border-radius:13px;
  background:rgba(255,255,255,.07);border:1px solid var(--line,rgba(255,255,255,.14));
  color:#e7e0f3;}

/* ===== FIX 2026-09-25 v2：按钮区左移半屏的根因修法 =====
   根因：189 行给 #actions 设了 transform:translateX(-50%)，
        286 行却把 left 改回 0、right 改回 0，位移没同步重置，
        于是整块按钮区被左移半个屏宽，按钮左半截出屏。
   正解不是把 left 挪回 50%（那会让可用宽只剩半屏，按钮堆成好几行），
   而是把 transform 清掉，让 left:0/right:0 撑满整屏宽，
   再靠内部 flex 居中排按钮。 */
#actions{
  left:0; right:0;
  transform:none;
  width:auto; max-width:none;
  bottom:calc(76px + env(safe-area-inset-bottom));
  padding:0 12px;
  display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
  gap:10px; z-index:8;
}
/* 选项态：画面正中弹出，自带位移，不能清 */
#actions.choice{
  left:50%; right:auto; bottom:auto; top:50%;
  transform:translate(-50%,-50%);
  flex-direction:column; align-items:center; gap:14px;
  width:auto; max-width:calc(100% - 24px);
  padding:0;
}
#stage.talking #actions{transform:translateY(14px);}
#stage.talking #actions.choice{transform:translate(-50%,-50%);}
/* ===== FIX 2026-09-25 v3：两处界面瑕疵 =====
   1) 按钮后面的黑块：189 行给 #actions 铺了一条从底往上渐淡的深色
      渐变（rgba(10,8,14,.9) → 透明），本意是让按钮压住背景，实际
      在浅色场景上就是一块发黑的底。直接清掉，按钮自己有毛玻璃底。
   2) 数值面板收起时的一条横线：#hudPanel 收起态是 max-height:0 +
      overflow:hidden，高度归零了，但 65/179 行的 border 还在，
      上下两条边合起来就是那条细线。只对收起态把边框颜色抹透明，
      宽度留着一动不动（避免布局跳一下），展开态一个字不改。 */
#actions{background:none;}
/* v3 那版只抹了边框颜色，不够——横线是面板自己的底色在撑：
   收起时高度只剩「上下边框 2px」，可 background:var(--glass) 照样把
   这 2px 涂出来，就是那条横杠。所以边框和底色一起撤，收起即彻底隐形。 */
#hudPanel:not(.open){border-width:0;background:none;}

  border-radius:7px;border:4px solid rgba(255,255,255,.94);
  box-shadow:0 6px 16px rgba(80,60,40,.24);
  overflow:hidden;transition:transform .15s ease;}
.stk img{width:100%;display:block;}
.stk:active{transform:scale(.94) rotate(0deg) !important;}
var STK=[];
function stkInit(){
STK=[
 {src:'img/b0e00e54dd.jpg',l:'3.5%',t:'25%',w:'21%',rot:-5, say:'那只白狗，坐杯子里的。' },
  {src:'img/3bc37f055b.jpg',l:'32%',t:'4%', w:'27%',rot:0,  say:'翅膀上写着一行字，太远了看不清。' },
 {src:'img/2deafd2c4e.jpg',rg:'2.5%',t:'43%',w:'17%',rot:6, say:'那张条子上写着——你念过好几遍了。' },
 {src:'img/dd0c5b2d7a.jpg',rg:'6%',t:'12%',w:'17%',rot:-3,say:'咖啡和蛋糕。下次带你去。' }
];
}
function stkPaint(){
  var box=document.getElementById('stickers');
  if(!box) return;
  if(!STK.length) stkInit();
  box.innerHTML=STK.map(function(o,i){
    var p=stkPosOf('room'+i, parseFloat(o.l||'10'), parseFloat(o.t||'30'));
    var rot=(o.rot?'transform:rotate('+o.rot+'deg);':'');
    return '<div class="stk" data-i="'+i+'" style="left:'+p.l+'%;top:'+p.t
      +'%;width:'+o.w+';'+rot+'"><img src="'+o.src+'"></div>';

<script>
/* ---- 界面贴纸（2026-09-26） ---- */
var PSTK={
 earn :{src:'img/f856d95cd8.jpg',say:'喝一口再干活。'},
 qin  :{src:'img/9b43134d6b.jpg',say:'这根弦我调过了。'},
 bday :{src:'img/5ec097888b.jpg',say:'那天有个蛋糕。'}
};
function stkPosOf(key,dL,dT){

}
function pstkPaint(k){

  else { d.style.left=p.l+'%'; d.style.top=p.t+'%'; }

/* =========================================================
   电子夏萧因 — 单文件离线小游戏
   ========================================================= */
const IMG = {
  box:"img/42238ba1c9.jpg",
  room:"img/32890164a1.jpg",
  char:"img/4c7b047aa8.webp",
  sleep:"img/ffd8b160c5.jpg"
};
const KEY = 'xxy_save_v1';

/* ---------------- 存档 ---------------- */
const DEFAULT = {
  playCount:0, gWang:0, gWangFav:0, wangOpen:0, chenOpen:0, zhouOpen:0, wangRoom:0, yardCount:0, shopCount:0, liWang:0, liFav:0, wangLink:0,
  shenWang:0, shenFav:0, shenCalm:0, xyAct:0, xyEnd:0,
  rule:0, lastLove:0, lastPay:0, loveWarn:0, payWarn:0, lastFeed:0, full:0,
  name:'夫人', mood:70, energy:80, health:80, money:500,
  foods:{}, fish:[], dolls:[],
  pokeCount:0, feedCount:0, bathCount:0,
  loseStreak:0, winStreak:0,
  asleep:false, justWoke:false, giftIdx:0, started:false,
  bank:{ in:0, his:0, log:[], lastHe:0 },
  qin:{ best:0, done:0, tuned:0 },
  fishdex:{},
  sfx:100, bgm:100,
  muyu:{ total:0, round:0, done:0 },
  items:{}, lastBath:0, lastTick:0,
  dollsGiven:{}, dollsEver:{}, gaveWang:0, gaveLi:0, gaveShen:0, donated:0,
  blkOn:1
};
let S = JSON.parse(JSON.stringify(DEFAULT));
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const o = JSON.parse(raw);
    Object.assign(S, o);
    /* FIX 2026-09-25：asleep / justWoke 是「当下这一刻」的状态，不该跟着
       存档活到下一次打开。之前它被存下来，刷新后页面渲染的是「房间」，
       可 S.asleep 还是 true，于是点「睡觉」当场撞上 if(S.asleep) return，
       一声不响，看着就像这个按钮被删了。读档时一律归位成醒着。 */
    S.asleep=false; S.justWoke=false;
    return !!o.started;
  }catch(e){ return false; }
}

/* ---------------- 音频（全部现合成，不吃素材） ---------------- */
let AC=null, bgmTimer=null, bgmOn=true;
let sfxVol=1, bgmVol=1;
/* 两个总音量：0~100 存进档里，0 就是静音。 */
function applyAudio(){
  if(typeof S.sfx!=='number' || !isFinite(S.sfx)) S.sfx=100;
  if(typeof S.bgm!=='number' || !isFinite(S.bgm)) S.bgm=100;
  S.sfx=Math.max(0,Math.min(100,S.sfx));
  S.bgm=Math.max(0,Math.min(100,S.bgm));
  sfxVol=S.sfx/100;
  bgmVol=S.bgm/100;
  if(bgmVol<=0) stopBGM();
}
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,vol,type){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  const t=c.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol*sfxVol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03);
}
function click(){ tone(680,0.055,0.10,'triangle'); }
function ping(){ tone(880,0.16,0.08,'sine'); setTimeout(()=>tone(1320,0.18,0.05,'sine'),90); }
function bad(){ tone(180,0.22,0.09,'sawtooth'); }
function coin(){ tone(1046,0.09,0.09,'square'); setTimeout(()=>tone(1568,0.13,0.07,'square'),80); }
function doorbell(){
  tone(659,0.55,0.13,'sine');
  setTimeout(()=>tone(523,0.85,0.12,'sine'),380);
}
/* 背景音乐：一段安静的循环（C大调分解和弦 + 低音衬底） */
function pad(f,dur,vol){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type='sine'; o.frequency.value=f;
  const t=c.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol*bgmVol,t+0.9);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.1);
}
function startBGM(){
  if(bgmTimer || !bgmOn) return;
  /* Am - F - C - G 四组和弦慢慢推，每组铺低音 + 三个音，首尾叠着走 */
  const CH=[
    { b:110.00, t:[220.00, 261.63, 329.63] },
    { b: 87.31, t:[174.61, 220.00, 261.63] },
    { b:130.81, t:[261.63, 329.63, 392.00] },
    { b: 98.00, t:[196.00, 246.94, 293.66] }
  ];
  let i=0;
  const step=()=>{
    if(!bgmOn) return;
    const ch=CH[i%CH.length];
    pad(ch.b,    7.4, 0.0150);
    pad(ch.t[0], 6.6, 0.0095);
    pad(ch.t[1], 6.6, 0.0080);
    pad(ch.t[2], 6.6, 0.0068);
    /* 顶上一点很淡的高音，像很远的地方有人也跟着弹 */
    setTimeout(function(){ pad(ch.t[2]*2, 3.0, 0.0032); }, 1100);
    if(i%4===3) setTimeout(function(){ pad(659.25, 3.6, 0.0042); }, 2100);
    i++;
  };
  step(); bgmTimer=setInterval(step,6400);
}
function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
/* 拨弦：一下就是一下。快起、慢落，叠一层八度和一层十二度泛音。
   七根弦的音高在 QIN_F 里定，正调 C-D-F-G-A-c-d。 */
function pluck(f,vol){
  const c=ac(); if(!c) return;
  const v=(vol==null?0.075:vol)*sfxVol, t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain();
  o.type='triangle'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(v,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.05);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+1.15);
  const o2=c.createOscillator(), g2=c.createGain();
  o2.type='sine'; o2.frequency.value=f*2;
  g2.gain.setValueAtTime(0.0001,t);
  g2.gain.linearRampToValueAtTime(v*0.34,t+0.005);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  o2.connect(g2); g2.connect(c.destination); o2.start(t); o2.stop(t+0.65);
}

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const bg=$('bg'), charEl=$('char'), char2=$('char2'), narrEl=$('narration'), sayEl=$('say'),
      sayText=$('sayText'), actions=$('actions'), toastEl=$('toast'),
      other=$('other'), modal=$('modal'), modalCard=$('modalCard'), intro=$('intro'),
      stageEl=$('stage'), tipEl=$('tipbar'), dNameEl=$('dName'), tabsEl=$('tabs');

/* ---------------- 对话框系统：打字机 + 点一下继续 ---------------- */
const DQ=[]; let dCur=null, dFull='', dIdx=0, dTimer=null;

function dRender(){
  if(!dCur){
    sayEl.classList.remove('on','narr');
    stageEl.classList.remove('talking');
    return;
  }
  sayEl.classList.add('on');
  stageEl.classList.add('talking');
  sayEl.classList.toggle('narr', !dCur.who);
  if(dCur.who){
    dNameEl.style.display='';
    dNameEl.innerHTML='【'+dCur.who+'】'+(dCur.feel?('<span class="dfeel">'+dCur.feel+'</span>'):'');
  }else{
    dNameEl.style.display='none';
  }
  dFull=dCur.text||'';
  dIdx=0; sayText.textContent='';
  clearInterval(dTimer);
  dTimer=setInterval(function(){
    dIdx++;
    sayText.textContent=dFull.slice(0,dIdx);
    if(dIdx>=dFull.length) clearInterval(dTimer);
  },42);
}

function dAdvance(){
  if(!dCur) return;
  if(dIdx<dFull.length){
    clearInterval(dTimer); dIdx=dFull.length; sayText.textContent=dFull; return;
  }
  const cb=dCur.cb;
  dCur=DQ.length?DQ.shift():null;
  dRender();
  if(cb) cb();
}

function dPush(who,text,feel,cb){
  DQ.push({who:who,text:text,feel:feel,cb:cb});
  if(!dCur){ dCur=DQ.shift(); dRender(); }
}

function feelOf(){
  if(S.mood<25) return '(｡•́︿•̀｡)';
  if(S.mood<50) return '(・_・)';
  if(S.mood<75) return '(´ｰ｀)';
  return '(๑•̀ㅂ•́)و✧';
}

/* 立绘2的表情：七张都压成 webp 内嵌在这个文件里了，不依赖外面的文件夹 */
const CHAR2_SRC = {
  normal:"img/9987c3e404.webpimg/4c7b047aa8.webp",
  sleepy:"img/7a7b998e0a.webpimg/f2c2d9e5ff.webp",
  angry:"img/70e58de0bc.webpimg/0c0d1c1445.webp",
  bumman:"img/b472b6824a.webpimg/8ee9b6dacc.webp",
  happy:"img/afa3d0092a.webpimg/697fec188b.webp",
  shy:"img/b5b931ad16.webpimg/f9c5ab110e.webp",
  delight:"img/43cf32a7e9.webpimg/fe8941ce89.webp",
};
let char2Kind='';
function setChar2(kind){
  if(!char2) return;
  if(!kind){
    if(char2Kind==='') return;
    char2Kind=''; char2.src=IMG.char; return;
  }
  if(kind===char2Kind) return;
  const p=CHAR2_SRC[kind];
  if(!p) return;
  const im=new Image();
  im.onload=function(){ char2.src=p; char2Kind=kind; };
  im.src=p;
}

/* 他说话时的脸：按心情自动挑，也可以指定 */
const FACE_AUTO={ '(｡•́︿•̀｡)':'bumman', '(・_・)':'normal', '(´ｰ｀)':'normal', '(๑•̀ㅂ•́)و✧':'happy' };
function sayFace(face){
  if(!face) return;
  setChar2(face);
  clearTimeout(sayFace._t);
  sayFace._t=setTimeout(function(){ if(!S.asleep) setChar2(''); },4200);
}
/* 夏萧因说的话（颜文字默认按心情挑，脸也跟着切） */
function say(t,feel,face){
  const f=feel||feelOf();
  dPush('夏萧因',t,f);
  /* 他自己开口，人就该在 */
  try{ if(typeof charEl!=='undefined' && charEl) charEl.classList.remove('hide'); }catch(e){}
  sayFace(face||FACE_AUTO[f]||'normal');
}
/* 旁白 */
function narrate(t){ dPush('',t,null); }
/* 玩家自己在做事/说话：名字栏写「你」 */
function youSay(t){ dPush('你',t,null); }
/* 依依说的话 */
function sayMe(t){ dPush('你',t,null); }

/* 系统提示：顶上的红条，可重复触发；文字里的 { } 会变强调 */
function tip(t,kind){
  if(!tipEl) return;
  tipEl.innerHTML=String(t||'').replace(/\{([^}]+)\}/g,'<b class="hi">$1</b>');
  tipEl.className='on'+(kind?' '+kind:'');
  try{ bad(); }catch(e){}
  clearTimeout(tip._t);
  tip._t=setTimeout(function(){ tipEl.className=''; },5200);
}

/* 点画面推进对话（按钮、数值、弹窗、页签、立绘不参与） */
document.addEventListener('click',function(e){
  if(!dCur) return;
  const t=e.target;
  if(!t||!t.closest) return;
  if(t.closest('button')||t.closest('#hud')||t.closest('#modal')||t.closest('#intro')||
     t.closest('#other')||t.closest('#actions')||t.closest('#tabs')||t.closest('#char')) return;
  dAdvance();
});
function toast(t){
  const d=document.createElement('div');
  d.className='tst'; d.textContent=t;
  toastEl.appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .4s'; d.style.opacity='0';
    setTimeout(()=>d.remove(),420); },2600);
}
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function setBg(src){
  bg.classList.add('fade');
  setTimeout(()=>{ bg.style.backgroundImage = src? 'url("'+src+'")':'none'; bg.classList.remove('fade'); },220);
}
function refresh(){
  $('nMood').textContent   = Math.round(S.mood);
  $('nEnergy').textContent = Math.round(S.energy);
  $('nHealth').textContent = Math.round(S.health);
  $('bMood').style.width   = clamp(S.mood,0,100)+'%';
  $('bEnergy').style.width = clamp(S.energy,0,100)+'%';
  $('bHealth').style.width = clamp(S.health,0,100)+'%';
  $('chip').textContent    = '¥ '+S.money;
  if(typeof bdayRender==='function') bdayRender();
  save();
  /* 立绘2表情：按心情/精力自动挑（缺图自动忽略） */
  if(typeof setChar2==='function'){
    let k='normal';
    if(S.energy<25) k='sleepy';
    else if(S.mood<25) k='angry';
    else if(S.mood<50) k='bumman';
    else if(S.mood>=85) k='delight';
    else if(S.mood>=70) k='happy';
    setChar2(k);
  }
}
function addMood(v){ S.mood=clamp(S.mood+v,0,100); refresh(); }
function addEnergy(v){ S.energy=clamp(S.energy+v,0,100); refresh(); }
function addHealth(v){ S.health=clamp(S.health+v,0,100); refresh(); }

/* ---------------- 弹窗 ---------------- */
function modalOpen(html){
  modalCard.innerHTML=html;
  modal.classList.add('show');
  return modalCard;
}
function modalClose(){ modal.classList.remove('show'); modalCard.innerHTML=''; }
function modalChoose(title,text,options){
  const card=modalOpen('<h3>'+title+'</h3><p class="mtext">'+text+'</p><div class="mrow"></div>');
  const row=card.querySelector('.mrow');
  options.forEach(o=>{
    const b=document.createElement('button');
    b.className='mbtn'+(o.grey?' grey':'');
    b.textContent=o.label;
    b.onclick=()=>{ click(); modalClose(); o.cb&&o.cb(); };
    row.appendChild(b);
  });
}

/* ---------------- 存档导出/导入 ---------------- */
function svExport(){
  click();
  let raw;
  try{ raw = localStorage.getItem(KEY); }catch(e){ raw=null; }
  if(!raw) raw = JSON.stringify(S);
  let code='';
  try{ code = btoa(unescape(encodeURIComponent(raw))); }

var XY_BDAY={ m:9, d:10 };
function bdayLeft(now){
  now = now || new Date();
  const isToday = (now.getMonth()===XY_BDAY.m-1 && now.getDate()===XY_BDAY.d);
  const y0 = now.getFullYear();
  const today = new Date(y0, now.getMonth(), now.getDate());
  let t = new Date(y0, XY_BDAY.m-1, XY_BDAY.d);
  let days = 0;
  if(!isToday){
    if(t < today) t = new Date(y0+1, XY_BDAY.m-1, XY_BDAY.d);
    days = Math.round((t - today) / 86400000);
  }
  return { days:days, isToday:isToday };
}
function bdayRender(){

function gPlay(mixed, as){
  String(mixed||'').split(/<br><br>/).forEach(function(p){
    if(!p) return;
    if(p.charAt(0)==='（'){
      gStoryPush('', p.replace(/^（/,'').replace(/）$/,''));
      return;
    }
    if(p.charAt(0)==='「'){
      splitInlines(p).forEach(function(x){
        gStoryPush(x.t==='nar' ? '' : (as||'夏萧因'), x.v);
      });
      return;
    }
    gStoryPush(as||'夏萧因', p);
  });
}

/* ---------------- 存钱罐（2026-09-25 新增） ----------------
   素罐一只，白瓷，顶上一道口。
   跟娃娃机、钓鱼共用同一套钱（S.money）。存进去只是挪个地方，随时能拿回来。
   他不锁罐子，也不说话。隔几天自己往里塞一点，账上留一行。
------------------------------------------------------------- */
const BANK_GAP = 2*24*60*60*1000;   /* 他大概两天放一次 */
let bankMode = 'in';                /* in=往里放  out=拿回来 */

function ensureBank(){
  if(!S.bank || typeof S.bank!=='object') S.bank={in:0,his:0,log:[],lastHe:0};
  if(typeof S.bank.in!=='number' || !isFinite(S.bank.in)) S.bank.in=0;
  if(typeof S.bank.his!=='number' || !isFinite(S.bank.his)) S.bank.his=0;
  if(!(S.bank.log instanceof Array)) S.bank.log=[];
  if(typeof S.bank.lastHe!=='number') S.bank.lastHe=0;
}
function bankWhen(ts){
  const d=new Date(ts);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '
    +('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function bankAgo(ts){
  const g=Date.now()-ts;
  if(g<3600000) return Math.max(1,Math.round(g/60000))+'分钟';
  if(g<86400000) return Math.round(g/3600000)+'小时';
  return Math.round(g/86400000)+'天';
}
function bankLog(amt,who){
  S.bank.log.unshift({ts:Date.now(), amt:amt, who:who});
  while(S.bank.log.length>24) S.bank.log.pop();
}
/* 他放钱：多久没放补多久，一次 20~60。不吭声，不触发任何话。 */
function bankHisDrop(){
  ensureBank();
  const now=Date.now();
  if(!S.bank.lastHe){ S.bank.lastHe=now; save(); return 0; }
  let n=0, guard=0;
  while(now - S.bank.lastHe >= BANK_GAP && guard<4){
    n += 20 + Math.floor(Math.random()*41);
    S.bank.lastHe += BANK_GAP;
    guard++;
  }
  if(!n) return 0;
  S.bank.his += n; S.bank.in += n;
  bankLog(n,'his');
  save();
  return n;
}
function bankJar(){
  return '<svg viewBox="0 0 120 120" aria-hidden="true">'
   +'<ellipse cx="60" cy="108" rx="33" ry="5.5" fill="rgba(96,86,110,.12)"/>'

   +' C80 101 77 103 73 103 H47 C43 103 40 101 37 97 C28 83 26 62 32 47 Z"'

   +' stroke="#cbc4d0" stroke-width="2.2"/>'

  body.innerHTML=h;

/* v = 金额；-1 表示全放进去 / 全拿回来 */
function bankMove(v){
  ensureBank();
  /* 2026-09-25 FIX：原先「先判 n>0、后夹到上限」，手里是 0 或罐子空的时候
     会先把 n 夹成 0 再入账，于是账本多出一条「+0 / -0」，还响一声铜钱。
     改成先夹紧再判正，没钱就直接拦下，不落账。 */
  const cap = (bankMode==='in' ? S.money : S.bank.in);
  let n = Math.floor(v<0 ? cap : v);
  if(n>cap) n=cap;
  if(!(n>0)){ bad(); toast(bankMode==='in' ? '手里没钱了。' : '罐子是空的。'); return; }

  if(bankMode==='in'){
    S.money -= n; S.bank.in += n;
    bankLog(n,'me');
    coin(); toast('放进去 '+n+'。');
  }else{
    const back = S.bank.in>0 ? n/S.bank.in : 0;
    S.bank.his = Math.max(0, Math.round(S.bank.his*(1-back)));
    S.bank.in -= n; S.money += n;
    bankLog(-n,'me');
    coin(); toast('拿回来 '+n+'。');
  }
  save(); refresh(); bankPaint();
}

  if(qinChain>=5) return '有点意思。接着来。';
  if(qinChain>=3) return '你耳朵还行。';
  if(qinChain>=2) return '记住了。';
  return '嗯。';
}
function qinWrongLine(){
  const a=['这根不是。','手别乱。','重来。','错了。'];
  return a[Math.floor(Math.random()*a.length)];
}
function qinScoreHTML(show){
  const nums=qinCur.f.map(function(i){ return QIN_N[i]; });
  const on = (show===undefined) ? (qinScoreOn && qinArea==='study') : !!show;
  return '<div id="qinScore" class="qscore'+(on?'':' hide')+'">'
    +'<i>谱</i>'
    +nums.map(function(t,i){ return '<b class="qsn" data-i="'+i+'">'+t+'</b>'; }).join('')
    +'</div>';
}
function qinScoreAt(i){
  const box=$('qinScore'); if(!box) return;
  [].forEach.call(box.querySelectorAll('.qsn'),function(b,j){
    b.classList.toggle('now', j===i);
    b.classList.toggle('done', j<i);
  });
}
function qinScoreToggle(){
  qinScoreOn=!qinScoreOn;
  const box=$('qinScore'); if(box) box.classList.toggle('hide',!qinScoreOn);
  const btn=$('qinScoreBtn'); if(btn) btn.textContent=qinScoreOn?'收起简谱':'简谱';
  qinInfo(qinScoreOn?'谱子开着，跟着弹。':'谱子收起来了，靠耳朵。');
}
function qinAsk(list){
  const el=$('qinInfo'); if(!el) return;
  el.innerHTML=list.map(function(p){
    return '<button class="qbtn" data-a="'+p[0]+'">'+p[1]+'</button>';
  }).join('');
  [].forEach.call(el.querySelectorAll('.qbtn'),function(b){
    b.onclick=function(){
      click();
      const a=b.getAttribute('data-a');
      el.innerHTML='';
      if(a==='notyet') qinNotYet();
      else if(a==='again') qinTeachAgain();
      else if(a==='practice') qinPractice();
      else qinGotIt();
    };
  });
}
function qinNotYet(){
  const el=$('qinInfo'); if(!el) return;
  qinSay('那再来一遍。','他','normal');
  el.innerHTML='<button class="qbtn" data-a="again">再弹一遍</button>'
              +'<button class="qbtn" data-a="practice">自己练</button>';
  [].forEach.call(el.querySelectorAll('.qbtn'),function(b){
    b.onclick=function(){
      click();
      const a=b.getAttribute('data-a');
      el.innerHTML='';
      if(a==='again') qinTeachAgain();
      else qinPractice();
    };
  });
}
function qinTeachAgain(){
  qinSay('坐好，我再弹一遍。','他','normal');
  qinTeach();
}
function qinPractice(){
  qinSeq++;
  qinMode='free'; qinSyncTab();
  qinLock=false; qinChain=0; qinCount=0; qinLast=null; qinRep=0;
  qinSay('自己练。我听着。','他','normal');
  qinInfo('哪里卡就往哪根弦上拨。想再听他说一遍，点「学曲」。');
}
function qinGotIt(){
  const my=++qinSeq;
  qinExam=true;
  if(qinArea!=='study'){ qinArea='study'; }
  qinMode='follow'; qinSyncTab();
  if(!$('qinSongBtn')) qinPaint();
  qinLock=true; qinStep=0; qinChain=0;
  qinDemo=qinCur.f.slice();
  qinSay('嗯，那你弹。','他','normal');
  qinInfo('照着谱子，一个一个来。');
  setTimeout(function(){ if(my===qinSeq){ qinLock=false; qinSay('开始。','他','normal'); } },700);
}
function qinTeach(){
  const my=++qinSeq;
  qinLock=true; qinChain=0;
  qinSay('坐好。这首我教你。','他','normal');
  qinInfo('先听我整首弹一遍。');
  const f=qinCur.f;
  /* 整首连着弹：按音数压间隔，总长控制在 3.5~5.5 秒 */
  let step=820;
  if(f.length>0) step=Math.round(Math.min(560, Math.max(260, 4600/f.length)));
  let k=0;
  const run=function(){
    if(my!==qinSeq) return;
    if(k>=f.length){
      ensureQin();
      qinScoreAt(-1);
      qinSay('记住了没？','他','normal');
      qinInfo('');
      qinAsk([['notyet','还没'],['gotit','学会了']]);
      return;
    }
    qinStrike(f[k]); qinScoreAt(k); k++;
    setTimeout(run,step);
  };
  setTimeout(run,420);
}
function qinNewRound(){
  const my=qinSeq;
  qinLock=true; qinStep=0;
  const n=2+Math.min(3,Math.floor(qinChain/2));
  const pool=qinKeys();
  qinDemo=[];
  for(let i=0;i<n;i++) qinDemo.push(pool[Math.floor(Math.random()*pool.length)]);
  qinSay(qinOpenLine(),'他','normal');
  qinInfo('他拨一句，你回一句。');
  let k=0;
  const run=function(){
    if(my!==qinSeq) return;
    if(k>=qinDemo.length){
      qinLock=false;
      qinSay('该你了。','他','normal');
      qinInfo('按顺序拨回去。');
      return;
    }
    qinStrike(qinDemo[k]); k++;
    const gap=Math.max(430, 840-qinChain*45);
    setTimeout(run,gap);
  };
  setTimeout(run,560);
}
function qinTap(i){
  if(qinMode==='free'){ qinFreeTap(i); return; }
  if(qinMode==='teach'){ qinStrike(i); return; }
  if(qinLock) return;
  qinStrike(i);
  if(i===qinDemo[qinStep]){
    qinStep++; qinScoreAt(qinStep-1);
    if(qinStep>=qinDemo.length){
      const my=qinSeq;
      if(qinExam){
        qinExam=false;
        qinLock=true; qinChain=0;
        ensureQin(); S.qin.done++; S.money+=5; save(); refresh();
        qinSay('过了。没白教。','他','happy');
        qinInfo('+5 币 · 想再学一首，点「学曲」');
        return;
      }
      qinLock=true; qinChain++;
      ensureQin();
      S.qin.done++;
      if(qinChain>S.qin.best) S.qin.best=qinChain;
      S.money+=2; save(); refresh();
      qinSay(qinRightLine(),'他','happy');
      qinInfo('连着 '+qinChain+' 句 · +2 币');
      setTimeout(function(){ if(my===qinSeq) qinNewRound(); },1250);
    }
  } else {
    const my=qinSeq;
    if(qinExam){
      qinExam=false;
      qinLock=true; qinChain=0; bad();
      qinSay('错了。我再来一遍，跟着记。','他','bumman');
      setTimeout(function(){ if(my===qinSeq) qinTeach(); },1500);
      return;
    }
    qinLock=true; qinChain=0; bad();
    qinSay(qinWrongLine(),'他','bumman');
    qinInfo('断了，重来。');
    setTimeout(function(){ if(my===qinSeq) qinNewRound(); },1500);
  }
}
function qinFreeTap(i){
  qinStrike(i);
  ensureQin();
  qinCount++; S.qin.tuned++;
  if(i===qinLast) qinRep++; else { qinRep=1; qinLast=i; }
  if(!S.asleep){
    if(qinCount===1) qinSay('……','他','normal');
    else if(qinRep===3) qinSay('就这一根？','他','bumman');
    else if(qinCount===12) qinSay('手别停。','他','normal');
    else if(qinCount===26) qinSay('你今晚话挺多。','他','shy');
    else if(qinCount>0 && qinCount%40===0) qinSay('……','他','normal');
  }
  if(qinCount%5===0) save();
  qinInfo('今晚拨了 '+qinCount+' 下。');
}
function openQin(){
  setTimeout(function(){ pstkPaint('qin'); },0);
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="gBack">退出</button>'
    +'<h2>弦音有寄</h2></div><div id="gBody"></div>';
  other.querySelector('#gBack').onclick=function(){ click(); openOther(); };
  ensureQin();
  qinMode=S.asleep?'free':'follow';
  qinChain=0; qinLast=-1; qinRep=0; qinCount=0;
  qinSeq++; qinLock=true;
  qinPaint();
  if(S.asleep){ qinLock=false; qinSay('他在睡。你自己拨会儿。'); }
  else { qinNewRound(); }
}
/* ---------------- 钓鱼（2026-09-25 新增）
   竿放下去，等。看运气。
   鱼表用 FISHES，p 当卖价；上钩概率另算，贵的难上。
   钓到的先入篓，攒一把再卖。
------------------------------------------------------------- */
const FISH_W=[26,22,18,12,7,1,2,8,20,7,14,9,6,5];
let fishState='idle', fishTimer=null, fishSeq=0;
let fishTick=null, fishPending=null, fishNeed=4, fishPullN=0, fishBiteEnd=0;
function ensureFish(){
  if(!(S.fish instanceof Array)) S.fish=[];
  if(!S.fishdex || typeof S.fishdex!=='object' || (S.fishdex instanceof Array)) S.fishdex={};
}
function fishSay(t){ const el=$('fishSay'); if(el) el.textContent=t; }
function fishBaitPaint(){
  const el=$('fBaitN'); if(el) el.textContent=baitN();
}
function fishSetBtn(t){ const b=$('fBtn'); if(b) b.textContent=t; }
function fishBob(on){
  const el=$('fBob'); if(!el) return;
  if(on) el.classList.add('on'); else el.classList.remove('on');
}
function fishPick(){
  let tot=0,i;
  for(i=0;i<FISH_W.length;i++) tot+=FISH_W[i];
  let r=Math.random()*tot;
  for(i=0;i<FISH_W.length;i++){ r-=FISH_W[i]; if(r<=0) return FISHES[i]; }
  return FISHES[0];
}
function fishPrice(n){
  const it=FISHES.filter(function(x){ return x.n===n; })[0];
  return it?it.p:1;
}
function fishBagPaint(){
  ensureFish();
  const el=$('fBag'); if(!el) return;
  if(!S.fish.length){
    el.innerHTML='<div class="fbagnone">篓还是空的。</div>';
    return;
  }
  const cnt={};
  S.fish.forEach(function(n){ cnt[n]=(cnt[n]||0)+1; });
  let h='<div class="fbaglist">', tot=0;
  Object.keys(cnt).forEach(function(n){
    tot+=fishPrice(n)*cnt[n];
    h+='<span class="fchip">'+n+' ×'+cnt[n]+'</span>';
  });
  h+='</div><button class="mini grey wide" id="fSell">全卖了 · +'+tot+' 币</button>';
  el.innerHTML=h;
  const s=el.querySelector('#fSell');
  if(s) s.onclick=function(){ fishSellAll(); };
}
function fishSellAll(){
  ensureFish();
  if(!S.fish.length) return;
  let tot=0;
  S.fish.forEach(function(n){ tot+=fishPrice(n); });
  S.fish=[]; S.money+=tot;
  save(); refresh(); coin();
  fishSay('都卖了，'+tot+' 币。');
  fishBagPaint();
}
function fishMiss(msg){
  fishSeq++;
  if(fishTimer){ clearTimeout(fishTimer); fishTimer=null; }
  if(fishTick){ clearInterval(fishTick); fishTick=null; }
  fishState='idle'; fishBob(false); bad();
  fishGaugeReset();
  fishSay(msg); fishSetBtn('下竿');
}
function fishCatch(){
  fishSeq++;
  if(fishTimer){ clearTimeout(fishTimer); fishTimer=null; }
  if(fishTick){ clearInterval(fishTick); fishTick=null; }
  fishState='idle'; fishBob(false);
  const f=fishPending||fishPick();
  fishPending=null;
  ensureFish();
  S.fish.push(f.n);
  S.fishdex[f.n]=(S.fishdex[f.n]||0)+1;
  save(); coin();
  fishGaugeReset();
  fishSay('钓上来了——'+f.n+'。');
  fishSetBtn('下竿');
  fishBagPaint();
  fishDexBar();
}
function fishGaugeReset(){
  const t=$('fTime'), p=$('fPull');
  if(t) t.style.width='100%';
  if(p) p.style.width='0%';
}
function fishDexCount(){
  ensureFish();
  let got=0;
  FISHES.forEach(function(f){ if((S.fishdex[f.n]||0)>0) got++; });
  return got;
}
function fishDexBar(){
  const el=$('fDexBtn'); if(!el) return;
  el.textContent='图鉴 '+fishDexCount()+'/'+FISHES.length;
}
function fishDexOpen(){
  if(fishState!=='idle'){ bad(); fishSay('先把这竿收完。'); return; }
  click();
  fishDexView();
}
function fishDexView(){
  const b=$('gBody'); if(!b) return;
  ensureFish();
  let h='<div class="dxgrid">';
  FISHES.forEach(function(f){
    const n=S.fishdex[f.n]||0, on=n>0;
    h+='<div class="dxcard'+(on?'':' off')+'">'
      +'<span class="dxic">'+(on?(FISH_IC[f.n]||f.n.charAt(0)):'？')+'</span>'
      +'<div class="dxtxt"><span class="dxn">'+(on?f.n:'？？？')+'</span>'
      +'<span class="dxs">'+(on?('钓到 '+n+' 次 · 卖 '+f.p):'还没见过')+'</span></div>'
      +'</div>';
  });
  h+='</div>';
  b.innerHTML='<div class="dxhead"><button class="mini grey" id="dxBack">返回</button>'
    +'<h2>图鉴</h2><span class="dxcount">'
    +fishDexCount()+'/'+FISHES.length+'</span></div>'+h;
  const bk=b.querySelector('#dxBack');
  if(bk) bk.onclick=function(){ click(); fishPaint(); };
}
function fishBiteStart(f){
  fishPending=f||fishPick();
  const lv=(fishPending.p>=30?3:(fishPending.p>=20?2:1));
  fishNeed=(lv===3?7:(lv===2?5:4));
  const win=(lv===3?1180:(lv===2?1380:1580));
  fishPullN=0;
  fishBiteEnd=Date.now()+win;
  fishSetBtn('快提！');
  fishSay('动了！连点提竿——');
  const my=fishSeq;
  fishTick=setInterval(function(){
    if(my!==fishSeq){ clearInterval(fishTick); fishTick=null; return; }
    const left=fishBiteEnd-Date.now();
    const t=$('fTime');
    if(t) t.style.width=Math.max(0,Math.round(left/win*100))+'%';
    if(left<=0) fishMiss('慢了，鱼跑了。');
  },60);
}
function fishPullHit(){
  if(fishState!=='bite') return;
  click();
  fishPullN++;
  const p=$('fPull');
  if(p) p.style.width=Math.min(100,Math.round(fishPullN/fishNeed*100))+'%';
  if(fishPullN>=fishNeed) fishCatch();
}
function fishCast(){
  if(fishState!=='idle') return;
  if(!hasBait()){ bad(); fishSay('没有鱼饵了。去商店买。'); return; }
  useBait();
  fishBaitPaint();
  click();
  fishState='waiting';
  fishBob(true);
  fishSetBtn('提竿');
  fishSay('竿放下去，看运气。');
  const my=++fishSeq;
  const wait=1100+Math.random()*2500;
  fishTimer=setTimeout(function(){
    if(my!==fishSeq) return;
    fishState='bite';
    ping();
    fishBiteStart();
  },wait);
}
function fishPull(){
  if(fishState==='idle'){ fishCast(); return; }
  if(fishState==='waiting'){ fishMiss('早了，鱼惊了。'); return; }
  if(fishState==='bite'){ fishPullHit(); return; }
}
function fishPaint(){
  const b=$('gBody'); if(!b) return;
  b.innerHTML='<div class="fishpond"><span class="fbob" id="fBob"></span></div>'
    +'<div class="fgauge"><span class="ft" id="fTime"></span>'
    +'<span class="fp" id="fPull"></span></div>'
    +'<div class="fishsay" id="fishSay">竿放下去，看运气。</div>'
    +'<button class="mini wide" id="fBtn">下竿</button>'
    +'<div class="fbaits">鱼饵 <b id="fBaitN">'+baitN()+'</b> 个</div>'
    +'<div class="fbag" id="fBag"></div>'
    +'<button class="mini wide dxbtn" id="fDexBtn">图鉴</button>';
  const btn=$('fBtn');
  if(btn) btn.onclick=function(){ fishPull(); };
  const db=$('fDexBtn');
  if(db) db.onclick=function(){ fishDexOpen(); };
  fishBagPaint();
  fishDexBar();
}
function openFish(){
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="gBack">退出</button>'
    +'<h2>钓鱼</h2></div><div id="gBody"></div>';
  other.querySelector('#gBack').onclick=function(){ click(); openOther(); };
  fishSeq++;
  if(fishTimer){ clearTimeout(fishTimer); fishTimer=null; }
  if(fishTick){ clearInterval(fishTick); fishTick=null; }
  fishPending=null;
  fishState='idle';
  ensureFish();
  fishPaint();
}
/* ---------------- 娃娃机（2026-09-25 新增）
   爪子横着扫，对准了再按。5 币一次，抓到的进收藏。
   机身浅色，娃娃是圆牌，出口在左下。全合成，不吃素材。
------------------------------------------------------------- */
const CLAW_COST=5;
const CLAW_SLOT=[0.20,0.50,0.80];
const DOLL_IC={'一只紫色小猫布偶':'猫','一只白兔布偶':'兔','一个小熊钥匙扣':'熊',
  '一只绒球':'球','一个抱着月亮的娃娃':'月','一只耳朵歪掉的布狐狸':'狐'};
let clawPos=0.5, clawDir=1, clawMove=null, clawBusy=false, clawSeq=0;
let clawBox=[null,null,null];

function ensureClaw(){
  if(!(S.dolls instanceof Array)) S.dolls=[];
  if(!S.dollsGiven || typeof S.dollsGiven!=='object' || (S.dollsGiven instanceof Array)){
    S.dollsGiven={};
  }
  if(!S.dollsEver || typeof S.dollsEver!=='object' || (S.dollsEver instanceof Array)){
    S.dollsEver={};
  }
  if(typeof S.gaveWang!=='number' || !isFinite(S.gaveWang)) S.gaveWang=0;
  if(typeof S.gaveLi!=='number' || !isFinite(S.gaveLi)) S.gaveLi=0;
  if(typeof S.gaveShen!=='number' || !isFinite(S.gaveShen)) S.gaveShen=0;
  if(typeof S.donated!=='number' || !isFinite(S.donated)) S.donated=0;
}
function clawSay(t){ const el=$('clawSay'); if(el) el.textContent=t; }
function clawPaintPos(){
  const h=$('clawHand'); if(h) h.style.left=Math.round(clawPos*100)+'%';
}
function clawBar(){
  ensureClaw();
  const kinds=DOLLS.filter(function(n){ return S.dolls.indexOf(n)>=0; }).length;
  const el=$('clawInfo'); if(!el) return;
  el.textContent='手里 '+S.dolls.length+' 只 · 集齐 '+kinds+'/'+DOLLS.length+' 种';
}
function clawStopMove(){ if(clawMove){ clearInterval(clawMove); clawMove=null; } }
function clawStartMove(){
  if(clawMove) return;
  clawMove=setInterval(function(){
    if(clawBusy) return;
    clawPos+=clawDir*0.012;
    if(clawPos>0.92){ clawPos=0.92; clawDir=-1; }
    if(clawPos<0.08){ clawPos=0.08; clawDir=1; }
    clawPaintPos();
  },40);
}
function clawFill(){
  for(let i=0;i<3;i++){
    if(!clawBox[i]) clawBox[i]=DOLLS[Math.floor(Math.random()*DOLLS.length)];
  }
}
function clawTry(){
  let best=null, bd=9;
  for(let i=0;i<3;i++){
    if(!clawBox[i]) continue;
    const d=Math.abs(CLAW_SLOT[i]-clawPos);
    if(d<bd){ bd=d; best=i; }
  }
  if(best===null || bd>0.11) return {r:'miss'};
  if(Math.random()<0.18) return {r:'slip'};
  return {r:'ok', slot:best};
}
function clawTake(res, my){
  const slot=res.slot, name=clawBox[slot];
  const el=$('cd'+slot);
  if(el) el.classList.add('taken');
  clawSay('抓到了——'+name+'。');
  coin();
  ensureClaw();
  S.dolls.push(name);
  S.dollsEver[name]=1;
  save();
  setTimeout(function(){
    if(my!==clawSeq) return;
    clawBox[slot]=null;
    clawFill();
    clawBusy=false;
    clawPaint();
  },720);
}
function clawGo(){
  if(clawBusy) return;
  if(S.money<CLAW_COST){ bad(); clawSay('钱不够了，去钓两竿。'); return; }
  S.money-=CLAW_COST; save(); refresh();
  clawBusy=true;
  click();
  const my=++clawSeq;
  const h=$('clawHand');
  clawSay('爪子下去了……');
  if(h) h.classList.add('low');
  setTimeout(function(){
    if(my!==clawSeq) return;
    const res=clawTry();
    if(res.r==='ok' && h) h.classList.add('grab');
    setTimeout(function(){
      if(my!==clawSeq) return;
      if(h){ h.classList.remove('low'); h.classList.remove('grab'); }
      if(res.r==='ok'){ clawTake(res, my); }
      else{
        clawSay(res.r==='slip' ? '滑了……差一点。' : '爪子空了。');
        clawBusy=false;
      }
    },430);
  },430);
}
function clawPaint(){
  const b=$('gBody'); if(!b) return;
  let dh='';
  for(let i=0;i<3;i++){
    const n=clawBox[i];
    dh+='<div class="cdoll'+(n?'':' gone')+'" id="cd'+i+'"'
      +' style="left:'+Math.round(CLAW_SLOT[i]*100)+'%">'
      +(n?(DOLL_IC[n]||n.charAt(0)):'')+'</div>';
  }
  b.innerHTML='<div class="clawbox">'+dh
    +'<div class="clawhand" id="clawHand" style="left:'+Math.round(clawPos*100)+'%">'
    +'<svg viewBox="0 0 34 34"><path d="M17 3 V17 M17 17 L8 30 M17 17 L26 30"'
    +' stroke="#8b8492" stroke-width="3" stroke-linecap="round" fill="none"/></svg>'
    +'</div><div class="clawhole"></div></div>'
    +'<div class="clawsay" id="clawSay">对准了再按。一次 '+CLAW_COST+' 币。</div>'
    +'<button class="mini wide" id="clawBtn">抓</button>'
    +'<div class="clawinfo" id="clawInfo"></div>';
  const btn=$('clawBtn');
  if(btn) btn.onclick=function(){ clawGo(); };
  clawPaintPos();
  clawBar();
}
function openClaw(){
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="gBack">退出</button>'
    +'<h2>娃娃机</h2></div><div id="gBody"></div>';
  other.querySelector('#gBack').onclick=function(){
    click(); clawSeq++; clawStopMove(); openOther();
  };
  ensureClaw();
  clawSeq++; clawStopMove();
  clawBusy=false; clawPos=0.5; clawDir=1; clawBox=[null,null,null];
  clawFill();
  clawPaint();
  clawStartMove();
}
/* ---------------- 背包（2026-09-25 新增）
   手里有什么：鱼（能卖）、娃娃（收藏）、吃的。
   钱走同一套，卖鱼跟钓鱼页一个价。
------------------------------------------------------------- */
const DOLL_SELL=4;
const DOLL_LINE={'一只紫色小猫布偶':'……放我案头吧。',
  '一只白兔布偶':'耳朵挺直，比你规矩。',
  '一个小熊钥匙扣':'丑。……但收下了。',
  '一只绒球':'滚到脚边来了。',
  '一个抱着月亮的娃娃':'抱着月亮，不嫌沉。',
  '一只耳朵歪掉的布狐狸':'耳朵歪的。跟你一样。'};
const DON_POST=6;
const DOLL_SAY={
  wang:'王大爷捧在手里看了好一会儿，说这娃娃做得真像。',
  li:'李阿姨接过去就笑，说回头给你留点自家腌的菜。',
  shen:'他接过去就抱住了，说要摆在他那摞书上面。',
  don:'纸箱封好，寄走了。邮费 '+DON_POST+' 币，地址是他替你写的。'
};
function bagGivenCount(){
  ensureClaw();
  let c=0;
  Object.keys(S.dollsGiven).forEach(function(k){ c+=(S.dollsGiven[k]||0); });
  return c;
}
function bagDollCount(n){
  ensureClaw();
  let c=0;
  S.dolls.forEach(function(x){ if(x===n) c++; });
  return c;
}
function bagSay(t){ const el=$('bagSay'); if(el) el.textContent=t; }
function bagOpClear(){ const el=$('bagOp'); if(el) el.innerHTML=''; }
function bagPick(n){
  const c=bagDollCount(n);
  if(!c) return;
  const el=$('bagOp'); if(!el) return;
  click();
  const gv=(S.dollsGiven[n]||0);
  let h='<div class="bagopline">'+n+' · 手里 '+c+'</div><div class="bagopbtns">'
    +'<button id="boGive">'+(gv?'再送他一只':'送给他')+'</button>'
    +'<button id="boWang">送王大爷</button>'
    +'<button id="boLi">送李阿姨</button>'
    +'<button id="boShen">送神童</button>'
    +'<button id="boDon">捐山区 · 邮费 '+DON_POST+'</button>';
  if(c>1) h+='<button id="boSell">卖一只 · +'+DOLL_SELL+'</button>';
  h+='<button id="boCancel">算了</button></div>';
  el.innerHTML=h;
  const g=$('boGive'); if(g) g.onclick=function(){ bagGiveDoll(n); };
  const w=$('boWang'); if(w) w.onclick=function(){ bagGiveWang(n); };
  const l=$('boLi'); if(l) l.onclick=function(){ bagGiveLi(n); };
  const s2=$('boShen'); if(s2) s2.onclick=function(){ bagGiveShen(n); };
  const d=$('boDon'); if(d) d.onclick=function(){ bagDonate(n); };
  const s=$('boSell'); if(s) s.onclick=function(){ bagSellDoll(n); };
  const c2=$('boCancel'); if(c2) c2.onclick=function(){ click(); bagOpClear(); };
}
function bagGiveDoll(n){
  ensureClaw();
  const i=S.dolls.indexOf(n);
  if(i<0) return;
  S.dolls.splice(i,1);
  const first=!(S.dollsGiven[n]);
  S.dollsGiven[n]=(S.dollsGiven[n]||0)+1;
  addMood(3);
  save(); refresh(); coin();
  bagPaint(first?(DOLL_LINE[n]||'……收下了。'):'一只就够了。');
}
function bagSellDoll(n){
  ensureClaw();
  const i=S.dolls.indexOf(n);
  if(i<0) return;
  S.dolls.splice(i,1);
  S.money+=DOLL_SELL;
  save(); refresh(); coin();
  bagPaint('卖了一只，'+DOLL_SELL+' 币。');
}
function bagGiveWang(n){
  ensureClaw();
  const i=S.dolls.indexOf(n);
  if(i<0) return;
  S.dolls.splice(i,1);
  S.gaveWang++;
  addMood(1);
  save(); refresh(); coin();
  bagPaint(DOLL_SAY.wang);
}
function bagGiveLi(n){
  ensureClaw();
  const i=S.dolls.indexOf(n);
  if(i<0) return;
  S.dolls.splice(i,1);
  S.gaveLi++;
  addMood(1);
  save(); refresh(); coin();
  bagPaint(DOLL_SAY.li);
}
function bagGiveShen(n){
  ensureClaw();
  const i=S.dolls.indexOf(n);
  if(i<0) return;
  S.dolls.splice(i,1);
  S.gaveShen++;
  addMood(1);
  save(); refresh(); coin();
  bagPaint(DOLL_SAY.shen);
}
function bagDonate(n){
  ensureClaw();
  const i=S.dolls.indexOf(n);
  if(i<0) return;
  if(S.money<DON_POST){ bad(); bagSay('邮费要 '+DON_POST+' 币，不够。'); return; }
  S.money-=DON_POST;
  S.dolls.splice(i,1);
  S.donated++;
  save(); refresh(); coin();
  bagPaint(DOLL_SAY.don);
}
function bagFishTotal(){
  ensureFish();
  let tot=0;
  S.fish.forEach(function(n){ tot+=fishPrice(n); });
  return tot;
}
function bagSellFish(){
  ensureFish();
  if(!S.fish.length) return;
  const tot=bagFishTotal();
  S.fish=[]; S.money+=tot;
  save(); refresh(); coin();
  bagPaint();
}

function itemSellPrice(k){
  const it=SHOP_USE.filter(function(x){ return x.k===k; })[0];
  if(!it) return 0;
  return Math.max(1, Math.floor(it.p*0.4));
}
function itemSell(k){
  ensureItems();
  if((S.items[k]||0)<1){ toast('这件没有了。'); return; }
  const sp=itemSellPrice(k);
  if(sp<=0){ toast('这件卖不了。'); return; }
  S.items[k]--; if(S.items[k]<=0) delete S.items[k];
  S.money+=sp;
  save(); refresh(); coin();
  toast('卖了 '+k+'，+'+sp+' 币。');
  bagPaint();
}
function itemUse(k){
  ensureItems();
  if(k==='五子棋手绘图谱'){
    modalChoose('五子棋手绘图谱',
      '<img class="qipuimg" src="img/a12b4da90c.webpimg/7034a5230f.webp alt="棋谱">'
      +'王大爷送你的那张手绘棋谱。纸边卷了，棋盘画在正中。<br><br>'
      +'他说：「棋谱要多摆多练，才有用。」',
      [ { label:'收好', cb:function(){} } ]);
    return;
  }
  if(k==='纪念五子棋子'){
    modalChoose('纪念五子棋子',
      '（一枚打磨光滑的黑色五子棋，侧面刻着小小的编号。边角被反复摩挲，带着一点温度。）<br><br>'
      +'少年参加正式比赛时的备用棋子。',
      [ { label:'看看棋子', cb:function(){
            modalChoose('纪念五子棋子',
              '这是少年第一次打进市级比赛的配套棋子。'
              +'他一直随身带着，见证过很多场激烈的对局。<br><br>'
              +'<i class="ynar">带着它再跟他下，他开局不会一上来就猛攻。</i>',
              [ { label:'收好', cb:function(){} } ]);
          } },
        { label:'收好', cb:function(){} } ]);
    return;
  }
  if(k==='阿姨手作织物'){
    modalChoose('阿姨手作织物',
      '（一小片圆的，针脚很密，边上收得不太齐。）<br><br>'
      +'李阿姨织的。她说：「不值什么钱，一点心意。」',
      [ { label:'好好收着', cb:function(){} } ]);
    return;
  }
  const u=ITEM_USE[k];
  const sp=itemSellPrice(k);
  const own=(S.items[k]||0);
  const opts=[];
  if(u && own>0){
    const give=u.how==='use' ? '给他用' : (u.how==='wear' ? '让他给你戴上' : '送给他');
    opts.push({ label:give, cb:function(){ itemGive(k,false); } });
    if((S.items['礼物盒']||0)>0)
      opts.push({ label:'包成礼物（花一个盒子）', cb:function(){ itemGive(k,true); } });
  }else if(own<1){
    toast('这件没有了。'); return;
  }
  if(sp>0) opts.push({ label:'卖一个 · +'+sp+' 币', cb:function(){ itemSell(k); } });
  if(!opts.length){ toast('这件用不上。'); return; }
  opts.push({ label:'算了', cb:function(){} });
  modalChoose(k, u?'挑个用法。':'这件只能在「玩耍」里用，或者卖掉。', opts);
}

function itemGive(k,boxed){
  ensureItems();
  const u=ITEM_USE[k];
  if(!u || (S.items[k]||0)<1){ toast('这件没有了。'); return; }
  if(u.story==='yz'){ yzGive(); return; }
  if(boxed && (S.items['礼物盒']||0)<1){ toast('没有盒子了。'); return; }
  if(!S.give || typeof S.give!=='object') S.give={};
  S.items[k]--; if(S.items[k]<=0) delete S.items[k];
  if(boxed){ S.items['礼物盒']--; if(S.items['礼物盒']<=0) delete S.items['礼物盒']; }
  if(boxed) narrate('你把'+k+'包进盒子里，丝带打了个结，递过去。');
  else if(u.nar) narrate(u.nar);
  if(u.how==='use') addHealth(u.health||0);
  const times=(S.give[k]||0);
  S.give[k]=times+1;
  if(times>=1) say('又买？', null, 'normal');
  else say(u.say||'……', null, u.face);
  addMood((u.mood||3)+(boxed?4:0));
  save(); refresh();
  bagPaint();
}
function bagPaint(sayT){
  const b=$('gBody'); if(!b) return;
  ensureFish(); ensureClaw();
  const foods=S.foods||{};
  const foodKeys=Object.keys(foods).filter(function(k){ return (foods[k]||0)>0; });
  let h='';

  h+='<div class="bagsec"><div class="baghead">鱼 <em>'+S.fish.length+'</em>'
    +(S.fish.length?('<button class="minigrey" id="bagSell">全卖了 · +'
      +bagFishTotal()+'</button>'):'')+'</div>';
  if(!S.fish.length){
    h+='<div class="bagnone">篓是空的。去钓两竿。</div>';
  }else{
    const cnt={};
    S.fish.forEach(function(n){ cnt[n]=(cnt[n]||0)+1; });
    h+='<div class="bagchips">';
    Object.keys(cnt).forEach(function(n){
      h+='<span class="bagchip">'+n+' ×'+cnt[n]+'</span>';
    });
    h+='</div>';
  }
  h+='</div>';

  const given=bagGivenCount();
  h+='<div class="bagsec"><div class="baghead">娃娃 <em>手里 '+S.dolls.length+'</em></div>';
  if(!Object.keys(S.dollsEver).length){
    h+='<div class="bagnone">一只都没有。去抓。</div>';
  }else{
    const kc={};
    S.dolls.forEach(function(n){ kc[n]=(kc[n]||0)+1; });
    h+='<div class="bagdolls">';
    DOLLS.forEach(function(n,i){
      const c=kc[n]||0, gv=(S.dollsGiven[n]||0);
      h+='<span class="bagdoll'+(c?'':' off')+((!c&&gv)?' given':'')+'" id="bd'+i+'"><i>'
        +(c?(DOLL_IC[n]||n.charAt(0)):(gv?'·':'？'))+'</i>'
        +(c?('<b>×'+c+'</b>'):'')+'</span>';
    });
    h+='</div><div class="bagsub">集齐 '
      +DOLLS.filter(function(n){ return S.dollsEver[n]; }).length
      +'/'+DOLLS.length+' 种 · 送他 '+given+' · 王大爷 '+S.gaveWang
      +' · 李阿姨 '+S.gaveLi+' · 神童 '+S.gaveShen+' · 捐出 '+S.donated+'</div>';
    h+='<div class="bagop" id="bagOp"></div>';
    h+='<div class="bagsay" id="bagSay">'
      +(sayT||'点一下圆牌：送人、捐出去，或者把多出来的卖掉。')+'</div>';
  }
  h+='</div>';

  h+='<div class="bagsec"><div class="baghead">吃的 <em>'+foodKeys.length+'</em></div>';
  if(!foodKeys.length){
    h+='<div class="bagnone">还没有吃的。</div>';
  }else{
    h+='<div class="bagchips">';
    foodKeys.forEach(function(k){
      h+='<span class="bagchip">'+k+' ×'+foods[k]+'</span>';
    });
    h+='</div>';
  }
  h+='</div>';

  ensureItems();
  const itemKeys=Object.keys(S.items).filter(function(k){ return (S.items[k]||0)>0; });
  h+='<div class="bagsec"><div class="baghead">物件 <em>'+itemKeys.length+'</em></div>';
  if(!itemKeys.length){
    h+='<div class="bagnone">柜子空着。去商店看看。</div>';
  }else{
    h+='<div class="bagchips">';
    itemKeys.forEach(function(k){
      if(ITEM_USE[k] || itemSellPrice(k)>0 || ITEM_LOOK.indexOf(k)>=0) h+='<button class="bagchip on" data-k="'+k+'">'+k+' ×'+S.items[k]+'</button>';
      else h+='<span class="bagchip">'+k+' ×'+S.items[k]+'</span>';
    });
    h+='</div>';
    h+='<div class="bagtip">点一件，看能怎么用。</div>';
  }
  h+='</div>';

  h+='<div class="bagmoney">手里 ¥ '+S.money+'</div>';
  b.innerHTML=h;
  const s=$('bagSell');
  if(s) s.onclick=function(){ bagSellFish(); };
  DOLLS.forEach(function(n,i){
    const el=$('bd'+i);
    if(el) el.onclick=function(){ bagPick(n); };
  });
  Array.prototype.forEach.call(b.querySelectorAll('.bagchip.on'),function(el){
    el.onclick=function(){ itemUse(el.getAttribute('data-k')); };
  });
}
function openBag(){
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="gBack">退出</button>'
    +'<h2>背包</h2></div><div id="gBody"></div>';
  other.querySelector('#gBack').onclick=function(){ click(); openOther(); };
  bagPaint();
}

/* 活动室里挂着的就这三位：王大爷、陈大爷、老周。家里那几位不来。 */
const OUT_ROOM_KEYS=['wang','chen','zhou'];
const G_KEYS=['xia','li','shen','wang'];
const G_YOU=1, G_AI=2;
const G_DIR=[[1,0],[0,1],[1,1],[1,-1]];
let gLevel=null, gBoard=[], gTurn=G_YOU, gOver=false, gSeq=0, gBusy=false, gLast=null;
let gWater=0; /* 0正常 1他让着 2他真下(被放狠话) */

function gIn(x,y){ return x>=0 && x<G_N && y>=0 && y<G_N; }
function gInit(){
  gBoard=[];
  for(let y=0;y<G_N;y++){
    const row=[];
    for(let x=0;x<G_N;x++) row.push(0);
    gBoard.push(row);
  }
  gTurn=G_YOU; gOver=false; gBusy=false; gLast=null;
}
function gSay(t,face){ const el=$('gSay'); if(el) el.textContent=t; sayFace(face); }
function gTop(){

function gSvg(){
  let s='<svg viewBox="0 0 '+G_SIZE+' '+G_SIZE+'" class="gsvg">';
  s+='<rect x="0" y="0" width="'+G_SIZE+'" height="'+G_SIZE+'" fill="#fdf8ea"/>';
  for(let i=0;i<G_N;i++){
    const p=G_M+i*G_G, e=G_M+(G_N-1)*G_G;
    s+='<line x1="'+G_M+'" y1="'+p+'" x2="'+e+'" y2="'+p+'" stroke="#d3c9b4" stroke-width="1"/>';
    s+='<line x1="'+p+'" y1="'+G_M+'" x2="'+p+'" y2="'+e+'" stroke="#d3c9b4" stroke-width="1"/>';
  }
  [[3,3],[11,3],[3,11],[11,11],[7,7]].forEach(function(p){
    s+='<circle cx="'+(G_M+p[0]*G_G)+'" cy="'+(G_M+p[1]*G_G)+'" r="3.2" fill="#c2b79f"/>';
  });
  s+='<g id="gStones"></g></svg>';
  return s;
}
function gTip(x,y,delay){
  const el=$('gSay'); if(el) el.textContent=delay;
}
function gDrawStones(){
  const el=$('gStones'); if(!el) return;
  let h='';
  for(let y=0;y<G_N;y++)for(let x=0;x<G_N;x++){
    const v=gBoard[y][x];
    if(!v) continue;
    const cx=G_M+x*G_G, cy=G_M+y*G_G;
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="12.5" fill="'
      +(v===G_YOU?'#3c3546':'#fffdf8')+'" stroke="'
      +(v===G_YOU?'#3c3546':'#b9b2a6')+'" stroke-width="1.4"/>';
  }
  if(gLast){
    const cx=G_M+gLast.x*G_G, cy=G_M+gLast.y*G_G;
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'
      +(gBoard[gLast.y][gLast.x]===G_YOU?'#fdf8ea':'#8a6a24')+'"/>';
  }
  el.innerHTML=h;
}
function gWin(x,y,v){
  for(let d=0;d<4;d++){
    const dx=G_DIR[d][0], dy=G_DIR[d][1];
    let c=1;
    for(let s=1;s<5;s++){
      const nx=x+dx*s, ny=y+dy*s;
      if(!gIn(nx,ny)||gBoard[ny][nx]!==v) break;
      c++;
    }
    for(let s=1;s<5;s++){
      const nx=x-dx*s, ny=y-dy*s;
      if(!gIn(nx,ny)||gBoard[ny][nx]!==v) break;
      c++;
    }
    if(c>=5) return true;
  }
  return false;
}
function gFull(){
  for(let y=0;y<G_N;y++)for(let x=0;x<G_N;x++) if(!gBoard[y][x]) return false;
  return true;
}
function gEmpty(){
  const a=[];
  for(let y=0;y<G_N;y++)for(let x=0;x<G_N;x++) if(!gBoard[y][x]) a.push({x:x,y:y});
  return a;
}
function gShape(cnt,open){
  if(cnt>=5) return 1000000;
  if(cnt===4) return open>=2?100000:(open===1?10000:0);
  if(cnt===3) return open>=2?8000:(open===1?600:0);
  if(cnt===2) return open>=2?400:(open===1?60:0);
  if(cnt===1) return open>=2?12:1;
  return 0;
}
function gScore(x,y,v){
  let tot=0;
  for(let d=0;d<4;d++){
    const dx=G_DIR[d][0], dy=G_DIR[d][1];
    let cnt=1, open=0;
    for(let s=1;s<5;s++){
      const nx=x+dx*s, ny=y+dy*s;
      if(!gIn(nx,ny)) break;
      const t=gBoard[ny][nx];
      if(t===v) cnt++;
      else { if(!t) open++; break; }
    }
    for(let s=1;s<5;s++){
      const nx=x-dx*s, ny=y-dy*s;
      if(!gIn(nx,ny)) break;
      const t=gBoard[ny][nx];
      if(t===v) cnt++;
      else { if(!t) open++; break; }
    }
    tot+=gShape(cnt,open);
  }
  return tot;
}
function gFindWin(v){
  const e=gEmpty();
  for(let i=0;i<e.length;i++){
    const p=e[i];
    gBoard[p.y][p.x]=v;
    const w=gWin(p.x,p.y,v);
    gBoard[p.y][p.x]=0;
    if(w) return p;
  }
  return null;
}
function gAiPick(){
  const L=G_LEVEL[gLevel]||G_LEVEL.wang;
  const w=gFindWin(G_AI);
  if(w) return w;
  if(gLevel==='li'){
    if(Math.random()<0.5){ const b=gFindWin(G_YOU); if(b) return b; }
  }else{
    const b=gFindWin(G_YOU);
    if(b) return b;
  }
  const e=gEmpty();
  let best=null, bs=-1;
  for(let i=0;i<e.length;i++){
    const p=e[i];
    const mine=gScore(p.x,p.y,G_AI);
    const opp=gScore(p.x,p.y,G_YOU);
    const s=mine*L.mine+opp*L.theirs+Math.random()*L.noise*1200*(gEasy?2.2:1);
    if(s>bs){ bs=s; best=p; }
  }
  return best;
}

/* 把「旁白 + 他说话」混排的一整段，拆进对话区 */
/* 台词里夹的动作（…）也拆出来，当单独一行的旁白 */
function splitInlines(txt){
  var out=[];
  /* 先把整段按（动作）切开 */
  var re=/（[^（）]*）/g, m, last=0;
  function pushText(t){
    t=String(t).replace(/^[ \u3000]+|[ \u3000]+$/g,'');
    if(!t) return;
    /* 只剩半边的引号：剥掉，别让它单独成行 */
    if(t.indexOf('\u300c')>=0 && t.indexOf('\u300d')<0) t=t.replace(/\u300c/g,'');
    if(t.indexOf('\u300d')>=0 && t.indexOf('\u300c')<0) t=t.replace(/\u300d/g,'');
    t=t.replace(/^[ \u3000]+|[ \u3000]+$/g,'');
    if(!t) return;
    /* 剩下的文字再按「」切开，一个引号算一句 */
    var re2=/「[^「」]*」/g, m2, l2=0, hit=false;
    while((m2=re2.exec(t))!==null){
      if(m2.index>l2){
        var mid=t.slice(l2,m2.index).replace(/[ \u3000]/g,'');
        if(mid) out.push({t:'say',v:mid});
      }
      out.push({t:'say',v:m2[0]}); hit=true;
      l2=m2.index+m2[0].length;
    }
    if(l2<t.length){
      var tl=t.slice(l2).replace(/[ \u3000]/g,'');
      if(tl) out.push({t:'say',v:tl});
    }
  }
  while((m=re.exec(txt))!==null){
    pushText(txt.slice(last,m.index));
    out.push({t:'nar',v:m[0].slice(1,-1)});
    last=m.index+m[0].length;
  }
  pushText(txt.slice(last));
  /* 被动作拦断的引号，拼回去 */
  for(var q=0;q<out.length-1;q++){
    if(out[q].t==='say' && out[q+1].t==='say'){
      var a=out[q].v, b=out[q+1].v;
      var open=(a.split('\u300c').length)-(a.split('\u300d').length);
      if(open>0){
        out[q].v=a+b.replace(/^[ \u3000]/,'');
        out.splice(q+1,1); q--;
      }
    }
  }
  if(!out.length) out.push({t:'say',v:txt});
  return out;
}
function playMixed(mixed, opt){

    }else{
      say(v);

  }
  String(mixed||'').split(/<br><br>/).forEach(function(p){
    if(!p) return;
    if(p.charAt(0)==='（'){
      /* 整行旁白：脱掉括号，单独一行 */
      narrate(p.replace(/^（/,'').replace(/）$/,''));

      splitInlines(p).forEach(function(x){

      return;
    }
    pushSay(p);
  });
}

/* 正好三子、两头空 = 活三 */
function gOpenThree(x,y,p){
  for(let d=0;d<4;d++){
    const dx=G_DIR[d][0], dy=G_DIR[d][1];
    let n=1, i, j;
    i=x+dx; j=y+dy;
    while(gIn(i,j) && gBoard[j][i]===p){ n++; i+=dx; j+=dy; }
    if(!gIn(i,j) || gBoard[j][i]!==0) continue;
    i=x-dx; j=y-dy;
    while(gIn(i,j) && gBoard[j][i]===p){ n++; i-=dx; j-=dy; }
    if(!gIn(i,j) || gBoard[j][i]!==0) continue;
    if(n===3) return true;
  }
  return false;
}

   敲一下，算一下。敲够一百零八，他会出声。
   音是现场合成的：低频下滑当「笃」，加一记高频当敲在木头上。
------------------------------------------------------------- */
const MUYU_GOAL=108;
const MUYU_LINES=[
  { at:1,   t:'……', face:'normal' },
  { at:10,  t:'敲这个做什么。', face:'normal' },
  { at:30,  t:'心静不下来？', face:'normal' },

const MUYU_DONE='一百零八。……够了。';
function ensureMuyu(){
  if(!S.muyu || typeof S.muyu!=='object' || (S.muyu instanceof Array)){
    S.muyu={total:0,round:0,done:0};
  }
  if(typeof S.muyu.total!=='number' || !isFinite(S.muyu.total) || S.muyu.total<0) S.muyu.total=0;
  if(typeof S.muyu.round!=='number' || !isFinite(S.muyu.round) || S.muyu.round<0) S.muyu.round=0;
  if(typeof S.muyu.done!=='number' || !isFinite(S.muyu.done) || S.muyu.done<0) S.muyu.done=0;
}
function knock(){
  const c=ac(); if(!c) return;
  const t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(300,t);
  o.frequency.exponentialRampToValueAtTime(138,t+0.09);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.14*sfxVol,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.2);
  const o2=c.createOscillator(), g2=c.createGain();
  o2.type='triangle'; o2.frequency.value=760;
  g2.gain.setValueAtTime(0.0001,t);
  g2.gain.linearRampToValueAtTime(0.032*sfxVol,t+0.002);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o2.connect(g2); g2.connect(c.destination); o2.start(t); o2.stop(t+0.06);
}

      splitInlines(p).forEach(function(x){

function scratchTotal(){
  let t=0;
  SCRATCH.forEach(function(x){ t+=x.w; });
  return t;
}
function scratchPick(){
  let r=Math.random()*scratchTotal();
  for(let i=0;i<SCRATCH.length;i++){
    r-=SCRATCH[i].w;
    if(r<=0) return SCRATCH[i];
  }
  return SCRATCH[0];
}

function dailyTick(){
  const now=Date.now();
  if(!S.lastTick){ S.lastTick=now; save(); return; }
  if(now-S.lastTick < 3600000) return;
  S.lastTick=now;
  let drop=0, why='';
  if(S.mood<30){ drop+=2; why='心情'; }
  if(now-(S.lastBath||0) > 24*3600000){
    drop+=2;
    why=why?(why+'、太久没洗澡'):'太久没洗澡';
  }
  if(drop>0){
    S.health=clamp(S.health-drop,0,100);
    toast('他今天不太舒服（'+why+'）。');

  S.full=Math.max(0,(S.full||0)-12);

function pickLine(arr, key){
  if(!arr || !arr.length) return '';
  pickLine._m=pickLine._m||{};
  const st=pickLine._m[key]||(pickLine._m[key]={used:[]});
  if(st.used.length>=arr.length) st.used=[];
  let i=0, g=0;
  do{ i=Math.floor(Math.random()*arr.length); g++; }while(st.used.indexOf(i)>=0 && g<60);
  if(st.used.indexOf(i)>=0) st.used=[];
  if(st.used.indexOf(i)<0) st.used.push(i);
  return arr[i];
}

function yardLocked(who,i){
  const tp=(YARD_TOPIC[who]||[])[i];

  else if(who==='li') have=S.liWang||0;
  else if(who==='shen') have=S.shenWang||0;
  return have < (tp.need||0);
}
function yardHide(who,i){

  if(tp.onlyLink && !S[tp.onlyLink]) return true;
  return false;
}

let cdMode='vs', cdFirst=null, cdLock=false, cdYours=0, cdHis=0, cdTurn='you';
let cdKnown={}, cdPairs={}, cdHeFirst=null;
let cdYouStreak=0, cdHeStreak=0;

function cdRnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function cdLeft(){ return 8-cdYours-cdHis; }
function cdSayT(t){ const sy=$('cdSay'); if(sy) sy.textContent=t; }
function cdSayH(t){ const sy=$('cdSay'); if(sy) sy.textContent='他：'+t; }
function cdHud(){

function cdElAt(p){

/* 进门先挑：自己玩，还是跟他玩 */
function cardOpen(){

function cdStart(mode){

function cardDeal(){
  const deck=[];
  for(let i=0;i<8;i++){ deck.push(i); deck.push(i); }
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=deck[i]; deck[i]=deck[j]; deck[j]=t;
  }
  cdFirst=null; cdHeFirst=null; cdLock=false;
  cdYours=0; cdHis=0; cdTurn='you';
  cdYouStreak=0; cdHeStreak=0;
  cdKnown={}; cdPairs={};
  const w=$('cdWrap'); if(!w) return;
  let h='';
  for(let i=0;i<16;i++){
    const v=deck[i];
    h+='<div class="cdcard" data-v="'+v+'" data-i="'+i+'"><div class="cdin">'
      +'<div class="cdback"></div>'
      +'<div class="cdface" style="background:'+CARD_COL[v]+';border-color:'+CARD_COL[v]+'">'
      +'<img src="'+CARD_SRC[v]+'"></div>'
      +'</div></div>';
  }
  w.innerHTML=h;
  const cs=w.querySelectorAll('.cdcard');
  for(let i=0;i<cs.length;i++){ cs[i].onclick=function(){ cardPick(this); }; }
  cdHud();
  if(cdMode==='solo') cdSayT('翻开两张，一样就成一对。慢慢记，不催你。');
  else cdSayH(cdRnd(CD_LINE.start));
}

/* 你翻 */
function cardPick(el){
  if(cdLock) return;
  if(cdMode!=='solo' && cdTurn!=='you') return;
  if(el.classList.contains('on') || el.classList.contains('done')) return;
  click();
  el.classList.add('on');
  const v=parseInt(el.getAttribute('data-v'),10);
  const p=parseInt(el.getAttribute('data-i'),10);
  if(cdMode!=='solo'){ if(Math.random()<CD_MEM) cdKnown[p]=v; }
  if(cdFirst===null){ cdFirst={el:el,pos:p,v:v}; return; }
  const a=cdFirst; cdFirst=null;
  if(a.v===v){
    a.el.classList.add('done'); el.classList.add('done');
    cdPairs[a.pos]=1; cdPairs[p]=1;
    cdYours++; cdHud();
    if(cdMode==='solo'){
      if(cdLeft()<=0 && cdYours>=8){ cdEnd(); return; }
      cdSayT('对了一对。还剩 '+(8-cdYours)+' 对。');
    } else {
      cdYouStreak++; cdHeStreak=0;
      if(cdLeft()<=0){ cdEnd(); return; }
      if(cdLeft()===1) cdSayH(cdRnd(CD_LINE.lastOne));
      else if(cdYouStreak>=3) cdSayH(cdRnd(CD_LINE.youStreak));
      else cdSayH(cdRnd(CD_LINE.praise));
    }
  } else {
    cdLock=true;
    const x=a.el, y=el;
    if(cdMode==='solo') cdSayT('不是同一张，翻回去。');
    else cdSayH(cdRnd(CD_LINE.youMiss));
    setTimeout(function(){
      x.classList.remove('on'); y.classList.remove('on');
      cdLock=false;
      if(cdMode!=='solo'){ cdYouStreak=0; cdTurn='he'; cdHeTurn(); }
    }, cdMode==='solo'?620:800);
  }
}

/* 他翻 */
function cdHeTurn(){
  if(cdMode==='solo') return;
  if(cdLeft()<=0 || cdTurn!=='he') return;
  cdLock=true;
  setTimeout(function(){ cdHeStep(1); }, 640);
}

function cdHePick(n){
  const free=[];
  for(let i=0;i<16;i++){
    if(cdPairs[i]) continue;
    if(cdHeFirst && cdHeFirst.pos===i) continue;
    free.push(i);
  }
  if(!free.length) return -1;
  const smart=Math.random()<CD_SMART;
  if(smart){
    if(n===2 && cdHeFirst){
      for(let k=0;k<free.length;k++){
        if(cdKnown[free[k]]===cdHeFirst.v) return free[k];
      }
    } else {
      for(let k=0;k<free.length;k++){
        const v=cdKnown[free[k]];
        if(v===undefined || v===null) continue;
        for(let k2=k+1;k2<free.length;k2++){
          if(cdKnown[free[k2]]===v) return free[k];
        }
      }
    }
  }
  return free[Math.floor(Math.random()*free.length)];
}

function cdHeStep(n){
  if(cdMode==='solo' || cdTurn!=='he') return;
  const p=cdHePick(n);
  const el=cdElAt(p);
  if(!el){ cdLock=false; return; }
  click();
  el.classList.add('on');
  const v=parseInt(el.getAttribute('data-v'),10);
  cdKnown[p]=v;
  if(n===1){
    cdHeFirst={el:el,pos:p,v:v};
    setTimeout(function(){ cdHeStep(2); }, 620);
    return;
  }
  const a=cdHeFirst; cdHeFirst=null;
  if(a.v===v){
    a.el.classList.add('done'); el.classList.add('done');
    cdPairs[a.pos]=1; cdPairs[p]=1;
    cdHis++; cdHud();
    cdHeStreak++; cdYouStreak=0;
    if(cdLeft()<=0){ cdEnd(); return; }
    if(cdLeft()===1) cdSayH(cdRnd(CD_LINE.lastOne));
    else if(cdHeStreak>=3) cdSayH(cdRnd(CD_LINE.hisStreak));
    else cdSayH(cdRnd(CD_LINE.hisPair));
    setTimeout(function(){ cdHeStep(1); }, 640);
  } else {
    cdSayH(cdRnd(CD_LINE.hisMiss));
    setTimeout(function(){
      a.el.classList.remove('on'); el.classList.remove('on');
      cdLock=false; cdTurn='you'; cdHeStreak=0;
      cdSayH('该你了。');
    }, 820);
  }
}

/* 收摊 */
function cdEnd(){
  if(cdLock) return;
  cdLock=true;
  const got=earnMoney(cdYours*2);
  S.money+=got; save(); refresh(); coin();

      +'<button class="mini grey" id="cdMode2" style="margin-left:6px;">换个玩法</button>';
  }
  const ag=$('cdAgain');
  if(ag) ag.onclick=function(){ click(); cardDeal(); };
  const m2=$('cdMode2');
