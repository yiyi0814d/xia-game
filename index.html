/* ---- 跳一跳（canvas 重写） ---- */
const JW=400, JH=220, JG=170, JX0=60;
let jCtx=null, j2Alive=false, j2RAF=null, j2Score=0, j2Plat=[];
let j2SX=JX0, j2SY=JG-26, j2Charge=0, j2Hold=false, j2Fly=null;
function jumpSay(t){ const el=$('jSay'); if(el) el.textContent=t; }
function jumpSc(){ const el=$('jScore'); if(el) el.textContent=j2Score+' 分'; }
function jumpDraw(){
  const c=jCtx; if(!c) return;
  c.clearRect(0,0,JW,JH);
  /* 底色交给 CSS（暖米），这里只清屏 */
  c.strokeStyle='rgba(46,40,54,.05)'; c.lineWidth=1;
  for(let i=0;i<JW;i+=20){ c.beginPath(); c.moveTo(i+.5,0); c.lineTo(i+.5,JH); c.stroke(); }
  for(let j=0;j<JH;j+=20){ c.beginPath(); c.moveTo(0,j+.5); c.lineTo(JW,j+.5); c.stroke(); }
  c.fillStyle='#dcd4c4'; c.strokeStyle='#cbc2b0';
  j2Plat.forEach(function(p){
    const x=Math.round(p.x);
    if(x>JW || x+p.w<0) return;
    c.fillRect(x,JG,p.w,18);
    c.strokeRect(x+.5,JG+.5,p.w-1,17);
  });
  c.fillStyle='#8a7fa8';
  c.fillRect(Math.round(j2SX-11), Math.round(j2SY), 22, 26);
  if(j2Hold && !j2Fly){
    c.fillStyle='rgba(46,40,54,.08)'; c.fillRect(20,JH-16,JW-40,7);
    c.fillStyle='#8a6a24'; c.fillRect(20,JH-16,(JW-40)*(j2Charge/60),7);
  }
}
function jumpNewPlat(){
  const last=j2Plat[j2Plat.length-1];
  const gap=50+Math.random()*110;
  j2Plat.push({ x:last.x+last.w+gap, w:44+Math.random()*26 });
}
function jumpReset(){
  j2Alive=true; j2Score=0; j2Charge=0; j2Hold=false; j2Fly=null;
  j2SX=JX0; j2SY=JG-26;
  j2Plat=[{x:40,w:70}];
  jumpNewPlat();
  jumpSc(); jumpSay('按住蓄力，松手就跳。');
  if(j2RAF) cancelAnimationFrame(j2RAF);
  jumpDraw();
  j2RAF=requestAnimationFrame(jumpLoop);
}
function jumpLoop(){
  if(!j2Alive) return;
  if(j2Hold && !j2Fly) j2Charge=Math.min(60, j2Charge+1.1);
  if(j2Fly){
    j2Fly.t+=1;
    const t=j2Fly.t/58;
    if(t>=1){
      jumpLand(j2Fly.x0+j2Fly.d);
      if(!j2Alive) return;
    }else{
      j2SX=j2Fly.x0+j2Fly.d*t;
      j2SY=(JG-26) - Math.sin(Math.PI*t)*70;
    }
  }else{
    j2SY=JG-26;
  }
  jumpDraw();
  j2RAF=requestAnimationFrame(jumpLoop);
}
function jumpLand(land){
  const hit=j2Plat.filter(function(p){ return land>=p.x+3 && land<=p.x+p.w-3; })[0];
  if(!hit){ jumpEnd(); return; }
  j2Score++;
  const shift=land-JX0;
  j2Plat.forEach(function(p){ p.x-=shift; });
  j2Plat=j2Plat.filter(function(p){ return p.x+p.w>-30; });
  jumpNewPlat();
  j2SX=JX0; j2SY=JG-26; j2Fly=null; j2Charge=0;
  jumpSc(); jumpSay('第 '+j2Score+' 格。');
  jumpDraw();
}
function jumpEnd(){
  j2Alive=false;
  if(j2RAF){ cancelAnimationFrame(j2RAF); j2RAF=null; }
  const got=earnMoney(j2Score);
  S.money+=got; save(); refresh(); coin();
  jumpSc();
  jumpSay(j2Score+' 分，到手 '+got+' 币。点一下再来一局。');
  jumpDraw();
}
function jumpStop(){ if(j2Alive && j2Score>0){ j2End(); } else { j2Alive=false; if(j2RAF){ cancelAnimationFrame(j2RAF); j2RAF=null; } } }
function jumpOpen(){
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="jBack">返回</button>'
    +'<h2>跳一跳</h2><span class="ecount" id="jScore">0 分</span></div>'
    +'<canvas id="jCv" width="400" height="220" class="gcv"></canvas>'
    +'<div class="esay" id="jSay">按住蓄力，松手就跳。</div>';
  const bk=$('jBack');
  if(bk) bk.onclick=function(){ click(); jumpStop(); renderEarn(); };
  const cv=$('jCv');
  if(cv){
    jCtx=cv.getContext ? cv.getContext('2d') : null;
    cv.onpointerdown=function(e){
      e.preventDefault();
      if(!j2Alive){ jumpReset(); return; }
      if(j2Fly || j2Hold) return;
      j2Hold=true;
      const up=function(){
        document.removeEventListener('pointerup', up);
        if(!j2Alive || j2Fly || !j2Hold) return;
        j2Hold=false;
        const d=40+j2Charge*2.2;
        j2Charge=0;
        j2Fly={ x0:j2SX, d:d, t:0 };
        click();
      };
      document.addEventListener('pointerup', up);
    };
  }
  jumpReset();
}

/* ---- 像素鸟（canvas；参数照依依给的「像素游戏.html」） ---- */
const BW=400, BH=220;
let bCtx=null, bRun=false, bRAF=null, bScore=0, bLastPipe=0, bT0=0;
let bBird={x:80,y:100,vy:0,r:8}, bPipes=[];
function birdSay(t){ const el=$('bSay'); if(el) el.textContent=t; }
function birdSc(){ const el=$('bScore'); if(el) el.textContent=bScore+' 分'; }
function birdDraw(){
  const c=bCtx; if(!c) return;
  c.clearRect(0,0,BW,BH);
  c.strokeStyle='rgba(46,40,54,.05)'; c.lineWidth=1;
  for(let i=0;i<BW;i+=20){ c.beginPath(); c.moveTo(i+.5,0); c.lineTo(i+.5,BH); c.stroke(); }
  for(let j=0;j<BH;j+=20){ c.beginPath(); c.moveTo(0,j+.5); c.lineTo(BW,j+.5); c.stroke(); }
  c.fillStyle='#c9c0aa';
  bPipes.forEach(function(p){
    const x=Math.round(p.x), w=p.w;
    c.fillRect(x,0,w,Math.round(p.gapY));
    c.fillRect(x,Math.round(p.gapY+p.gapH),w,BH-(p.gapY+p.gapH));
    c.fillStyle='#bdb39c';
    c.fillRect(x,Math.round(p.gapY)-4,w,4);
    c.fillRect(x,Math.round(p.gapY+p.gapH),w,4);
    c.fillStyle='#c9c0aa';
  });
  const bx=Math.round(bBird.x-bBird.r), by=Math.round(bBird.y-bBird.r), s=bBird.r*2;
  c.fillStyle='#8a7fa8'; c.fillRect(bx,by,s,s);
  c.fillStyle='#6f6490'; c.fillRect(bx+s-6,by+4,4,4);
}
function birdLoop(t){
  if(!bRun) return;
  if(!bT0) bT0=t;
  bBird.vy+=0.15;
  bBird.y+=bBird.vy;
  if(bBird.y-bBird.r<0){ bBird.y=bBird.r; bBird.vy=0; }
  if(bBird.y+bBird.r>BH){ birdEnd(); return; }
  if(t-bLastPipe>2200){
    bLastPipe=t;
    bPipes.push({ x:BW, w:50, gapY:50+Math.random()*60, gapH:140, passed:false });
  }
  for(let i=bPipes.length-1;i>=0;i--){
    const p=bPipes[i];
    p.x-=1.5;
    if(p.x+p.w<0){ bPipes.splice(i,1); continue; }
    if(bBird.x+bBird.r>p.x && bBird.x-bBird.r<p.x+p.w){
      if(bBird.y-bBird.r<p.gapY || bBird.y+bBird.r>p.gapY+p.gapH){ birdEnd(); return; }
    }
    if(!p.passed && p.x+p.w<bBird.x){ p.passed=true; bScore+=10; ping(); birdSc(); }
  }
  birdDraw();
  bRAF=requestAnimationFrame(birdLoop);
}
function birdReset(){
  bBird={x:80,y:100,vy:0,r:8};
  bPipes=[{ x:320, w:50, gapY:60, gapH:140, passed:false }];
  bScore=0; bLastPipe=0; bT0=0; bRun=true;
  if(bRAF) cancelAnimationFrame(bRAF);
  birdSc(); birdSay('点一下，往上顶。');
  birdDraw();
  bRAF=requestAnimationFrame(birdLoop);
}
function birdFlap(){ if(!bRun) return; bBird.vy=-3.0; click(); }
function birdEnd(){
  bRun=false;
  if(bRAF){ cancelAnimationFrame(bRAF); bRAF=null; }
  const pts=Math.floor(bScore/10);
  const got=earnMoney(pts);
  S.money+=got; save(); refresh(); coin();
  birdSc();
  birdSay(bScore+' 分（过了 '+pts+' 根），到手 '+got+' 币。点一下再来一局。');
}
function birdStop(){ if(bRun && bScore>0){ birdEnd(); } else { bRun=false; if(bRAF){ cancelAnimationFrame(bRAF); bRAF=null; } } }
function birdOpen(){
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="bBack">返回</button>'
    +'<h2>像素鸟</h2><span class="ecount" id="bScore">0 分</span></div>'
    +'<canvas id="bCv" width="400" height="220" class="gcv" id="bCv"></canvas>'
    +'<div class="esay" id="bSay">点一下，往上顶。</div>';
  const bk=$('bBack');
  if(bk) bk.onclick=function(){ click(); birdStop(); renderEarn(); };
  const cv=$('bCv');
  if(cv){
    bCtx=cv.getContext ? cv.getContext('2d') : null;
    cv.onpointerdown=function(e){ e.preventDefault(); if(bRun) birdFlap(); else birdReset(); };
  }
  birdReset();
}

/* ---- 贪吃蛇（canvas；参数照同一个文件） ---- */
const SW=400, SH=220, SCELL=20, SCN=20, SRN=11;
let sCtx=null, sRun=false, sRAF=null, sScore=0, sLastMove=0, sLastDirT=0;
let sBody=[], sDir={dx:1,dy:0}, sFood={x:15,y:5};
let sSpeed='mid';
const SN_SPEED={slow:330,mid:260,fast:170};
const SN_MUL={slow:1.6,mid:1.0,fast:1.5};
function snakeSay(t){ const el=$('sSay'); if(el) el.textContent=t; }
function snakeSc(){ const el=$('sScore'); if(el) el.textContent=sScore+' 分'; }
function snakeDraw(){
  const c=sCtx; if(!c) return;
  c.clearRect(0,0,SW,SH);
  c.strokeStyle='rgba(46,40,54,.05)'; c.lineWidth=1;
  for(let i=0;i<=SCN;i++){ c.beginPath(); c.moveTo(i*SCELL+.5,0); c.lineTo(i*SCELL+.5,SH); c.stroke(); }
  for(let j=0;j<=SRN;j++){ c.beginPath(); c.moveTo(0,j*SCELL+.5); c.lineTo(SW,j*SCELL+.5); c.stroke(); }
  c.fillStyle='#c98a4b';
  c.fillRect(sFood.x*SCELL+3,sFood.y*SCELL+3,SCELL-6,SCELL-6);
  for(let i=sBody.length-1;i>=0;i--){
    const s=sBody[i];
    c.fillStyle=(i===0)?'#6f6490':'#8a7fa8';
    c.fillRect(s.x*SCELL+1,s.y*SCELL+1,SCELL-2,SCELL-2);
  }
}
function snakeFoodPut(){
  let ok=false, g=0;
  while(!ok && g++<500){
    sFood={ x:Math.floor(Math.random()*SCN), y:Math.floor(Math.random()*SRN) };
    ok=!sBody.some(function(s){ return s.x===sFood.x && s.y===sFood.y; });
  }
}
function snakeLoop(t){
  if(!sRun) return;
  if(t-sLastMove>SN_SPEED[sSpeed]){
    sLastMove=t;
    const head={ x:sBody[0].x+sDir.dx, y:sBody[0].y+sDir.dy };
    if(head.x<0 || head.x>=SCN || head.y<0 || head.y>=SRN){ snakeEnd(); return; }
    if(sBody.some(function(s){ return s.x===head.x && s.y===head.y; })){ snakeEnd(); return; }
    sBody.unshift(head);
    if(head.x===sFood.x && head.y===sFood.y){
      sScore+=10; ping(); snakeFoodPut(); snakeSc();
    }else{
      sBody.pop();
    }
  }
  snakeDraw();
  sRAF=requestAnimationFrame(snakeLoop);
}
function snakeReset(){
  sBody=[{x:10,y:5},{x:9,y:5},{x:8,y:5}];
  sDir={dx:1,dy:0}; sFood={x:15,y:5};
  sScore=0; sLastMove=-1e6; sLastDirT=0; sRun=true;
  if(sRAF) cancelAnimationFrame(sRAF);
  const sp0=$('sSay'); if(sp0) sp0.style.display='';
  snakeSc();
  const nm={slow:'慢',mid:'中',fast:'快'}[sSpeed]||'中';
  snakeSay('速度 '+nm+'，倍率 ×'+(SN_MUL[sSpeed]||1)+'。下面四个方向，吃一个长一截。');
  snakeDraw();
  sRAF=requestAnimationFrame(snakeLoop);
}
function snakeDirSet(d){
  if(!sRun) return;
  const now=Date.now();
  if(now-(sLastDirT||0)<150) return;
  sLastDirT=now;
  if(d==='up' && sDir.dy===0) sDir={dx:0,dy:-1};
  else if(d==='down' && sDir.dy===0) sDir={dx:0,dy:1};
  else if(d==='left' && sDir.dx===0) sDir={dx:-1,dy:0};
  else if(d==='right' && sDir.dx===0) sDir={dx:1,dy:0};
}
function snakeEnd(){
  sRun=false;
  if(sRAF){ cancelAnimationFrame(sRAF); sRAF=null; }
  const pts=Math.floor(sScore/10);
  const mul=SN_MUL[sSpeed]||1;
  const got=earnMoney(Math.round(pts*mul));
  S.money+=got; save(); refresh(); coin();
  snakeSc();
  snakeSay(sScore+' 分（吃了 '+pts+' 个），到手 '+got+' 币。点「重来」再来一局。');
}
function snStop(){ if(sRun && sScore>0){ snakeEnd(); } else { sRun=false; if(sRAF){ cancelAnimationFrame(sRAF); sRAF=null; } } }
function snOpen(){
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="sBack">返回</button>'
    +'<h2>贪吃蛇</h2><span class="ecount" id="sScore">0 分</span></div>'
    +'<div class="snspd" id="sSpd">'
    +'<p class="snspdt">选个速度再开始 —— 越快，同样吃一个，到手越多。</p>'
    +'<button data-spd="slow">慢 · ×1.6</button>'
    +'<button data-spd="mid">中 · ×1.0</button>'
    +'<button data-spd="fast">快 · ×1.5</button>'
    +'</div>'
    +'<div id="sPlay" style="display:none">'
    +'<canvas id="sCv" width="400" height="220" class="gcv"></canvas>'
    +'<div class="sndp" id="sDp">'
    +'<span class="sp"></span><button data-d="up">▲</button><span class="sp"></span>'
    +'<button data-d="left">◀</button><button data-d="reset">重来</button><button data-d="right">▶</button>'
    +'<span class="sp"></span><button data-d="down">▼</button><span class="sp"></span>'
    +'</div>'
    +'<div class="esay" id="sSay">吃一个，长一截。</div></div>';
  const bk=$('sBack');
  if(bk) bk.onclick=function(){ click(); snStop(); renderEarn(); };
  const cv=$('sCv');
  if(cv) sCtx=cv.getContext ? cv.getContext('2d') : null;
  Array.prototype.forEach.call(other.querySelectorAll('#sSpd button'),function(x){
    x.onclick=function(){
      click();
      sSpeed=x.getAttribute('data-spd');
      const sp=$('sSpd'), pl=$('sPlay');
      if(sp) sp.style.display='none';
      if(pl) pl.style.display='';
    };
  });
  const say0=$('sSay');
  if(say0) say0.style.display='none';
  Array.prototype.forEach.call(other.querySelectorAll('#sDp button'),function(x){
    x.onclick=function(){
      click();
      const d=x.getAttribute('data-d');
      if(d==='reset'){ snakeReset(); return; }
      snakeDirSet(d);
    };
  });
  snakeReset();
}

/* ---- 水果合成（原版：自由落 + 同级碰一起合成） ---- */
const FW=400, FH=320, FLINE=70;
const FR=[0,12,16,21,27,34,43];
const FC=['','#9dbf8f','#c98a8a','#d8a24f','#c9705a','#7f9fbf','#8a6a24'];
let fCtx=null, fRun=false, fRAF=null, fBalls=[], fScore=0, fNext=1, fCool=0, fTopT=0;
function fmSay(t){ const el=$('fmSay'); if(el) el.textContent=t; }
function fmSc(){ const el=$('fmScore'); if(el) el.textContent=fScore+' 分'; }
function fmDraw(){
  const c=fCtx; if(!c) return;
  c.clearRect(0,0,FW,FH);
  c.strokeStyle='rgba(201,112,90,.45)'; c.setLineDash([6,6]); c.lineWidth=1;
  c.beginPath(); c.moveTo(0,FLINE+.5); c.lineTo(FW,FLINE+.5); c.stroke();
  c.setLineDash([]);
  c.globalAlpha=.45;
  c.fillStyle=FC[fNext];
  c.beginPath(); c.arc(28, 26, FR[fNext], 0, 6.2832); c.fill();
  c.globalAlpha=1;
  c.fillStyle='#9a93a1'; c.font='11px sans-serif';
  c.fillText('下一个', 46, 30);
  fBalls.forEach(function(a){
    c.fillStyle=FC[a.lv];
    c.beginPath(); c.arc(a.x, a.y, a.r, 0, 6.2832); c.fill();
    c.fillStyle='rgba(255,255,255,.5)';
    c.beginPath(); c.arc(a.x-a.r*0.3, a.y-a.r*0.35, a.r*0.22, 0, 6.2832); c.fill();
  });
}
function fmPhysics(){
  for(let i=0;i<fBalls.length;i++){
    const a=fBalls[i];
    a.vy+=0.5; a.x+=a.vx; a.y+=a.vy; a.vx*=0.995;
    if(a.x-a.r<0){ a.x=a.r; a.vx=Math.abs(a.vx)*0.4; }
    if(a.x+a.r>FW){ a.x=FW-a.r; a.vx=-Math.abs(a.vx)*0.4; }
    if(a.y+a.r>FH){
      a.y=FH-a.r;
      a.vy=-Math.abs(a.vy)*0.18;
      a.vx*=0.9;
      if(Math.abs(a.vy)<0.7) a.vy=0;
    }
  }
  for(let it=0; it<3; it++){
    for(let i=0;i<fBalls.length;i++){
      for(let j=i+1;j<fBalls.length;j++){
        const a=fBalls[i], b2=fBalls[j];
        let dx=b2.x-a.x, dy=b2.y-a.y;
        let d=Math.sqrt(dx*dx+dy*dy);
        if(d<0.001){ dx=0.01; d=0.01; }
        const min=a.r+b2.r;
        if(a.lv===b2.lv && a.lv<6 && d<min*1.12){
          const lv=a.lv+1;
          a.lv=lv; a.r=FR[lv];
          a.x=(a.x+b2.x)/2; a.y=(a.y+b2.y)/2;
          a.vx=(a.vx+b2.vx)/2*0.6;
          a.vy=(a.vy+b2.vy)/2*0.6-0.6;
          fBalls.splice(j,1);
          fScore+=lv*2; ping(); fmSc();
          if(addMood) addMood(1);
          j--; continue;
        }
        if(d>=min) continue;
        const nx=dx/d, ny=dy/d, push=(min-d)*0.5;
        a.x-=nx*push; a.y-=ny*push;
        b2.x+=nx*push; b2.y+=ny*push;
        a.vx*=0.88; a.vy*=0.88;
        b2.vx*=0.88; b2.vy*=0.88;
      }
    }
  }
}
function fmTopOver(){
  let over=false;
  fBalls.forEach(function(a){
    if(a.y-a.r<FLINE && Math.abs(a.vy)<0.9) over=true;
  });
  return over;
}
function fmLoop(){
  if(!fRun) return;
  if(fCool>0) fCool--;
  fmPhysics();
  if(fmTopOver()){ fTopT++; if(fTopT>55){ fmGameEnd(); return; } }
  else fTopT=0;
  fmDraw();
  fRAF=requestAnimationFrame(fmLoop);
}
function fmReset(){
  fBalls=[]; fScore=0; fCool=0; fTopT=0; fRun=true;
  fNext=(Math.random()<0.85)?1:2;
  if(fRAF) cancelAnimationFrame(fRAF);
  fmSc(); fmSay('点哪落哪。两个一样的撞一起就合成。');
  fmDraw();
  fRAF=requestAnimationFrame(fmLoop);
}
function fmDropAt(x){
  if(!fRun || fCool>0) return;
  const lv=fNext;
  const r=FR[lv];
  const px=Math.max(r+2, Math.min(FW-r-2, x));
  fBalls.push({ x:px, y:FLINE-r-4, r:r, vx:0, vy:0, lv:lv });
  fNext=(Math.random()<0.85)?1:2;
  fCool=18;
  click();
}
function fmGameEnd(){
  fRun=false;
  if(fRAF){ cancelAnimationFrame(fRAF); fRAF=null; }
  const pts=Math.floor(fScore/10);
  const got=earnMoney(pts);
  S.money+=got; save(); refresh(); coin();
  fmSc();
  fmSay(fScore+' 分，到手 '+got+' 币。点「重来」再来一局。');
}
function fmStop(){ if(fRun && fScore>0){ fmEnd(); } else { fRun=false; if(fRAF){ cancelAnimationFrame(fRAF); fRAF=null; } } }
function fmOpen(){
  click();
  other.classList.add('show');
  other.innerHTML='<div class="ghead"><button class="mini grey" id="fBack">返回</button>'
    +'<h2>水果合成</h2><span class="ecount" id="fmScore">0 分</span></div>'
    +'<canvas id="fCv" width="400" height="320" class="gcv" style="height:auto"></canvas>'
    +'<div class="sndp" style="grid-template-columns:1fr 1fr">'
    +'<button id="fmRe">重来</button><button id="fmHelp">怎么玩</button></div>'
    +'<div class="esay" id="fmSay">点哪落哪。</div>';
  const bk=$('fBack');
  if(bk) bk.onclick=function(){ click(); fmStop(); renderEarn(); };
  const re=$('fmRe'); if(re) re.onclick=function(){ click(); fmReset(); };
  const hp=$('fmHelp');
  if(hp) hp.onclick=function(){
    click();
    fmSay('葡萄→樱桃→橘子→苹果→西瓜→果王。两个一样的撞在一起就升一级。堆过上面那条虚线就结束。');
  };
  const cv=$('fCv');
  if(cv){
    fCtx=cv.getContext ? cv.getContext('2d') : null;
    cv.onpointerdown=function(e){
      e.preventDefault();
      const rect=cv.getBoundingClientRect();
      const x=(e.clientX-rect.left)*(FW/rect.width);
      fmDropAt(x);
    };
  }
  fmReset();
}

/* 立绘去白底：只把与图边相连的白扫掉，不动他身上的白 */
function prepChar(){
  const im=new Image();
  im.onload=function(){
    try{
      const w=im.naturalWidth,h=im.naturalHeight;
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      const cx=cv.getContext("2d");cx.drawImage(im,0,0);
      const id=cx.getImageData(0,0,w,h),d=id.data,N=w*h;
      const flag=new Uint8Array(N);
      const isW=function(i){const p=i*4;return d[p]>=246&&d[p+1]>=246&&d[p+2]>=246;};
      const st=[];
      for(let x=0;x<w;x++){st.push(x);st.push((h-1)*w+x);}
      for(let y=0;y<h;y++){st.push(y*w);st.push(y*w+w-1);}
      while(st.length){
        const i=st.pop();
        if(flag[i]||!isW(i))continue;
        flag[i]=1;
        const x=i%w,y=(i-x)/w;
        if(x>0)st.push(i-1);
        if(x<w-1)st.push(i+1);
        if(y>0)st.push(i-w);
        if(y<h-1)st.push(i+w);
      }
      for(let i=0;i<N;i++){ if(flag[i]) d[i*4+3]=0; }
      cx.putImageData(id,0,0);
      const url=cv.toDataURL("image/png");
      charEl.src=url;
      if(char2) char2.src=url;
    }catch(err){}
  };
  im.src=IMG.char;
}

/* ===== 白方块 v3：自己挑一层待着，全屏溜达，被找到 +50 ===== */
(function(){
  var PAGES=['home','earn','other'], HOME='home';
  var at=HOME;                       /* 它现在在哪一页：客厅/赚钱/其他 */
  var el=null, bx=40, by=6, timer=null, steps=0, busy=false;

  function curPage(){
    try{ return curTab; }catch(e){ return 'home'; }
  }

  /* 换一层待着：在客厅就多半往外跑，在外面就三成回家 */
  function moveHouse(){
    var others=PAGES.filter(function(k){ return k!==at; });
    if(at===HOME){
      if(Math.random()<0.66) at=others[Math.floor(Math.random()*others.length)];
    }else{
      if(Math.random()<0.34) at=HOME;
    }
  }

  function blkOn(){
    try{ return !S || S.blkOn !== 0; }catch(e){ return true; }
  }
  function step(){
    if(!el) return;
    if(typeof blkOn==='function' && !blkOn()){
      if(el.style.display!=='none') el.style.display='none';
      timer=setTimeout(step,800); return;
    }
    if(!blkOn()){
      if(el.style.display!=='none') el.style.display='none';
      timer=setTimeout(step,800); return;
    }
    if(curPage()!==at){                       /* 玩家在别的页，它不跟着 */
      if(el.style.display!=='none') el.style.display='none';
      timer=setTimeout(step,600); return;
    }
    el.style.display='block';

    var nx=3+Math.random()*82;                /* 全屏都能去 */
    var ny=3+Math.random()*66;
    var d=Math.abs(nx-bx)+Math.abs(ny-by)*0.9;
    var dur=Math.max(1100, d*24);
    el.style.transitionDuration=(dur/1000)+'s,'+(dur/1000)+'s';
    bx=nx; by=ny;
    el.style.left=nx+'%';
    el.style.bottom=ny+'%';

    steps++;
    if(steps >= 7+Math.floor(Math.random()*9)){ steps=0; moveHouse(); }
    timer=setTimeout(step, dur+500+Math.random()*2300);
  }

  function blinkLoop(){
    setTimeout(function(){
      if(el && el.style.display!=='none' && !busy){
        el.classList.add('blink');
        setTimeout(function(){ el.classList.remove('blink'); },140);
      }
      blinkLoop();
    }, 2600+Math.random()*4200);
  }

  function init(){
    el=document.getElementById('blk');
    if(!el) return;
    window.__blkHide=function(){
      if(!el) return;
      if(blkOn()){ step(); }
      else { el.style.display='none'; }
    };
    el.style.left=bx+'%'; el.style.bottom=by+'%';
    el.addEventListener('click',function(){
      if(typeof click==='function') click();

      /* 在外面被点中 —— 找到了，给钱，然后回家 */
      if(at!==HOME && curPage()===at){
        S.money+=50; save(); refresh();
        if(typeof coin==='function') coin();
        if(typeof toast==='function') toast('找到它了。+50');
        at=HOME; bx=40; by=6;
        el.style.display='none';
        return;
      }

      /* 在客厅点它：只眨眼或笑 */
      if(busy) return;
      busy=true;
      el.classList.remove('blink');
      if(Math.random()<0.5){
        el.classList.add('blink');
        setTimeout(function(){ el.classList.remove('blink'); },320);
      }else{
        el.classList.add('smile');
        setTimeout(function(){ el.classList.remove('smile'); },900);
      }
      setTimeout(function(){ busy=false; },380);
    });
    step(); blinkLoop();
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,0); });
  }else{
    setTimeout(init,0);
  }
})();
</script>
